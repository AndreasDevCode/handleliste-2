    }
  }

  /* Tabellen er diagrammets tvilling: de samme tallene, lesbare uten å treffe
   * en søyle – og for skjermleser. */
  function buildCostTable (periods, totals) {
    var tbody = el('tbody');
    for (var i = periods.length - 1; i >= 0; i--) {
      tbody.appendChild(el('tr', {}, [
        el('td', { text: periods[i].title + (periods[i].current ? ' (så langt)' : '') }),
        el('td', { text: String(totals[i].count) }),
        el('td', { text: formatKrRounded(totals[i].sum) })
      ]));
    }
    return el('details', { class: 'cost-table' }, [
      el('summary', { text: 'Vis som tabell' }),
      el('table', {}, [
        el('thead', {}, [el('tr', {}, [
          el('th', { text: costMode === 'weeks' ? 'Uke' : 'Måned' }),
          el('th', { text: 'Turer' }),
          el('th', { text: 'Beløp' })
        ])]),
        tbody
      ])
    ]);
  }

  /* Søylediagram tegnet som SVG i appen selv: virker uten nett og følger
   * mørk modus. Én grønn tone; den pågående perioden et lysere trinn av samme
   * tone. Tynne søyler med avrundet topp og flat bunn, hårfine rutelinjer. */
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl (tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function barPath (x, y, w, h) {
    if (h <= 0) return '';
    var r = Math.min(4, h, w / 2);
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
           'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  function buildBarChart (periods, totals, onSelect) {
    var W = 360, H = 190, padL = 42, padR = 8, padT = 28, padB = 24;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var n = periods.length, slot = plotW / n;
    var barW = Math.min(24, slot - 8);

    var maxKr = Math.max.apply(null, totals.map(function (t) { return t.sum / 100; }).concat([0]));
    var step = niceStep(maxKr);
    var topKr = Math.max(step, Math.ceil(maxKr / step) * step);
    function yOf (kr) { return padT + plotH - (kr / topKr) * plotH; }

    var svg = svgEl('svg', {
      viewBox: '0 0 ' + W + ' ' + H, class: 'chart-svg', role: 'img',
      'aria-label': (costMode === 'weeks' ? 'Kostnad per uke' : 'Kostnad per måned') + ', siste ' + n
    });

    var bandLayer = svgEl('g', {});
    svg.appendChild(bandLayer);
    for (var v = 0; v <= topKr + 0.001; v += step) {
      var gy = Math.round(yOf(v)) + 0.5;
      svg.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: gy, y2: gy, class: 'chart-grid' }));
      var tick = svgEl('text', { x: padL - 6, y: gy + 3.5, 'text-anchor': 'end', class: 'chart-tick' });
      tick.textContent = groupThousands(Math.round(v));
      svg.appendChild(tick);
    }

    var bars = [], labels = [], hits = [];
    periods.forEach(function (p, i) {
      var kr = totals[i].sum / 100;
      var x = padL + i * slot + (slot - barW) / 2;
      var h = (kr / topKr) * plotH;
      var path = svgEl('path', {
        d: barPath(x, padT + plotH - h, barW, h),
        class: 'chart-bar' + (p.current ? ' is-partial' : '')
      });
      svg.appendChild(path);
      bars.push({ x: x, h: h });
      var lab = svgEl('text', { x: padL + i * slot + slot / 2, y: H - 7, 'text-anchor': 'middle', class: 'chart-x' });
      lab.textContent = p.short;
      svg.appendChild(lab);
      labels.push(lab);
    });

    var valueLabel = svgEl('text', { 'text-anchor': 'middle', class: 'chart-value' });
    svg.appendChild(valueLabel);

    var wrap = el('div', { class: 'chart-wrap' });
    var tip = null;
    function hideTip () { if (tip && tip.parentNode) tip.parentNode.removeChild(tip); tip = null; }
    function showTip (i) {
      hideTip();
      var leftPct = ((padL + i * slot + slot / 2) / W) * 100;
      var topPct = ((padT + plotH - bars[i].h) / H) * 100;
      tip = el('div', { class: 'chart-tip' }, [
        el('strong', { text: formatKrRounded(totals[i].sum) }),
        el('span', { text: periods[i].title + (periods[i].current ? ' · så langt' : '') })
      ]);
      tip.style.left = Math.min(86, Math.max(14, leftPct)) + '%';
      tip.style.top = topPct + '%';
      wrap.appendChild(tip);
    }

    /* Treffområdet er hele kolonnen, ikke bare søylen – også en tom uke kan velges. */
    periods.forEach(function (p, i) {
      var hit = svgEl('rect', {
        x: padL + i * slot, y: padT - 4, width: slot, height: plotH + padB + 4,
        class: 'chart-hit', tabindex: '0', role: 'button', 'data-index': String(i),
        'aria-label': p.title + (p.current ? ' så langt' : '') + ': ' + formatKrRounded(totals[i].sum)
      });
      hit.addEventListener('click', function () { onSelect(i); });
      hit.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect(i); }
        if (e.key === 'ArrowRight' && i < n - 1) { e.preventDefault(); hits[i + 1].focus(); onSelect(i + 1); }
        if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); hits[i - 1].focus(); onSelect(i - 1); }
      });
      hit.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') showTip(i); });
      hit.addEventListener('pointerleave', hideTip);
      svg.appendChild(hit);
      hits.push(hit);
    });
    wrap.appendChild(svg);

    function select (i) {
      while (bandLayer.firstChild) bandLayer.removeChild(bandLayer.firstChild);
      bandLayer.appendChild(svgEl('rect', {
        x: padL + i * slot + 1, y: padT - 20, width: slot - 2, height: plotH + 20, rx: 6, class: 'chart-band'
      }));
      labels.forEach(function (l, j) { l.setAttribute('class', 'chart-x' + (j === i ? ' is-selected' : '')); });
      hits.forEach(function (h, j) { h.setAttribute('aria-pressed', String(j === i)); });
      /* Bare den valgte søylen får tallet sitt – resten står i tabellen. */
      var txt = formatKrRounded(totals[i].sum);
      var half = txt.length * 3.1;
      var cx = Math.min(W - padR - half, Math.max(padL + half, padL + i * slot + slot / 2));
      /* Tallet står øverst i den markerte kolonnen, over selve plottet – der
       * kan ingen nabosøyle være høyere og skjule det. */
      valueLabel.setAttribute('x', cx);
      valueLabel.setAttribute('y', padT - 8);
      valueLabel.textContent = txt;
    }

    return { node: wrap, select: select };
  }

  /* Turene, nyeste først, gruppert per måned med månedens sum i overskriften. */
  function buildTripList () {
    var wrap = el('div', { class: 'trip-section' });
    wrap.appendChild(el('div', { class: 'trip-section-head' }, [
      el('h3', { text: 'Handleturer' }),
      el('span', { text: state.trips.length + (state.trips.length === 1 ? ' tur' : ' turer') + ' registrert' })
    ]));

    var newest = state.trips.slice().reverse();
    var LIMIT = 40;
    var shown = costShowAllTrips ? newest : newest.slice(0, LIMIT);
    var monthSums = {};
    newest.forEach(function (t) { var k = t.date.slice(0, 7); monthSums[k] = (monthSums[k] || 0) + t.amount; });

    var currentMonth = null, listEl = null;
    shown.forEach(function (t) {
      var mk = t.date.slice(0, 7);
      if (mk !== currentMonth) {
        currentMonth = mk;
        var d0 = parseYmd(t.date);
        wrap.appendChild(el('div', { class: 'trip-month' }, [
          el('span', { text: capitalize(MONTH_NAMES[d0.getMonth()]) + ' ' + d0.getFullYear() }),
          el('span', { text: formatKrRounded(monthSums[mk]) })
        ]));
        listEl = el('div', { class: 'trip-list' });
        wrap.appendChild(listEl);
      }
      var d = parseYmd(t.date);
      var row = el('button', { type: 'button', class: 'trip-item' }, [
        el('span', {}, [
          el('span', { class: 'trip-date', text: DAY_NAMES[(d.getDay() + 6) % 7] + ' ' + d.getDate() + '. ' + MONTH_SHORT[d.getMonth()] }),
          t.addedBy ? el('span', { class: 'trip-who', text: t.addedBy }) : null
        ]),
        el('span', { class: 'trip-amount', text: formatKr(t.amount) })
      ]);
      row.addEventListener('click', function () { showTripModal(t); });
      listEl.appendChild(row);
    });

    if (!costShowAllTrips && newest.length > LIMIT) {
      var more = el('button', { type: 'button', class: 'trip-more', text: 'Vis alle ' + newest.length + ' turer' });
      more.addEventListener('click', function () { costShowAllTrips = true; render(); });
      wrap.appendChild(more);
    }
    return wrap;
  }

  function buildAskTripSetting () {
    var box = el('input', { type: 'checkbox', class: 'ask-trip-toggle' });
    box.checked = getAskTrip();
    box.addEventListener('change', function () { setAskTrip(box.checked); });
    return el('label', { class: 'setting-row' }, [
      box,
      el('span', {}, [
        document.createTextNode('Spør hva handleturen kostet når jeg tømmer avkryssede varer'),
        el('small', { text: 'Gjelder bare denne telefonen.' })
      ])
    ]);
  }

  /* ============================== kostnad: vinduer ============================== */

  /* Registrere en ny tur, eller rette en som finnes. */
  function showTripModal (trip, opts) {
    opts = opts || {};
    closeOverlay();
    var today = todayDate();

    var amountInput = el('input', {
      type: 'text', inputmode: 'decimal', class: 'trip-amount-input', autocomplete: 'off',
      placeholder: '0', value: trip ? amountInputValue(trip.amount) : '', 'aria-label': 'Beløp i kroner'
    });
    var dateInput = el('input', {
      type: 'date', class: 'trip-date-input', value: trip ? trip.date : ymdOf(today),
      max: ymdOf(today), min: oldestTripYmd(), 'aria-label': 'Dato'
    });
    var err = el('p', { class: 'field-error' });
    err.style.display = 'none';

    var cancelBtn = el('button', { class: 'secondary', type: 'button', text: opts.afterClear ? 'Hopp over' : 'Avbryt' });
    cancelBtn.addEventListener('click', closeOverlay);
    var saveBtn = el('button', { class: 'primary', type: 'submit', text: 'Lagre' });

    /* novalidate: appen sjekker selv og sier fra på norsk. Ellers stopper
     * nettleseren en dato etter «max» med sin egen boble, og forklaringen
     * under feltet kommer aldri fram. */
    var form = el('form', { novalidate: '' }, [
      el('div', { class: 'trip-field-row' }, [
        el('label', {}, [el('span', { class: 'menu-field-label', text: 'Beløp (kr)' }), amountInput]),
        el('label', {}, [el('span', { class: 'menu-field-label', text: 'Dato' }), dateInput])
      ]),
      err,
      el('div', { class: 'modal-actions' }, [cancelBtn, saveBtn])
    ]);
    function fail (msg) { err.textContent = msg; err.style.display = ''; }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var ore = parseAmount(amountInput.value);
      if (ore === null) { fail('Skriv beløpet som et tall, for eksempel 1247,80.'); amountInput.focus(); return; }
      var d = parseYmd(dateInput.value);
      if (!d) { fail('Velg en dato.'); return; }
      if (d > today) { fail('Datoen kan ikke være fram i tid.'); return; }
      if (ymdOf(d) < oldestTripYmd()) { fail('Handleturer tas bare vare på i to år.'); return; }
      if (trip) updateTrip(trip.id, ymdOf(d), ore);
      else addTrip(ymdOf(d), ore);
      closeOverlay();
      render();
    });

    var kids = [el('h2', { text: trip ? 'Rett handletur' : (opts.afterClear ? 'Hva kostet handleturen?' : 'Registrer handletur') })];
    if (opts.afterClear) kids.push(el('p', { text: 'De avkryssede varene er fjernet fra listen.' }));
    kids.push(form);

    var extras = [];
    if (trip) {
      var tripDate = parseYmd(trip.date);
      var menuLink = el('button', { type: 'button', class: 'link-btn trip-week-link', text: 'Se ukesmenyen for uke ' + isoWeek(tripDate).week });
      menuLink.addEventListener('click', function () { showWeekMenuModal(mondayOf(tripDate)); });
      var delLink = el('button', { type: 'button', class: 'link-btn danger trip-delete-link', text: 'Slett turen' });
      delLink.addEventListener('click', function () {
        showConfirmModal({
          title: 'Slette handleturen?',
          description: formatKr(trip.amount) + ' den ' + tripDate.getDate() + '. ' + MONTH_NAMES[tripDate.getMonth()] + ' fjernes fra oversikten.',
          confirmLabel: 'Slett',
          cancelLabel: 'Avbryt',
          danger: true,
          onConfirm: function () { deleteTrip(trip.id); render(); },
          onCancel: function () { showTripModal(trip); }
        });
      });
      extras.push(menuLink, delLink);
    }
    if (opts.afterClear) {
      var stopLink = el('button', { type: 'button', class: 'link-btn trip-stop-link', text: 'Ikke spør meg igjen på denne telefonen' });
      stopLink.addEventListener('click', function () { setAskTrip(false); closeOverlay(); });
      extras.push(stopLink);
    }
    if (extras.length) kids.push(el('div', { class: 'trip-extra' }, extras));

    var modal = el('div', { class: 'modal wide trip-modal' }, kids);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
    if (!trip) setTimeout(function () { amountInput.focus(); }, 30);
  }

  /* Ukesmenyen slik den var en gitt uke – fra hoveddokumentet eller arkivet –
   * med hva som ble brukt den uka øverst. */
  function showWeekMenuModal (weekStart) {
    closeOverlay();
    var start = mondayOf(weekStart);
    var key = weekKeyOf(start);
    var wk = isoWeek(start).week;
    var spent = sumTrips(start, addDays(start, 6));

    var body = el('div', { class: 'week-menu-list' }, [el('p', { class: 'menu-pick-empty', text: 'Henter ukesmenyen …' })]);
    var actions = [];
    var weeks = menuWeeks();
    var liveIdx = key === weeks[0].key ? 0 : (key === weeks[1].key ? 1 : -1);
    if (liveIdx !== -1) {
      var openBtn = el('button', { class: 'secondary', type: 'button', text: 'Åpne i Uka' });
      openBtn.addEventListener('click', function () { closeOverlay(); menuWeekOffset = liveIdx; setView('menu'); });
      actions.push(openBtn);
    }
    var closeBtn = el('button', { class: 'secondary', type: 'button', text: 'Lukk' });
    closeBtn.addEventListener('click', closeOverlay);
    actions.push(closeBtn);

    var modal = el('div', { class: 'modal wide week-menu-modal' }, [
      el('h2', { text: 'Ukesmenyen uke ' + wk }),
      el('p', { text: weekRangeLabel(start) }),
      el('p', {
        class: 'week-menu-spent', text: spent.count
          ? 'Brukt denne uka: ' + formatKr(spent.sum) + ' på ' + spent.count + (spent.count === 1 ? ' tur' : ' turer')
          : 'Ingen handleturer registrert denne uka.'
      }),
      body,
      el('div', { class: 'modal-actions' }, actions)
    ]);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);

    loadWeekMenu(key).then(function (rows) {
      if (!body.isConnected) return;
      body.innerHTML = '';
      var any = false;
      for (var d = 0; d < 7; d++) {
        var entry = null;
        rows.forEach(function (r) { if (r.day === d) entry = r; });
        var date = addDays(start, d);
        var recipe = entry && entry.recipeId ? findRecipe(entry.recipeId) : null;
        var dishName = entry && entry.recipeId ? (recipe ? recipe.name : entry.recipeName) : '';
        if (dishName || (entry && entry.note)) any = true;
        body.appendChild(el('div', { class: 'week-menu-row' }, [
          el('div', { class: 'week-menu-day' }, [
            el('strong', { text: DAY_NAMES[d] }),
            document.createTextNode(date.getDate() + '. ' + MONTH_SHORT[date.getMonth()])
          ]),
          el('div', { class: 'week-menu-dish' + (dishName ? '' : ' is-empty') }, [
            document.createTextNode(dishName || '–'),
            entry && entry.note ? el('span', { class: 'week-menu-note', text: entry.note }) : null
          ])
        ]));
      }
      if (!any) {
        body.innerHTML = '';
        body.appendChild(el('p', { class: 'menu-pick-empty', text: 'Ingen ukesmeny ble satt opp denne uka.' }));
      }
    }).catch(function (err) {
      if (!body.isConnected) return;
      body.innerHTML = '';
      body.appendChild(el('p', {
        class: 'menu-pick-empty', text: isPermissionError(err)
          ? 'Arkivet er ikke tilgjengelig ennå – de nye reglene må limes inn i Firebase.'
          : 'Eldre uker hentes fra arkivet, og det krever nett. Prøv igjen når du er tilkoblet.'
      }));
    });
  }

  function buildRecipesView (activeList) {
    var section = el('section', { class: 'list-section' });

    var addRecipeBtn = el('button', { type: 'button', class: 'add-recipe-btn', text: '+ Ny oppskrift' });
    addRecipeBtn.addEventListener('click', function () { showRecipeEditor(null); });
    var importBtn = el('button', { type: 'button', class: 'import-recipe-btn', text: 'Importer' });
    importBtn.addEventListener('click', function () { showRecipeImport(); });
    if (pickTarget) {
      var nowDish = findRecipe(getMenuDay(pickTarget.weekKey, pickTarget.day).recipeId);
      var cancelPickBtn = el('button', { type: 'button', class: 'pick-cancel', text: 'Avbryt' });
      cancelPickBtn.addEventListener('click', cancelPick);
      section.appendChild(el('div', { class: 'pick-banner', role: 'status' }, [
        el('div', { class: 'pick-text' }, [
          el('span', { class: 'pick-eyebrow', text: 'Velg middag til' }),
          el('strong', { text: capitalize(dayLabelOf(pickTarget.weekKey, pickTarget.day)) }),
          nowDish ? el('span', { class: 'pick-now', text: 'Nå: ' + nowDish.name }) : null
        ]),
        cancelPickBtn
      ]));
    } else {
      section.appendChild(el('div', { class: 'recipe-toolbar' }, [addRecipeBtn, importBtn]));
    }

    if (state.recipes.length === 0) {
      section.appendChild(el('div', { class: 'empty-state' }, [
        el('h3', { text: 'Ingen oppskrifter ennå' }),
        el('p', { text: 'Opprett din første oppskrift, eller lim inn flere på én gang med «Importer».' })
      ]));
      return section;
    }

    var listEl = el('div', { class: 'recipe-list' });

    /* Søkefeltet skriver rett i listen under, uten å bygge opp siden på nytt.
     * Da mister ikke feltet fokus, og tastaturet blir stående på telefonen. */
    var searchInput = el('input', {
      type: 'search', class: 'recipe-search', name: 'recipeSearch',
      placeholder: 'Søk i oppskrifter …', value: recipeQuery, autocomplete: 'off'
    });

    function paintList () {
      listEl.innerHTML = '';
      var found = visibleRecipes();
      if (!found.length) {
        listEl.appendChild(el('div', { class: 'empty-state' }, [
          el('h3', { text: 'Ingen treff' }),
          el('p', { text: 'Fant ingen oppskrifter som passer «' + recipeQuery.trim() + '».' })
        ]));
        return;
      }
      found.forEach(function (r) { listEl.appendChild(buildRecipeCard(activeList, r)); });
    }

    searchInput.addEventListener('input', function () {
      recipeQuery = searchInput.value;
      paintList();
    });

    var sortRow = el('div', { class: 'sort-row' });
    [
      { key: 'rating', label: 'Beste først' },
      { key: 'name', label: 'A–Å' },
      { key: 'new', label: 'Nyest' }
    ].forEach(function (opt) {
      var btn = el('button', {
        type: 'button',
        class: 'sort-btn' + (recipeSort === opt.key ? ' active' : ''),
        text: opt.label
      });
      btn.addEventListener('click', function () {
        if (recipeSort === opt.key) return;
        recipeSort = opt.key;
        setStoredRecipeSort(opt.key);
        sortRow.querySelectorAll('.sort-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        paintList();
      });
      sortRow.appendChild(btn);
    });

    section.appendChild(searchInput);
    section.appendChild(sortRow);
    paintList();
    section.appendChild(listEl);
    return section;
  }

  function buildRecipeCard (activeList, recipe) {
    var editBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Rediger oppskrift', html: ICON_PENCIL });
    editBtn.addEventListener('click', function () { showRecipeEditor(recipe); });
    var delBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Slett oppskrift', html: ICON_TRASH });
    delBtn.addEventListener('click', function () { confirmDeleteRecipe(recipe); });

    /* Terningen står ved siden av navnet og er samtidig knappen for å endre
     * kastet – da slipper du å åpne hele oppskriften for å gi en ny karakter. */
    var titleEl = el('h3', { text: recipe.name });
    if (recipe.rating) {
      var dieBtn = el('button', {
        type: 'button', class: 'die-badge',
        html: dieSvg(recipe.rating, 18),
        'aria-label': 'Terningkast ' + recipe.rating + ' – trykk for å endre'
      });
      dieBtn.addEventListener('click', function () { showRatingModal(recipe); });
      /* Terningen ligger inne i overskriften, ikke ved siden av, slik at den
       * følger siste ord i navnet i stedet for å falle ned på egen linje når
       * tittelen er lang. */
      titleEl.appendChild(dieBtn);
    }
    var titleWrap = el('div', { class: 'recipe-title-wrap' }, [titleEl]);

    var head = el('div', { class: 'recipe-card-head' }, [
      titleWrap,
      el('div', { class: 'recipe-card-actions' }, [editBtn, delBtn])
    ]);

    /* Miniatyren hentes etterpå, slik at listen tegnes med én gang og bildene
     * sklir inn etter hvert. Første gang koster det ett lite nedlasting per
     * oppskrift; deretter ligger de på telefonen. */
    var thumbEl = null;
    if (recipe.hasImage) {
      thumbEl = el('div', { class: 'recipe-thumb' });
      loadRecipeThumb(recipe.id, recipe.imageAt).then(function (url) {
        if (!thumbEl.isConnected || !url) return;
        thumbEl.appendChild(el('img', { src: url, alt: 'Bilde av ' + recipe.name }));
        thumbEl.classList.add('is-loaded');
      });
    }

    /* I listen holder det å se hva slags rett det er – hele ingredienslisten
     * står inne i oppskriften. */
    var preview = recipe.ingredients.length ? mainProtein(recipe) : '';

    var facts = [];
    if (recipe.portions) facts.push(recipe.portions + ' porsjoner');
    if (recipe.steps.length) facts.push(recipe.steps.length + ' steg');

    var factsRow = el('div', { class: 'recipe-facts' });
    if (recipe.minutes) {
      factsRow.appendChild(el('span', { class: 'time-badge' }, [
        el('span', { class: 'time-icon', html: ICON_CLOCK }),
        el('span', { text: 'ca. ' + formatDuration(recipe.minutes) })
      ]));
    }
    if (facts.length) factsRow.appendChild(el('span', { text: facts.join(' · ') }));

    var addBtn;
    if (pickTarget) {
      var isThere = getMenuDay(pickTarget.weekKey, pickTarget.day).recipeId === recipe.id;
      addBtn = el('button', {
        type: 'button', class: 'recipe-add-btn pick-btn' + (isThere ? ' is-current' : ''),
        text: isThere ? 'Står på ' + DAY_NAMES[pickTarget.day].toLowerCase() + ' nå' : 'Velg til ' + DAY_NAMES[pickTarget.day].toLowerCase(),
        disabled: isThere
      });
      addBtn.addEventListener('click', function () { chooseForPick(recipe); });
    } else {
      addBtn = el('button', { type: 'button', class: 'recipe-add-btn', text: 'Legg til i «' + activeList.name + '»' });
      addBtn.addEventListener('click', function () { applyRecipeToActiveList(recipe); });
    }

    var text = el('div', { class: 'recipe-open-text' }, [
      facts.length ? factsRow : null,
      preview ? el('p', { class: 'recipe-ing-preview', text: preview }) : null,
      el('span', { class: 'recipe-open-hint', text: 'Se hele oppskriften' })
    ]);
    var body = el('button', { type: 'button', class: 'recipe-open' + (thumbEl ? ' has-thumb' : '') },
      thumbEl ? [thumbEl, text] : [text]);
    body.addEventListener('click', function () { readerDay = null; showRecipeReader(recipe); });

    return el('div', { class: 'recipe-card' }, [head, body, addBtn]);
  }

  /* Raden med seks terninger. Trykk på en for å gi kastet, og på den du
   * allerede har gitt for å fjerne det. Brukes både inne i oppskriften og i
   * det lille vinduet du får når du trykker på terningen ved siden av navnet. */
  function buildDieRow (recipeId, onPicked) {
    var row = el('div', { class: 'die-row' });
    var buttons = [];

    function paint () {
      /* Leser terningen fra tilstanden, ikke fra en kopi – da stemmer den også
       * hvis den andre telefonen har kastet terning i mellomtiden. */
      var live = findRecipe(recipeId);
      var current = live ? live.rating : null;
      buttons.forEach(function (b) {
        var on = b.__value === current;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    for (var d = 1; d <= 6; d++) {
      (function (value) {
        var btn = el('button', {
          type: 'button', class: 'die-btn', html: dieSvg(value, 26),
          'aria-label': 'Gi terningkast ' + value
        });
        btn.__value = value;
        btn.addEventListener('click', function () {
          var live = findRecipe(recipeId);
          var next = (live && live.rating === value) ? null : value;
          setRecipeRating(recipeId, next);
          paint();
          if (onPicked) onPicked(next);
        });
        buttons.push(btn);
        row.appendChild(btn);
      })(d);
    }
    paint();
    return row;
  }

  /* Det lille vinduet du får når du trykker på terningen på oppskriftskortet. */
  function showRatingModal (recipe, onDone) {
    closeOverlay();
    var row = buildDieRow(recipe.id, function () {
      closeOverlay();
      /* Åpnet du skalaen inne fra oppskriften, skal du tilbake dit etterpå. */
      if (onDone) onDone();
    });
    var closeBtn = el('button', { class: 'secondary', type: 'button', text: 'Lukk' });
    closeBtn.addEventListener('click', function () { closeOverlay(); if (onDone) onDone(); });

    var modal = el('div', { class: 'modal' }, [
      el('h2', { text: 'Terningkast' }),
      el('p', { text: recipe.name + '. Trykk på terningen du allerede har gitt for å fjerne kastet.' }),
      row,
      el('div', { class: 'modal-actions' }, [closeBtn])
    ]);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
  }

  /* Hele oppskriften i lesbar form – det er denne som gjør at de håndskrevne
   * arkene kan bli liggende i skuffen. */
  function showRecipeReader (recipe) {
    closeOverlay();

    /* Terningen står ved siden av navnet, og er eneste inngang til skalaen.
     * Har oppskriften ingen karakter ennå, vises en tom terning – ellers
     * hadde det ikke vært noen vei inn til å gi den. */
    var titleEl = el('h2', { text: recipe.name });
    var rated = recipe.rating;
    var readerDie = el('button', {
      type: 'button', class: 'die-badge' + (rated ? '' : ' is-empty'),
      html: dieSvg(rated || 0, 18),
      'aria-label': rated ? ('Terningkast ' + rated + ' – trykk for å endre') : 'Gi terningkast'
    });
    readerDie.addEventListener('click', function () {
      showRatingModal(recipe, function () { showRecipeReader(recipe); });
    });
    titleEl.appendChild(readerDie);

    var kids = [titleEl];

    if (recipe.minutes) {
      kids.push(el('div', { class: 'reader-time' }, [
        el('span', { class: 'time-icon', html: ICON_CLOCK }),
        el('span', { text: 'ca. ' + formatDuration(recipe.minutes) })
      ]));
    }

    /* Åpnet fra en dag i Uka: dagen står øverst, med det du kan gjøre med den.
     * Står retten ikke lenger på dagen (fjernet eller byttet på den andre
     * telefonen), vises ikke linjen. */
    var dayCtx = (readerDay && readerDay.recipeId === recipe.id &&
                  getMenuDay(readerDay.weekKey, readerDay.day).recipeId === recipe.id) ? readerDay : null;
    if (dayCtx) {
      var dEntry = getMenuDay(dayCtx.weekKey, dayCtx.day);
      var dayBtn = function (label, cls, onClick) {
        var b = el('button', { type: 'button', class: 'reader-day-btn' + (cls ? ' ' + cls : ''), text: label });
        b.addEventListener('click', onClick);
        return b;
      };
      kids.push(el('div', { class: 'reader-day' }, [
        el('div', { class: 'reader-day-head' }, [
          el('span', { class: 'reader-day-eyebrow', text: 'I Uka' }),
          el('strong', { text: capitalize(dayLabelOf(dayCtx.weekKey, dayCtx.day)) }),
          dEntry.note ? el('span', { class: 'reader-day-note', text: dEntry.note }) : null
        ]),
        el('div', { class: 'reader-day-actions' }, [
          dayBtn('Bytt', 'is-main', function () { startPickForDay(dayCtx.weekKey, dayCtx.day); }),
          dayBtn('Flytt', '', function () { readerDay = null; showMenuMoveModal(weekOfKey(dayCtx.weekKey), dayCtx.day); }),
          dayBtn('Notat', '', function () { showDayNoteModal(dayCtx.weekKey, dayCtx.day, function () { showRecipeReader(recipe); }); }),
          dayBtn('Fjern', 'is-danger', function () {
            setMenuDish(dayCtx.weekKey, dayCtx.day, null);
            scheduleSave();
            readerDay = null;
            closeOverlay();
            render();
          })
        ])
      ]));
    }

    /* Bildeblokken. Den bytter mellom tre tilstander: tom («Legg til bilde»),
     * henter, og ferdig bilde med knapper for å bytte eller fjerne. */
    var photoBlock = el('div', { class: 'photo-block' });
    var fileInput = el('input', { type: 'file', accept: 'image/*', class: 'photo-input' });

    /* Samme felt brukes til begge valgene. «capture» er det som ber telefonen
     * om å åpne kameraet i stedet for galleriet – det må settes rett før
     * klikket, og fjernes igjen når du vil velge et bilde du allerede har. */
    function openPicker (useCamera) {
      if (useCamera) fileInput.setAttribute('capture', 'environment');
      else fileInput.removeAttribute('capture');
      fileInput.click();
    }

    function pickButton (useCamera, label, icon, extraClass) {
      var btn = el('button', { type: 'button', class: 'photo-btn' + (extraClass ? ' ' + extraClass : '') }, [
        el('span', { class: 'photo-btn-icon', html: icon }),
        el('span', { text: label })
      ]);
      btn.addEventListener('click', function () { openPicker(useCamera); });
      return btn;
    }

    function paintPhoto (state_, url, message) {
      photoBlock.innerHTML = '';
      if (state_ === 'loading') {
        photoBlock.appendChild(el('div', { class: 'photo-empty', text: 'Henter bilde …' }));
        return;
      }
      if (state_ === 'image') {
        photoBlock.appendChild(el('img', { class: 'photo', src: url, alt: 'Bilde av ' + recipe.name }));
        var camBtn = el('button', { type: 'button', class: 'photo-link take-photo', text: 'Ta nytt bilde' });
        camBtn.addEventListener('click', function () { openPicker(true); });
        var swapBtn = el('button', { type: 'button', class: 'photo-link from-gallery', text: 'Fra galleri' });
        swapBtn.addEventListener('click', function () { openPicker(false); });
        var delBtn = el('button', { type: 'button', class: 'photo-link danger', text: 'Fjern' });
        delBtn.addEventListener('click', function () {
          paintPhoto('loading');
          clearRecipeImage(recipe.id)
            .then(function () { paintPhoto('empty'); render(); })
            .catch(function () { paintPhoto('image', url, 'Klarte ikke å fjerne bildet.'); });
        });
        photoBlock.appendChild(el('div', { class: 'photo-actions' }, [camBtn, swapBtn, delBtn]));
        if (message) photoBlock.appendChild(el('p', { class: 'field-error', text: message }));
        return;
      }
      photoBlock.appendChild(el('div', { class: 'photo-empty photo-pick' }, [
        el('span', { class: 'photo-pick-title', text: 'Bilde av retten' }),
        el('div', { class: 'photo-pick-row' }, [
          pickButton(true, 'Ta bilde', ICON_CAMERA, 'take-photo'),
          pickButton(false, 'Velg fra galleri', ICON_GALLERY, 'from-gallery')
        ])
      ]));
      if (message) photoBlock.appendChild(el('p', { class: 'field-error', text: message }));
    }

    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      if (!isWriter) { paintPhoto(recipe.hasImage ? 'image' : 'empty', imageCache[recipe.id], 'Du må være tilkoblet for å lagre bilder.'); return; }
      paintPhoto('loading');
      Promise.all([
        compressImage(file, IMAGE_MAX_SIDE, IMAGE_QUALITY),
        compressImage(file, THUMB_MAX_SIDE, THUMB_QUALITY)
      ])
        .then(function (pair) {
          return saveRecipeImage(recipe.id, pair[0], pair[1]).then(function () { return pair[0]; });
        })
        .then(function (dataUrl) { paintPhoto('image', dataUrl); render(); })
        .catch(function (err) {
          paintPhoto(recipe.hasImage ? 'image' : 'empty', imageCache[recipe.id],
            (err && err.message) || 'Klarte ikke å lagre bildet.');
        });
    });

    kids.push(photoBlock);
    kids.push(fileInput);

    if (recipe.hasImage) {
      paintPhoto('loading');
      loadRecipeImage(recipe.id).then(function (url) {
        if (!photoBlock.isConnected) return;
        if (url) paintPhoto('image', url);
        else paintPhoto('empty', null, 'Fant ikke bildet. Er du uten nett?');
      });
    } else {
      paintPhoto('empty');
    }

    /* Glideren skalerer mengdene. Den endrer ikke selve oppskriften – den
     * står igjen som den er neste gang du åpner den. */
    var factor = 1;
    var steps = [0.25, 0.5, 1, 2, 3, 4].map(function (f) {
      /* Har oppskriften porsjoner, viser vi hva ganget antall blir – det er
       * lettere å forholde seg til enn et gangetall alene. */
      var label = '× ' + formatNum(f);
      if (recipe.portions) label += ' · ' + formatNum(recipe.portions * f) + ' porsjoner';
      return { factor: f, label: label };
    });
    var startIndex = 0;
    steps.forEach(function (s, i) { if (s.factor === 1) startIndex = i; });

    var scaleValue = el('span', { class: 'scale-value', text: steps[startIndex].label });
    var slider = el('input', {
      type: 'range', class: 'scale-slider', name: 'scale',
      min: '0', max: String(steps.length - 1), step: '1', value: String(startIndex),
      'aria-label': 'Juster mengde'
    });

    if (recipe.ingredients.length) {
      kids.push(el('div', { class: 'scale-block' }, [
        el('div', { class: 'scale-head' }, [
          el('span', { class: 'field-label', text: 'Mengde' }),
          scaleValue
        ]),
        slider
      ]));
    } else if (recipe.portions) {
      kids.push(el('div', { class: 'reader-portions', text: recipe.portions + ' porsjoner' }));
    }

    var ul = null;
    function paintIngredients () {
      if (!ul) return;
      ul.innerHTML = '';
      recipe.ingredients.forEach(function (raw) {
        var ing = scaleIngredient(raw, factor);
        var amount = ing.amount || (ing.qty > 1 ? String(ing.qty) : '');
        ul.appendChild(el('li', {}, [
          el('span', { class: 'reader-amount', text: amount }),
          el('span', { class: 'reader-ing-name', text: ing.name })
        ]));
      });
    }

    if (recipe.ingredients.length) {
      kids.push(el('h3', { class: 'reader-heading', text: 'Ingredienser' }));
      ul = el('ul', { class: 'reader-ingredients' });
      paintIngredients();
      kids.push(ul);

      slider.addEventListener('input', function () {
        var s = steps[parseInt(slider.value, 10)] || steps[startIndex];
        factor = s.factor;
        scaleValue.textContent = s.label;
        scaleValue.classList.toggle('changed', factor !== 1);
        paintIngredients();
      });
    }

    if (recipe.steps.length) {
      kids.push(el('h3', { class: 'reader-heading', text: 'Fremgangsmåte' }));
      var ol = el('ol', { class: 'reader-steps' });
      recipe.steps.forEach(function (s) { ol.appendChild(el('li', { text: s })); });
      kids.push(ol);
    }

    /* Ukesmenyen rett fra oppskriften: leser du gjennom en rett og liker den,
     * skal du slippe å finne fram til ukesmenyen og lete opp retten på nytt. */
    var planned = menuSlotsForRecipe(recipe.id);
    var planBtn = el('button', { type: 'button', class: 'plan-btn' }, [
      el('span', { class: 'plan-btn-icon', html: ICON_CALENDAR }),
      el('span', { text: planned.length ? 'Sett opp på en dag til' : 'Sett på ukesmenyen' })
    ]);
    planBtn.addEventListener('click', function () { showMenuPlacementModal(recipe); });
    var planKids = [planBtn];
    if (planned.length) {
      planKids.push(el('p', {
        class: 'plan-status',
        text: 'Står på ' + planned.map(shortDayLabel).join(' og ') + '.'
      }));
    }
    /* I velgemodus er det å velge retten du er her for – da passer ikke
     * «Sett på ukesmenyen» ved siden av. */
    var picking = !!pickTarget && currentView === 'recipes' && !dayCtx;
    if (!picking) kids.push(el('div', { class: 'plan-block' }, planKids));

    var addBtn;
    if (picking) {
      var alreadyThere = getMenuDay(pickTarget.weekKey, pickTarget.day).recipeId === recipe.id;
      addBtn = el('button', {
        class: 'primary pick-choose', type: 'button',
        text: alreadyThere ? 'Står på ' + DAY_NAMES[pickTarget.day].toLowerCase() + ' nå' : 'Velg til ' + DAY_NAMES[pickTarget.day].toLowerCase(),
        disabled: alreadyThere
      });
      addBtn.addEventListener('click', function () { chooseForPick(recipe); });
    } else {
      addBtn = el('button', { class: 'primary', type: 'button', text: 'Legg i handlelisten' });
      addBtn.addEventListener('click', function () { closeOverlay(); applyRecipeToActiveList(recipe, factor); });
    }
    var editBtn = el('button', { class: 'secondary', type: 'button', text: 'Rediger' });
    editBtn.addEventListener('click', function () { showRecipeEditor(recipe); });
    if (recipe.ingredients.length || picking) kids.push(el('div', { class: 'modal-actions' }, [editBtn, addBtn]));
    else kids.push(el('div', { class: 'modal-actions' }, [editBtn]));

    var modal = el('div', { class: 'modal wide reader' }, kids);

    /* Kryss øverst til høyre. Uten det er eneste vei ut å legge oppskriften i
     * handlelisten eller å redigere den – og det er ikke alltid det du vil. */
    var closeBtn = el('button', {
      class: 'modal-close', type: 'button', 'aria-label': 'Lukk',
      html: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>'
    });
    closeBtn.addEventListener('click', closeOverlay);
    modal.insertBefore(closeBtn, modal.firstChild);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
  }

  /* Lagre uken slik den står nå – enten som en ny, eller over en du har fra før. */
  function showSaveWeekModal (week) {
    closeOverlay();
    var input = el('input', {
      type: 'text', class: 'saved-name-input', maxlength: '40', autocomplete: 'off',
      placeholder: 'F.eks. «Standarduken» eller «Uke med fisk»'
    });
    var saveBtn = el('button', { class: 'primary', type: 'submit', text: 'Lagre' });
    var form = el('form', {}, [input, saveBtn]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = input.value.trim();
      if (!name) return;
      saveWeekAs(week.key, name);
      scheduleSave();
      closeOverlay();
      render();
    });

    var kids = [
      el('h2', { text: 'Lagre uken' }),
      el('p', { text: 'Uken lagres med rett og notat på hver dag, og kan settes inn igjen på en senere uke.' }),
      form
    ];

    if (state.savedMenus.length) {
      kids.push(el('span', { class: 'menu-field-label', text: 'Eller skriv over en du har fra før' }));
      var rows = el('div', { class: 'plan-day-list' });
      state.savedMenus.forEach(function (m) {
        var row = el('button', { type: 'button', class: 'plan-day-row' }, [
          el('span', { class: 'plan-day-name', text: m.name }),
          el('span', { class: 'plan-day-meta is-free', text: savedMenuSummary(m) })
        ]);
        row.addEventListener('click', function () {
          showConfirmModal({
            title: 'Skrive over «' + m.name + '»?',
            description: 'Den lagrede uken erstattes av uken du står på nå.',
            confirmLabel: 'Skriv over',
            cancelLabel: 'Avbryt',
            onConfirm: function () { overwriteSavedMenu(m, week.key); scheduleSave(); render(); },
            onCancel: function () { showSaveWeekModal(week); }
          });
        });
        rows.appendChild(row);
      });
      kids.push(rows);
    }

    var cancelBtn = el('button', { class: 'secondary', type: 'button', text: 'Avbryt' });
    cancelBtn.addEventListener('click', closeOverlay);
    kids.push(el('div', { class: 'modal-actions' }, [cancelBtn]));

    var modal = el('div', { class: 'modal wide plan-modal' }, kids);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
    setTimeout(function () { input.focus(); }, 30);
  }

  /* De lagrede ukene: trykk på en for å sette den inn på uken du står på. */
  function showSavedMenusModal (week) {
    closeOverlay();
    var rows = el('div', { class: 'plan-day-list' });

    state.savedMenus.forEach(function (m) {
      var useBtn = el('button', { type: 'button', class: 'saved-row' }, [
        el('span', { class: 'plan-day-name', text: m.name }),
        el('span', { class: 'plan-day-meta is-free', text: savedMenuSummary(m) })
      ]);
      useBtn.addEventListener('click', function () { confirmApplySavedMenu(m, week); });

      var delBtn = el('button', {
        type: 'button', class: 'tab-icon-btn saved-del',
        'aria-label': 'Slett den lagrede uken ' + m.name, html: ICON_TRASH
      });
      delBtn.addEventListener('click', function () {
        showConfirmModal({
          title: 'Slette «' + m.name + '»?',
          description: 'Den lagrede uken fjernes. Ukene du allerede har satt opp berøres ikke.',
          confirmLabel: 'Slett',
          cancelLabel: 'Avbryt',
          danger: true,
          onConfirm: function () {
            tombstone('savedMenus', m.id);
            state.savedMenus = state.savedMenus.filter(function (x) { return x.id !== m.id; });
            scheduleSave();
            render();
            if (state.savedMenus.length) showSavedMenusModal(week);
          },
          onCancel: function () { showSavedMenusModal(week); }
        });
      });
      rows.appendChild(el('div', { class: 'saved-row-wrap' }, [useBtn, delBtn]));
    });

    var cancelBtn = el('button', { class: 'secondary', type: 'button', text: 'Lukk' });
    cancelBtn.addEventListener('click', closeOverlay);

    var modal = el('div', { class: 'modal wide plan-modal' }, [
      el('h2', { text: 'Lagrede uker' }),
      el('p', { text: 'Settes inn på ' + week.label.toLowerCase() + ' – uke ' + isoWeek(week.start).week + '.' }),
      rows,
      el('div', { class: 'modal-actions' }, [cancelBtn])
    ]);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
  }

  function confirmApplySavedMenu (menu, week) {
    function run () {
      var res = applySavedMenu(menu, week.key);
      scheduleSave();
      closeOverlay();
      render();
      if (res.missing) {
        showConfirmModal({
          title: 'Uken er satt inn',
          description: res.missing + ' av rettene i «' + menu.name + '» finnes ikke lenger, så de dagene står tomme.',
          confirmLabel: 'Greit',
          cancelLabel: 'Lukk',
          onConfirm: function () {}
        });
      }
    }
    if (!weekHasPlan(week.key)) { run(); return; }
    showConfirmModal({
      title: 'Erstatte det som står der nå?',
      description: week.label + ' har allerede et oppsett. «' + menu.name + '» skriver over alle sju dagene.',
      confirmLabel: 'Sett inn',
      cancelLabel: 'Avbryt',
      onConfirm: run,
      onCancel: function () { showSavedMenusModal(week); }
    });
  }

  /* Flytt middagen fra én dag til en annen i samme uke. Står det noe på dagen
   * du flytter til, bytter de to dagene plass – det er nesten alltid det du
   * mener når du drar om på en uke. */
  function showMenuMoveModal (week, fromDay) {
    closeOverlay();
    var from = getMenuDay(week.key, fromDay);
    var moving = findRecipe(from.recipeId);
    var rows = [];
    for (var d = 0; d < 7; d++) {
      (function (toDay) {
        if (toDay === fromDay) return;
        var entry = getMenuDay(week.key, toDay);
        var taken = entry.recipeId ? findRecipe(entry.recipeId) : null;
        var date = addDays(week.start, toDay);
        var row = el('button', { type: 'button', class: 'plan-day-row' }, [
          el('span', { class: 'plan-day-name', text: DAY_NAMES[toDay] + ' ' + date.getDate() + '. ' + MONTH_SHORT[date.getMonth()] }),
          el('span', { class: 'plan-day-meta' + (taken ? '' : ' is-free'), text: taken ? 'Bytter med ' + taken.name : 'Ledig' })
        ]);
        row.addEventListener('click', function () {

    ]);

  /* Velger dag for en rett du allerede står og ser på. Resten av denne uken og
   * hele neste – og dagen retten allerede står på kan trykkes bort igjen. */
  function showMenuPlacementModal (recipe) {
    closeOverlay();

    function finish () {
      scheduleSave();
      render();
      /* Tilbake til oppskriften, som nå selv forteller hvilken dag den står på. */
      showRecipeReader(recipe);
    }

    function place (slot) {
      var entry = getMenuDay(slot.week.key, slot.day);
      if (entry.recipeId === recipe.id) {
        setMenuDish(slot.week.key, slot.day, null);
        finish();
        return;
      }
      var taken = entry.recipeId ? findRecipe(entry.recipeId) : null;
      if (taken && taken.id !== recipe.id) {
        /* Å overskrive en middag noen allerede har planlagt skal koste ett trykk til. */
        showConfirmModal({
          title: 'Bytte middag?',
          description: DAY_NAMES[slot.day] + ' ' + slot.date.getDate() + '. ' +
            MONTH_NAMES[slot.date.getMonth()] + ' står det «' + taken.name +
            '». Vil du sette «' + recipe.name + '» der i stedet?',
          confirmLabel: 'Bytt',
          cancelLabel: 'Avbryt',
          onConfirm: function () { setMenuDish(slot.week.key, slot.day, recipe); finish(); },
          onCancel: function () { showMenuPlacementModal(recipe); }
        });
        return;
      }
      setMenuDish(slot.week.key, slot.day, recipe);
      finish();
    }

    var rows = [];
    var lastWeekKey = null;
    menuPlacementDays().forEach(function (slot) {
      if (slot.week.key !== lastWeekKey) {
        lastWeekKey = slot.week.key;
        rows.push(el('span', {
          class: 'menu-field-label',
          text: slot.week.label + ' · uke ' + isoWeek(slot.week.start).week
        }));
      }
      var entry = getMenuDay(slot.week.key, slot.day);
      var isHere = entry.recipeId === recipe.id;
      var taken = entry.recipeId ? findRecipe(entry.recipeId) : null;
      var meta = isHere ? 'Står her – trykk for å fjerne'
        : (taken ? taken.name : (entry.recipeId ? entry.recipeName + ' (slettet)' : 'Ledig'));

      var row = el('button', { type: 'button', class: 'plan-day-row' + (isHere ? ' is-chosen' : '') }, [
        el('span', { class: 'plan-day-name', text: DAY_NAMES[slot.day] + ' ' + slot.date.getDate() + '. ' + MONTH_SHORT[slot.date.getMonth()] }),
        el('span', { class: 'plan-day-meta' + (isHere || taken ? '' : ' is-free'), text: meta })
      ]);
      row.addEventListener('click', function () { place(slot); });
      rows.push(row);
    });

    var backBtn = el('button', { class: 'secondary', type: 'button', text: 'Tilbake' });
    backBtn.addEventListener('click', function () { closeOverlay(); showRecipeReader(recipe); });

    var modal = el('div', { class: 'modal wide plan-modal' }, [
      el('h2', { text: 'Sett på ukesmenyen' }),
      el('p', { text: recipe.name }),
      el('div', { class: 'plan-day-list' }, rows),
      el('div', { class: 'modal-actions' }, [backBtn])
    ]);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) { closeOverlay(); showRecipeReader(recipe); } });
    document.body.appendChild(overlay);
  }
