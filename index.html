<!-- ============ PWA: installasjon, offline-varsel, service worker ============ -->
<script>
(function () {
  'use strict';

  /* ---- Offline-varsel ---- */
  var bar = document.createElement('div');
  bar.id = 'offline-bar';
  bar.setAttribute('role', 'status');
  bar.innerHTML = '<span class="dot"></span><span>Ingen nett – endringer sendes når du er tilkoblet igjen</span>';
  document.body.appendChild(bar);

  function syncOnlineState () {
    if (navigator.onLine) bar.classList.remove('is-visible');
    else bar.classList.add('is-visible');
  }
  window.addEventListener('online', syncOnlineState);
  window.addEventListener('offline', syncOnlineState);
  syncOnlineState();

  /* ---- «Installer app»-knapp ----
   * Chrome/Android sender beforeinstallprompt når appen kan installeres og
   * ikke allerede er installert. Da viser vi en knapp; ellers ingenting. */
  var deferredPrompt = null;
  var installBtn = document.createElement('button');
  installBtn.id = 'install-btn';
  installBtn.type = 'button';
  installBtn.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>' +
    '<span>Installer app</span>';
  document.body.appendChild(installBtn);

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('is-visible');
  });

  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) { installBtn.classList.remove('is-visible'); return; }
    var p = deferredPrompt;
    deferredPrompt = null;
    installBtn.classList.remove('is-visible');
    p.prompt();
  });

  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    installBtn.classList.remove('is-visible');
  });

  /* ---- Service worker ----
   * Krever https (GitHub Pages) eller localhost. Åpnes filen rett fra disk
   * hopper vi bare over det – appen fungerer likevel, bare uten offline. */
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var incoming = reg.installing;
          if (!incoming) return;
          incoming.addEventListener('statechange', function () {
            /* Ny versjon er klar: la den ta over med én gang, så er den i bruk
             * neste gang appen åpnes. Vi laster bevisst IKKE siden på nytt –
             * det ville kunne avbryte noen midt i å skrive inn en vare. */
            if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
              incoming.postMessage('SKIP_WAITING');
            }
          });
        });
      }).catch(function () { /* uten service worker fungerer alt bortsett fra offline */ });
    });
  }
})();
</script>

  function injectStyles () {
    var s = document.createElement('style');
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  /* ============================== local (per-device) state ============================== */

  var NAME_KEY = 'handleliste_name_v1';
  var ACTIVE_LIST_KEY = 'handleliste_active_list_v1';
  var FIREBASE_CONFIG_KEY = 'handleliste_firebase_config_v1';
  var STATE_CACHE_KEY = 'handleliste_state_cache_v1';
  var RECIPE_SORT_KEY = 'handleliste_recipe_sort_v1';
  var DOC_COLLECTION = 'handleliste-app';
  var DOC_ID = 'shared-state';

  function getName () {
    try { return (localStorage.getItem(NAME_KEY) || '').trim(); } catch (e) { return ''; }
  }
  function setName (n) {
    try { localStorage.setItem(NAME_KEY, n.trim()); } catch (e) {}
  }
  function getStoredActiveListId () {
    try { return localStorage.getItem(ACTIVE_LIST_KEY) || null; } catch (e) { return null; }
  }
  function setStoredActiveListId (id) {
    try { localStorage.setItem(ACTIVE_LIST_KEY, id); } catch (e) {}
  }
  function getStoredFirebaseConfig () {
    try { var raw = localStorage.getItem(FIREBASE_CONFIG_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  /* Siste synkroniserte liste, lagret lokalt på denne telefonen. Brukes til å vise
   * listen umiddelbart når appen åpnes – også helt uten nett. */
  function getCachedState () {
    try { var raw = localStorage.getItem(STATE_CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function setCachedState (s) {
    try { localStorage.setItem(STATE_CACHE_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function storeFirebaseConfig (cfg) {
    try { localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  /* Sorteringsvalget er en visningspreferanse, og lagres bare på denne
   * telefonen – det trenger ikke være likt hos dere begge. */
  function getStoredRecipeSort () {
    try {
      var v = localStorage.getItem(RECIPE_SORT_KEY);
      return (v === 'name' || v === 'new' || v === 'rating') ? v : 'rating';
    } catch (e) { return 'rating'; }
  }
  function setStoredRecipeSort (v) {
    try { localStorage.setItem(RECIPE_SORT_KEY, v); } catch (e) {}
  }

  function clearCachedState () {
    try { localStorage.removeItem(STATE_CACHE_KEY); } catch (e) {}
  }
  function clearStoredFirebaseConfig () {
    try { localStorage.removeItem(FIREBASE_CONFIG_KEY); } catch (e) {}
  }
  function parseConfigInput (text) {
    var cleaned = (text || '').trim();
    cleaned = cleaned.replace(/^\s*(export\s+default\s+|const\s+\w+\s*=\s*|var\s+\w+\s*=\s*|let\s+\w+\s*=\s*)/, '');
    cleaned = cleaned.replace(/;\s*$/, '');
    var obj;
    try { obj = (new Function('return (' + cleaned + ')'))(); } catch (e) { return null; }
    if (!obj || typeof obj !== 'object' || !obj.apiKey || !obj.projectId) return null;
    return obj;
  }
  function initials (n) {
    n = (n || '?').trim();
    if (!n) return '?';
    var parts = n.split(/\s+/);
    var a = parts[0] ? parts[0][0] : '';
    var b = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (a + b).toUpperCase();
  }
  function uid () {
    return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* Opprettelsestidspunkt som alltid går framover, også når flere rader lages
   * i samme millisekund – ellers får en hel import samme tidsstempel, og
   * «Nyest» blir meningsløst innbyrdes. */
  var lastCreatedAt = 0;
  function nextCreatedAt () {
    var now = Date.now();
    lastCreatedAt = now > lastCreatedAt ? now : lastCreatedAt + 1;
    return lastCreatedAt;
  }

  /* ============================== shared state + migration ============================== */

  function normalizeName (n) {
    return (n || '').toString().trim().replace(/\s+/g, ' ');
  }
  function normalizeQty (q) {
    if (typeof q === 'number' && isFinite(q) && q >= 1) return Math.round(q);
    if (typeof q === 'string') {
      var m = q.match(/\d+/);
      if (m) { var n = parseInt(m[0], 10); if (n >= 1) return n; }
    }
    return 1;
  }
  /* ===================================================================
   * Sammenslåing av to versjoner av listen
   *
   * Begge telefonene kan endre den samme listen samtidig – og den ene kan i
   * tillegg være uten nett en stund. Derfor kan vi ikke la «den som lagret
   * sist» overskrive alt: da forsvinner den andres varer.
   *
   * I stedet har hver vare, liste og oppskrift sine egne tidsstempler, og vi
   * fletter de to versjonene sammen rad for rad. Sletting lagres som et
   * gravstein-merke («tombstone») i stedet for at raden bare fjernes – uten
   * det ville en slettet vare kommet tilbake fra den andre telefonen ved
   * neste synkronisering.
   * =================================================================== */

  var TOMBSTONE_TTL = 30 * 24 * 60 * 60 * 1000; // gravsteiner ryddes etter 30 dager

  function num (v, fallback) {
    return (typeof v === 'number' && isFinite(v)) ? v : fallback;
  }

  /* Sammenligning som gir samme svar på begge telefoner, uansett rekkefølge. */
  function stableJson (v) {
    if (v === null || typeof v !== 'object') return JSON.stringify(v);
    if (Array.isArray(v)) return '[' + v.map(stableJson).join(',') + ']';
    return '{' + Object.keys(v).sort().map(function (k) {
      return JSON.stringify(k) + ':' + stableJson(v[k]);
    }).join(',') + '}';
  }
  function sameState (a, b) { return stableJson(a) === stableJson(b); }

  function normalizeItem (raw) {
    var name = normalizeName(raw && raw.name);
    if (!name) return null;
    var added = num(raw && raw.addedAt, Date.now());
    return {
      id: (raw && raw.id) || uid(),
      name: name,
      qty: normalizeQty(raw && raw.qty),
      checked: !!(raw && raw.checked),
      addedBy: (raw && raw.addedBy) || null,
      checkedBy: (raw && raw.checkedBy) || null,
      addedAt: added,
      updatedAt: num(raw && raw.updatedAt, added),
      checkedAt: num(raw && raw.checkedAt, added)
    };
  }
  function normalizeItems (items) {
    var out = [];
    (items || []).forEach(function (raw) {
      var it = normalizeItem(raw);
      if (it) out.push(it);
    });
    return out;
  }

  function emptyTombstones () { return { lists: {}, items: {}, recipes: {} }; }

  function normalizeTombstones (raw) {
    var out = emptyTombstones();
    ['lists', 'items', 'recipes'].forEach(function (kind) {
      var src = raw && raw[kind];
      if (!src || typeof src !== 'object') return;
      Object.keys(src).forEach(function (id) {
        var ts = num(src[id], 0);
        if (ts > 0) out[kind][id] = ts;
      });
    });
    return out;
  }
  function mergeTombstones (a, b) {
    var out = emptyTombstones();
    ['lists', 'items', 'recipes'].forEach(function (kind) {
      [a && a[kind], b && b[kind]].forEach(function (src) {
        if (!src) return;
        Object.keys(src).forEach(function (id) {
          out[kind][id] = Math.max(out[kind][id] || 0, src[id]);
        });
      });
    });
    return out;
  }
  function pruneTombstones (tomb) {
    var cutoff = Date.now() - TOMBSTONE_TTL;
    var out = emptyTombstones();
    ['lists', 'items', 'recipes'].forEach(function (kind) {
      Object.keys(tomb[kind]).forEach(function (id) {
        if (tomb[kind][id] >= cutoff) out[kind][id] = tomb[kind][id];
      });
    });
    return out;
  }
  function tombstone (kind, id) {
    if (!state.tombstones) state.tombstones = emptyTombstones();
    state.tombstones[kind][id] = Date.now();
  }

  function byField (field) {
    return function (a, b) {
      if (a[field] !== b[field]) return a[field] - b[field];
      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
    };
  }

  /* To varer med samme navn (og samme avkrysset-status) i samme liste slås
   * sammen til én rad, og antallet legges sammen – akkurat som når du skriver
   * inn den samme varen to ganger selv. Den som ble lagt inn først beholdes,
   * slik at begge telefoner ender på nøyaktig samme rad. */
  function dedupeItems (items, tomb) {
    var seen = {};
    var out = [];
    items.forEach(function (it) {
      var key = it.name.toLowerCase() + '|' + (it.checked ? '1' : '0');
      if (seen[key]) {
        var keep = seen[key];
        keep.qty = Math.min(999, keep.qty + it.qty);
        keep.updatedAt = Math.max(keep.updatedAt, it.updatedAt);
        tomb.items[it.id] = Math.max(tomb.items[it.id] || 0, Date.now());
      } else {
        seen[key] = it;
        out.push(it);
      }
    });
    return out;
  }

  /* Bringer en tilstand på normalform: slettede rader fjernet, fast
   * rekkefølge, ingen duplikater. Kjøres etter hver sammenslåing, slik at
   * begge telefonene får bitidentiske dokumenter når de er enige. */
  function canonicalState (s) {
    var tomb = pruneTombstones(s.tombstones || emptyTombstones());
    var lists = s.lists
      .filter(function (l) { return !tomb.lists[l.id]; })
      .sort(byField('createdAt'))
      .map(function (l) {
        var items = l.items
          .filter(function (i) { return !tomb.items[i.id]; })
          .sort(byField('addedAt'));
        return {
          id: l.id,
          name: l.name,
          createdAt: l.createdAt,
          updatedAt: l.updatedAt,
          items: dedupeItems(items, tomb)
        };
      });
    var recipes = s.recipes
      .filter(function (r) { return !tomb.recipes[r.id]; })
      .sort(byField('createdAt'));
    return { lists: lists, recipes: recipes, tombstones: tomb };
  }

  /* Den aller første listen får en FAST id. Ellers ville de to telefonene laget
   * hver sin «Handleliste» første gang de kobler seg til, og endt opp med å se
   * på hver sin tomme fane i stedet for den samme listen. */
  var DEFAULT_LIST_ID = 'liste-1';

  function ensureAtLeastOneList (s) {
    if (!s.lists.length) {
      s.lists.push({ id: DEFAULT_LIST_ID, name: 'Handleliste', createdAt: 0, updatedAt: 0, items: [] });
    }
    return s;
  }

  /* Velger den siden som ble endret sist. Er tidsstemplene helt like, velger
   * vi på en måte som gir samme resultat på begge telefoner. */
  function pickNewer (a, b, field) {
    if (a[field] > b[field]) return a;
    if (b[field] > a[field]) return b;
    return stableJson(a) >= stableJson(b) ? a : b;
  }

  function mergeById (mine, theirs, mergeOne) {
    var byId = {};
    var order = [];
    mine.forEach(function (x) { byId[x.id] = x; order.push(x.id); });
    theirs.forEach(function (y) {
      if (byId[y.id]) byId[y.id] = mergeOne(byId[y.id], y);
      else { byId[y.id] = y; order.push(y.id); }
    });
    return order.map(function (id) { return byId[id]; });
  }

  function mergeItems (a, b) {

     * slik at «han krysset av mens hun justerte antallet» beholder begge. */
    var base = pickNewer(a, b, 'updatedAt');
    var chk = pickNewer(a, b, 'checkedAt');
    return {
      id: a.id,
      name: base.name,
      qty: base.qty,
      checked: chk.checked,
      checkedBy: chk.checkedBy,
      addedBy: a.addedBy || b.addedBy || null,
      addedAt: Math.min(a.addedAt, b.addedAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt),
      checkedAt: Math.max(a.checkedAt, b.checkedAt)
    };
  }

  function mergeLists (a, b) {
    var base = pickNewer(a, b, 'updatedAt');
    return {
      id: a.id,
      name: base.name,
      createdAt: Math.min(a.createdAt, b.createdAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt),

  function mergeRecipes (a, b) {

    var rated = pickNewer(a, b, 'ratedAt');

      name: base.name,
      portions: base.portions,
      ingredients: base.ingredients,

      rating: rated.rating,
      ratedAt: Math.max(a.ratedAt, b.ratedAt),
      createdAt: Math.min(a.createdAt, b.createdAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt)

      lists: mergeById(mine.lists, theirs.lists, mergeLists),
      recipes: mergeById(mine.recipes, theirs.recipes, mergeRecipes),
      tombstones: mergeTombstones(mine.tombstones, theirs.tombstones)
    }));

  /* En ingrediens har både et antall (2 egg) og en fritekst-mengde (500 g).
   * Mengden er fritekst med vilje – håndskrevne oppskrifter bruker alt fra
   * «1 ss» til «en neve», og det skal ikke måtte presses inn i et tall. */
  function normalizeIngredients (raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map(function (ing) {
      return {
        name: normalizeName(ing && ing.name),
        qty: normalizeQty(ing && ing.qty),
        amount: normalizeName(ing && ing.amount).slice(0, 40)

    }).filter(function (ing) { return ing.name; });

  function normalizeSteps (raw) {
    if (!Array.isArray(raw)) return [];

  function normalizeRating (raw) {
    var n = null;
    if (typeof raw === 'number' && isFinite(raw)) n = Math.round(raw);
    else if (typeof raw === 'string' && /\d/.test(raw)) n = parseInt(raw.match(/\d+/)[0], 10);
    if (n === null || n < 1 || n > 6) return null;
    return n;
  }

  function normalizePortions (raw) {
    if (typeof raw === 'number' && isFinite(raw) && raw >= 1) return Math.min(99, Math.round(raw));
    if (typeof raw === 'string') {

      if (m) { var n = parseInt(m[0], 10); if (n >= 1) return Math.min(99, n); }
    }
    return null;
  }

  /* Ingrediensen slik den skal se ut på handlelisten: mengden henger med i
   * navnet, ellers står du i butikken med «kjøttdeig» og husker ikke hvor mye. */
  function ingredientShoppingName (ing) {
    return ing.amount ? ing.name + ' (' + ing.amount + ')' : ing.name;
  }
  function ingredientLabel (ing) {
    var parts = [];
    if (ing.amount) parts.push(ing.amount);
    else if (ing.qty > 1) parts.push(String(ing.qty));
    parts.push(ing.name);
    return parts.join(' ');
  }
  /* Leser inn en tilstand utenfra (skyen eller den lokale kopien) og gir alle
   * rader tidsstempler. Gamle lister uten tidsstempler får dem her, slik at
   * oppgraderingen skjer av seg selv – ingenting må gjøres på nytt. */
  function migrateState (raw) {
    var lists = [];
    if (raw && Array.isArray(raw.lists)) {
      lists = raw.lists.map(function (l, idx) {
        return {
          id: (l && l.id) || uid(),
          name: normalizeName(l && l.name) || 'Liste',
          createdAt: num(l && l.createdAt, idx + 1),
          updatedAt: num(l && l.updatedAt, idx + 1),
          items: normalizeItems(l && l.items)
        };
      });
    } else if (raw && Array.isArray(raw.items)) {
      lists = [{ id: uid(), name: 'Handleliste', createdAt: 1, updatedAt: 1, items: normalizeItems(raw.items) }];
    }
    var recipes = [];
    if (raw && Array.isArray(raw.recipes)) {
      recipes = raw.recipes.map(function (r, idx) {
        return {
          id: (r && r.id) || uid(),
          name: normalizeName(r && r.name) || 'Oppskrift',
          portions: normalizePortions(r && r.portions),
          ingredients: normalizeIngredients(r && r.ingredients),
          steps: normalizeSteps(r && r.steps),
          rating: normalizeRating(r && r.rating),
          ratedAt: num(r && r.ratedAt, 0),
          createdAt: num(r && r.createdAt, idx + 1),
          updatedAt: num(r && r.updatedAt, idx + 1)
        };
      }).filter(function (r) { return r.ingredients.length > 0 || r.steps.length > 0; });
    }
    return canonicalState({
      lists: lists,
      recipes: recipes,
      tombstones: normalizeTombstones(raw && raw.tombstones)
    });
  }

  var state = ensureAtLeastOneList({ lists: [], recipes: [], tombstones: emptyTombstones() });
  var activeListId = getStoredActiveListId();

  function ensureActiveList () {
    if (!state.lists.length) state.lists.push({ id: uid(), name: 'Handleliste', items: [] });
    var found = false;
    state.lists.forEach(function (l) { if (l.id === activeListId) found = true; });
    if (!found) { activeListId = state.lists[0].id; setStoredActiveListId(activeListId); }
  }
  function getActiveList () {
    ensureActiveList();
    var found = null;
    state.lists.forEach(function (l) { if (l.id === activeListId) found = l; });
    return found;
  }
  function setActiveList (id) {
    activeListId = id;
    setStoredActiveListId(id);
    draftName = '';
    draftQty = 1;
    render();
  }

  var fbApp = null, fbAuth = null, fbDb = null, fbDocRef = null, fbUnsubscribe = null;
  var fbConfigJson = null, fbAppSeq = 0;
  var isWriter = false;
  var saveTimer = null;
  var pendingSave = false;
  var statusState = 'connecting';
  /* Endringer gjort før/uten forbindelse. Når vi kommer på nett igjen skal DE
   * vinne over det som ligger i skyen – ellers ville de blitt stille borte. */
  var hasUnsyncedEdits = false;
  var retryTimer = null;
  var recipeQuery = '';
  var recipeSort = getStoredRecipeSort();
  var draftName = '';
  var draftQty = 1;
  var currentView = 'lists';

  function setView (v) {
    currentView = v;
    render();
  }

  /* ============================== dom helpers ============================== */

  function el (tag, attrs, kids) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k === 'disabled') { if (attrs[k]) node.disabled = true; }
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
  var ICON_CART = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 8H6"></path></svg>';
  var ICON_PENCIL = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>';
  var ICON_MINUS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>';
  /* Terning med riktig antall øyne, tegnet som SVG. */
  var DIE_PIPS = {
    1: [[12, 12]],
    2: [[8, 8], [16, 16]],
    3: [[8, 8], [12, 12], [16, 16]],
    4: [[8, 8], [16, 8], [8, 16], [16, 16]],
    5: [[8, 8], [16, 8], [12, 12], [8, 16], [16, 16]],
    6: [[8, 7.5], [16, 7.5], [8, 12], [16, 12], [8, 16.5], [16, 16.5]]
  };
  function dieSvg (n, size) {

      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="1.85" fill="currentColor"></circle>';
    }).join('');
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      '<rect x="2.5" y="2.5" width="19" height="19" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>' +
      pips + '</svg>';
  }

  var ICON_PLUS_BIG ='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>';

  var root = el('div', { id: 'root' });
  document.body.appendChild(root);

  /* ============================== rendering ============================== */

  var summaryEl = null;
  var listSectionEl = null;
  var footerRowEl = null;

  function render () {
    root.innerHTML = '';
    var list = getActiveList();

    summaryEl = el('p', { text: itemsSummary(list) });
    var brand = el('div', { class: 'brand' }, [
      el('div', { class: 'brand-mark', html: ICON_CART }),
      el('div', {}, [
        el('h1', { text: 'Handleliste' }),
        summaryEl
      ])
    ]);

    var who = getName()
      ? el('div', { class: 'who' }, [
          el('span', { class: 'avatar', text: initials(getName()) }),
          el('span', { text: getName() }),
          el('button', { text: 'bytt', onclick: function () { showNameModal(true); } })
        ])
      : el('div', { class: 'who' }, [ el('button', { text: 'skriv inn navn', onclick: function () { showNameModal(true); } }) ]);

    root.appendChild(el('header', { class: 'app-header' }, [brand, who]));

    root.appendChild(buildViewSwitch());

    footerRowEl = null;

    if (currentView === 'recipes') {
      root.appendChild(buildRecipesView(list));
    } else {
      root.appendChild(buildTabsRow(list));
      root.appendChild(buildAddForm(list));

      listSectionEl = buildList(list);
      root.appendChild(listSectionEl);

      var checkedCount = list.items.filter(function (i) { return i.checked; }).length;
      if (checkedCount > 0) {
        footerRowEl = el('div', { class: 'footer-row' }, [
          el('button', { class: 'clear-btn', text: 'Tøm avkryssede (' + checkedCount + ')', onclick: function () { clearChecked(); } })
        ]);

      }
    }

    var hint = el('p', { class: 'hint' });
    hint.appendChild(document.createTextNode('Listene oppdateres automatisk på begge telefoner. Installer appen på hjemskjermen for å åpne den direkte – den virker også uten nett. '));
    var reconnectBtn = el('button', { class: 'link-btn', type: 'button', text: 'Endre tilkobling' });
    reconnectBtn.addEventListener('click', function () {
      showConfirmModal({
        title: 'Endre tilkobling?',
        description: 'Denne telefonen kobles fra den delte listen. Du kan koble til igjen med samme eller en annen Firebase-konfigurasjon.',
        confirmLabel: 'Koble fra',
        cancelLabel: 'Avbryt',
        danger: true,
        onConfirm: function () { reconnect(); }
      });
    });
    hint.appendChild(reconnectBtn);
    root.appendChild(hint);
    /* Versjonsnummeret bakes inn i filen når den lages, og endres hver gang
     * filene må lastes opp på nytt. Da kan du se på telefonen om den kjører
     * den siste versjonen du la ut. */
    root.appendChild(el('p', { class: 'version', text: 'Versjon ' + APP_VERSION }));

    if (!getName()) showNameModal(false);
  }

  // Patches just the item list (and the header count + "tøm avkryssede" footer) without
  // touching the header, tabs or add-form. This is what keeps the add-form's text input
  // (and, critically, the on-screen keyboard on a phone) alive across add/check/delete —
  // a full render() replaces that input with a brand-new DOM node, and re-focusing a new
  // node programmatically does not reliably reopen the keyboard on real phones.
  function renderListOnly () {
    if (currentView !== 'lists' || !listSectionEl || !listSectionEl.parentNode) { render(); return; }
    var list = getActiveList();
    if (summaryEl) summaryEl.textContent = itemsSummary(list);

    var parent = listSectionEl.parentNode;
    var newListSection = buildList(list);
    parent.replaceChild(newListSection, listSectionEl);
    listSectionEl = newListSection;

    if (footerRowEl && footerRowEl.parentNode) {
      footerRowEl.parentNode.removeChild(footerRowEl);
      footerRowEl = null;
    }
    var checkedCount = list.items.filter(function (i) { return i.checked; }).length;
    if (checkedCount > 0) {
      footerRowEl = el('div', { class: 'footer-row' }, [
        el('button', { class: 'clear-btn', text: 'Tøm avkryssede (' + checkedCount + ')', onclick: function () { clearChecked(); } })
      ]);
      if (listSectionEl.nextSibling) parent.insertBefore(footerRowEl, listSectionEl.nextSibling);
      else parent.appendChild(footerRowEl);
    }
  }

  function buildViewSwitch () {
    var listsBtn = el('button', { type: 'button', class: currentView === 'lists' ? 'active' : '', text: 'Handlelister' });
    var recipesBtn = el('button', { type: 'button', class: currentView === 'recipes' ? 'active' : '', text: 'Oppskrifter' });
    listsBtn.addEventListener('click', function () { setView('lists'); });
    recipesBtn.addEventListener('click', function () { setView('recipes'); });
    return el('div', { class: 'view-switch' }, [listsBtn, recipesBtn]);
  }

  function itemsSummary (list) {
    var total = list.items.length;
    var left = list.items.filter(function (i) { return !i.checked; }).length;
    if (total === 0) return list.name;
    return list.name + ' – ' + left + ' av ' + total + ' igjen';
  }

  function statusText () {
    switch (statusState) {
      case 'connecting': return 'Kobler til …';
      case 'saving': return 'Lagrer …';
      case 'saved': return 'Lagret – synkronisert';
      case 'offline': return 'Frakoblet – viser sist lagrede liste';
      case 'pending': return 'Frakoblet – endringene sendes når nettet er tilbake';
      case 'error': return 'Mistet kontakt – prøver igjen …';
      default: return 'Klar';
    }
  }

  function buildTabsRow (activeList) {
    var row = el('div', { class: 'list-tabs' });
    state.lists.forEach(function (l) {
      row.appendChild(buildTab(l));
    });
    var addTab = el('button', { class: 'tab tab-add', type: 'button' }, [ el('span', { class: 'tab-name', text: '+ Ny liste' }) ]);
    addTab.addEventListener('click', showCreateListModal);
    row.appendChild(addTab);
    return row;
  }

  function buildTab (list) {
    var isActive = list.id === activeListId;
    if (!isActive) {
      var btn = el('button', { class: 'tab', type: 'button' }, [ el('span', { class: 'tab-name', text: list.name }) ]);
      btn.addEventListener('click', function () { setActiveList(list.id); });
      return btn;
    }
    var kids = [ el('span', { class: 'tab-name', text: list.name }) ];
    var editBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Endre navn på listen', html: ICON_PENCIL });
    editBtn.addEventListener('click', function () { showRenameListModal(list); });
    kids.push(editBtn);
    if (state.lists.length > 1) {
      var delBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Slett listen', html: ICON_TRASH });
      delBtn.addEventListener('click', function () { confirmDeleteList(list); });
      kids.push(delBtn);
    }
    return el('div', { class: 'tab active' }, kids);
  }

  function buildAddForm (list) {
    if (draftQty < 1) draftQty = 1;
    var nameInput = el('input', { type: 'text', name: 'itemName', placeholder: 'Legg til vare …', autocomplete: 'off', maxlength: '80', value: draftName });
    nameInput.addEventListener('input', function () { draftName = nameInput.value; });

    var qtyValue = el('span', { class: 'qty-value', text: String(draftQty) });
    var minusBtn = el('button', { type: 'button', 'aria-label': 'Reduser antall' , html: ICON_MINUS });
    var plusBtn = el('button', { type: 'button', 'aria-label': 'Øk antall', html: ICON_PLUS });
    function syncMinus () { minusBtn.disabled = draftQty <= 1; }
    minusBtn.addEventListener('click', function () { if (draftQty > 1) { draftQty--; qtyValue.textContent = String(draftQty); syncMinus(); } });
    plusBtn.addEventListener('click', function () { if (draftQty < 999) { draftQty++; qtyValue.textContent = String(draftQty); syncMinus(); } });
    syncMinus();
    var stepper = el('div', { class: 'qty-stepper' }, [minusBtn, qtyValue, plusBtn]);

    var addBtn = el('button', { class: 'add-btn', type: 'submit', 'aria-label': 'Legg til vare', html: ICON_PLUS_BIG });
    var form = el('form', { class: 'add-form' }, [
      el('div', { class: 'fields' }, [nameInput, stepper]),

    ]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var qtyToAdd = draftQty;
      draftName = '';
      draftQty = 1;

      // addItem() below only patches the list section now, so this node (and the phone's
      // on-screen keyboard) never loses focus.
      nameInput.value = '';
      qtyValue.textContent = '1';
      syncMinus();
      addItem(list.id, nameToAdd, qtyToAdd);
      nameInput.focus();
    });

  }

  function buildList (list) {
    var section = el('section', { class: 'list-section' });
    if (list.items.length === 0) {
      section.appendChild(el('div', { class: 'empty-state' }, [
        el('h3', { text: 'Listen er tom' }),
        el('p', { text: 'Legg til den første varen i «' + list.name + '».' })
      ]));

    }
    var unchecked = list.items.filter(function (i) { return !i.checked; });
    var checked = list.items.filter(function (i) { return i.checked; });

    if (unchecked.length) section.appendChild(buildGroup(list, unchecked));
    if (checked.length) {

    }

  function buildGroup (list, items) {
    var ul = el('ul', { class: 'item-list' });
    items.forEach(function (item) { ul.appendChild(buildItem(list, item)); });
    return ul;
  }

  function buildItem (list, item) {
    var meta = '';
    if (item.checked && item.checkedBy) meta = 'Krysset av ' + item.checkedBy;
    else if (item.addedBy) meta = 'Lagt til av ' + item.addedBy;

    var body = el('div', { class: 'item-body' }, [
      el('span', { class: 'item-name', text: item.name }),
      meta ? el('div', { class: 'item-meta', text: meta }) : null
    ]);

    var checkBtn = el('button', { class: 'check-btn', 'aria-label': 'Kryss av ' + item.name, html: ICON_CHECK });

    var qtyControl;
    if (!item.checked) {
      var qtyValue = el('span', { class: 'qty-value', text: String(item.qty) });
      var minusBtn = el('button', { type: 'button', 'aria-label': 'Reduser antall for ' + item.name, html: ICON_MINUS, disabled: item.qty <= 1 });
      var plusBtn = el('button', { type: 'button', 'aria-label': 'Øk antall for ' + item.name, html: ICON_PLUS });
      minusBtn.addEventListener('click', function () { changeQty(list.id, item.id, -1); });
      plusBtn.addEventListener('click', function () { changeQty(list.id, item.id, 1); });
      qtyControl = el('div', { class: 'qty-stepper sm' }, [minusBtn, qtyValue, plusBtn]);
    } else {
      qtyControl = el('span', { class: 'item-qty static', text: '× ' + item.qty });
    }

    var li = el('li', { class: 'item' + (item.checked ? ' is-checked' : '') });
    [checkBtn, body, qtyControl].forEach(function (c) { li.appendChild(c); });

    checkBtn.addEventListener('click', function () { toggleItem(list.id, item.id); });
    var delBtn = el('button', { class: 'del-btn', 'aria-label': 'Slett ' + item.name, html: ICON_TRASH });
    delBtn.addEventListener('click', function () { deleteItem(list.id, item.id); });
    li.appendChild(delBtn);
    return li;
  }

  /* Sorterer og filtrerer oppskriftene slik listen skal vises. */
  function visibleRecipes () {
    var q = recipeQuery.trim().toLowerCase();
    var list = state.recipes.filter(function (r) {
      if (!q) return true;
      /* Søket ser på navnet OG ingrediensene, så «kylling» finner retter som
       * har kylling i seg selv om ordet ikke står i tittelen. */
      if (r.name.toLowerCase().indexOf(q) !== -1) return true;
      return r.ingredients.some(function (i) { return i.name.toLowerCase().indexOf(q) !== -1; });
    });

    if (recipeSort === 'name') {
      list.sort(function (a, b) { return a.name.localeCompare(b.name, 'nb'); });
    } else if (recipeSort === 'new') {
      list.sort(function (a, b) {
        if (a.createdAt !== b.createdAt) return b.createdAt - a.createdAt;
        return a.name.localeCompare(b.name, 'nb');
      });
    } else {
      /* Terningkast: best først, og de uten terning nederst. */
      list.sort(function (a, b) {
        var ra = a.rating || 0, rb = b.rating || 0;
        if (ra !== rb) return rb - ra;
        return a.name.localeCompare(b.name, 'nb');
      });
    }
    return list;
  }

  function buildRecipesView (activeList) {
    var section = el('section', { class: 'list-section' });

    var addRecipeBtn = el('button', { type: 'button', class: 'add-recipe-btn', text: '+ Ny oppskrift' });
    addRecipeBtn.addEventListener('click', function () { showRecipeEditor(null); });
    var importBtn = el('button', { type: 'button', class: 'import-recipe-btn', text: 'Importer' });
    importBtn.addEventListener('click', function () { showRecipeImport(); });
    section.appendChild(el('div', { class: 'recipe-toolbar' }, [addRecipeBtn, importBtn]));

    if (state.recipes.length === 0) {
      section.appendChild(el('div', { class: 'empty-state' }, [
        el('h3', { text: 'Ingen oppskrifter ennå' }),
        el('p', { text: 'Opprett din første oppskrift, eller lim inn flere på én gang med «Importer».' })
      ]));
      return section;
    }

    var listEl = el('div', { class: 'recipe-list' });

    /* Søkefeltet skriver rett i listen under, uten å bygge opp siden på nytt.
     * Da mister ikke feltet fokus, og tastaturet blir stående på telefonen. */
    var searchInput = el('input', {
      type: 'search', class: 'recipe-search', name: 'recipeSearch',
      placeholder: 'Søk i oppskrifter …', value: recipeQuery, autocomplete: 'off'
    });

    function paintList () {
      listEl.innerHTML = '';
      var found = visibleRecipes();
      if (!found.length) {
        listEl.appendChild(el('div', { class: 'empty-state' }, [
          el('h3', { text: 'Ingen treff' }),
          el('p', { text: 'Fant ingen oppskrifter som passer «' + recipeQuery.trim() + '».' })
        ]));
        return;
      }
      found.forEach(function (r) { listEl.appendChild(buildRecipeCard(activeList, r)); });
    }

    searchInput.addEventListener('input', function () {
      recipeQuery = searchInput.value;
      paintList();
    });

    var sortRow = el('div', { class: 'sort-row' });
    [
      { key: 'rating', label: 'Beste først' },
      { key: 'name', label: 'A–Å' },
      { key: 'new', label: 'Nyest' }
    ].forEach(function (opt) {
      var btn = el('button', {
        type: 'button',
        class: 'sort-btn' + (recipeSort === opt.key ? ' active' : ''),
        text: opt.label
      });
      btn.addEventListener('click', function () {
        if (recipeSort === opt.key) return;
        recipeSort = opt.key;
        setStoredRecipeSort(opt.key);
        sortRow.querySelectorAll('.sort-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        paintList();
      });
      sortRow.appendChild(btn);
    });

    section.appendChild(searchInput);
    section.appendChild(sortRow);
    paintList();
    section.appendChild(listEl);
    return section;
  }

  function buildRecipeCard (activeList, recipe) {
    var editBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Rediger oppskrift', html: ICON_PENCIL });
    editBtn.addEventListener('click', function () { showRecipeEditor(recipe); });
    var delBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Slett oppskrift', html: ICON_TRASH });
    delBtn.addEventListener('click', function () { confirmDeleteRecipe(recipe); });

    var head = el('div', { class: 'recipe-card-head' }, [
      el('h3', { text: recipe.name }),
      el('div', { class: 'recipe-card-actions' }, [editBtn, delBtn])
    ]);

    var preview = recipe.ingredients.map(ingredientLabel).join(', ');

    var facts = [];
    if (recipe.portions) facts.push(recipe.portions + ' porsjoner');
    if (recipe.steps.length) facts.push(recipe.steps.length + ' steg');

    var factsRow = el('div', { class: 'recipe-facts' });
    if (recipe.rating) {
      factsRow.appendChild(el('span', {
        class: 'die-badge', html: dieSvg(recipe.rating, 17),
        'aria-label': 'Terningkast ' + recipe.rating
      }));
    }
    if (facts.length) factsRow.appendChild(el('span', { text: facts.join(' · ') }));

    var addBtn = el('button', { type: 'button', class: 'recipe-add-btn', text: 'Legg til i «' + activeList.name + '»' });
    addBtn.addEventListener('click', function () { applyRecipeToActiveList(recipe); });

    var body = el('button', { type: 'button', class: 'recipe-open' }, [
      (recipe.rating || facts.length) ? factsRow : null,
      el('p', { class: 'recipe-ing-preview', text: preview || 'Ingen ingredienser' }),
      recipe.steps.length ? el('span', { class: 'recipe-open-hint', text: 'Se hele oppskriften' }) : null
    ]);
    body.addEventListener('click', function () { showRecipeReader(recipe); });

    return el('div', { class: 'recipe-card' }, [head, body, addBtn]);
  }

  /* Hele oppskriften i lesbar form – det er denne som gjør at de håndskrevne
   * arkene kan bli liggende i skuffen. */
  function showRecipeReader (recipe) {
    closeOverlay();

    var kids = [el('h2', { text: recipe.name })];
    if (recipe.portions) kids.push(el('div', { class: 'reader-portions', text: recipe.portions + ' porsjoner' }));

    /* Terningkast: trykk på en terning for å gi den, trykk på den samme igjen
     * for å fjerne den. Kastet deles med den andre telefonen. */
    var dieRow = el('div', { class: 'die-row' });
    var dieButtons = [];

    function paintDice () {
      /* Leser terningen fra tilstanden, ikke fra en kopi – da stemmer den også
       * hvis den andre telefonen har kastet terning i mellomtiden. */
      var live = findRecipe(recipe.id);
      var current = live ? live.rating : null;
      dieButtons.forEach(function (b) {
        var on = b.__value === current;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    for (var d = 1; d <= 6; d++) {
      (function (value) {
        var btn = el('button', {
          type: 'button', class: 'die-btn', html: dieSvg(value, 26),
          'aria-label': 'Gi terningkast ' + value
        });
        btn.__value = value;
        btn.addEventListener('click', function () {
          var live = findRecipe(recipe.id);
          setRecipeRating(recipe.id, (live && live.rating === value) ? null : value);
          paintDice();
        });
        dieButtons.push(btn);
        dieRow.appendChild(btn);
      })(d);
    }
    paintDice();
    kids.push(el('div', { class: 'die-block' }, [
      el('span', { class: 'field-label', text: 'Terningkast' }),
      dieRow
    ]));

    if (recipe.ingredients.length) {
      kids.push(el('h3', { class: 'reader-heading', text: 'Ingredienser' }));
      var ul = el('ul', { class: 'reader-ingredients' });
      recipe.ingredients.forEach(function (ing) {
        var amount = ing.amount || (ing.qty > 1 ? String(ing.qty) : '');
        ul.appendChild(el('li', {}, [
          el('span', { class: 'reader-amount', text: amount }),
          el('span', { class: 'reader-ing-name', text: ing.name })
        ]));
      });
      kids.push(ul);
    }

    if (recipe.steps.length) {
      kids.push(el('h3', { class: 'reader-heading', text: 'Fremgangsmåte' }));
      var ol = el('ol', { class: 'reader-steps' });
      recipe.steps.forEach(function (s) { ol.appendChild(el('li', { text: s })); });
      kids.push(ol);
    }

    var addBtn = el('button', { class: 'primary', type: 'button', text: 'Legg i handlelisten' });
    addBtn.addEventListener('click', function () { closeOverlay(); applyRecipeToActiveList(recipe); });
    var editBtn = el('button', { class: 'secondary', type: 'button', text: 'Rediger' });
    editBtn.addEventListener('click', function () { showRecipeEditor(recipe); });
    var closeBtn = el('button', { class: 'secondary', type: 'button', text: 'Lukk' });
    closeBtn.addEventListener('click', closeOverlay);

    if (recipe.ingredients.length) kids.push(el('div', { class: 'modal-actions' }, [editBtn, addBtn]));
    else kids.push(el('div', { class: 'modal-actions' }, [closeBtn, editBtn]));

    var modal = el('div', { class: 'modal wide reader' }, kids);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
  }

  /* ============================== modals ============================== */

  function closeOverlay () {
    var existing = document.getElementById('modal-overlay');
    if (existing) existing.remove();
  }

  function showPromptModal (opts) {
    closeOverlay();
    var input = el('input', { type: 'text', placeholder: opts.placeholder || '', maxlength: String(opts.maxlength || 40), value: opts.initialValue || '' });
    var saveBtn = el('button', { class: 'primary', type: 'submit', text: opts.confirmLabel || 'Lagre' });
    var form = el('form', {}, [input, saveBtn]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!v) return;
      closeOverlay();
      opts.onSave(v);
    });
    var modalKids = [el('h2', { text: opts.title })];
    if (opts.description) modalKids.push(el('p', { text: opts.description }));
    modalKids.push(form);
    var modal = el('div', { class: 'modal' }, modalKids);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    if (opts.dismissible) overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
    setTimeout(function () { input.focus(); if (input.select) input.select(); }, 30);
  }

  function showConfirmModal (opts) {
    closeOverlay();
    var cancelBtn = el('button', { class: 'secondary', type: 'button', text: opts.cancelLabel || 'Avbryt' });
    var confirmBtn = el('button', { class: 'primary' + (opts.danger ? ' danger' : ''), type: 'button', text: opts.confirmLabel || 'Bekreft' });
    cancelBtn.addEventListener('click', closeOverlay);
    confirmBtn.addEventListener('click', function () { closeOverlay(); opts.onConfirm(); });
    var actions = el('div', { class: 'modal-actions' }, [cancelBtn, confirmBtn]);
    var modalKids = [el('h2', { text: opts.title })];
    if (opts.description) modalKids.push(el('p', { text: opts.description }));
    modalKids.push(actions);
    var modal = el('div', { class: 'modal' }, modalKids);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
  }

  function showNameModal (dismissible) {
    showPromptModal({
      title: 'Hva heter du?',
      description: 'Navnet lagres kun på denne telefonen, og vises på varene du legger til eller krysser av.',
      placeholder: 'F.eks. Andreas',
      initialValue: getName(),

    showPromptModal({

  function confirmDeleteList (list) {
    var count = list.items.length;
    showConfirmModal({
      title: 'Slette «' + list.name + '»?',
      description: (count > 0 ? ('Listen har ' + count + ' vare' + (count === 1 ? '' : 'r') + '. ') : '') + 'Dette kan ikke angres.',
      confirmLabel: 'Slett liste',

      onConfirm: function () { deleteList(list.id); }

  function showRecipeEditor (existing) {
    closeOverlay();
    var draft = {
      name: existing ? existing.name : '',
      portions: existing && existing.portions ? String(existing.portions) : '',
      steps: existing && existing.steps.length ? existing.steps.join('\n') : '',
      ingredients: existing && existing.ingredients.length
        ? existing.ingredients.map(function (i) { return { name: i.name, qty: i.qty, amount: i.amount || '' }; })
        : [{ name: '', qty: 1, amount: '' }]
    };

    var nameInput = el('input', { type: 'text', class: 'recipe-name-input', placeholder: 'F.eks. Tacogryte', maxlength: '60', value: draft.name });
    nameInput.addEventListener('input', function () { draft.name = nameInput.value; });

    var portionsInput = el('input', { type: 'number', class: 'portions-input', placeholder: '4', min: '1', max: '99', value: draft.portions });
    portionsInput.addEventListener('input', function () { draft.portions = portionsInput.value; });
    var portionsRow = el('label', { class: 'field-row' }, [
      el('span', { class: 'field-label', text: 'Porsjoner' }),
      portionsInput
    ]);

    var rowsContainer = el('div', { class: 'ingredient-rows' });

    function buildIngredientRow (ing, idx) {
      var amountField = el('input', { type: 'text', class: 'amount-field', placeholder: 'Mengde', maxlength: '40', value: ing.amount });
      amountField.addEventListener('input', function () { ing.amount = amountField.value; });

      var nameField = el('input', { type: 'text', placeholder: 'Ingrediens', maxlength: '60', value: ing.name });
      nameField.addEventListener('input', function () { ing.name = nameField.value; });

      var qtyValue = el('span', { class: 'qty-value', text: String(ing.qty) });
      var minusBtn = el('button', { type: 'button', 'aria-label': 'Reduser antall', html: ICON_MINUS, disabled: ing.qty <= 1 });
      var plusBtn = el('button', { type: 'button', 'aria-label': 'Øk antall', html: ICON_PLUS });
      minusBtn.addEventListener('click', function () {
        if (ing.qty > 1) { ing.qty--; qtyValue.textContent = String(ing.qty); minusBtn.disabled = ing.qty <= 1; }
      });
      plusBtn.addEventListener('click', function () {
        if (ing.qty < 999) { ing.qty++; qtyValue.textContent = String(ing.qty); minusBtn.disabled = false; }
      });
      var stepper = el('div', { class: 'qty-stepper sm' }, [minusBtn, qtyValue, plusBtn]);

      var removeBtn = el('button', { type: 'button', class: 'ingredient-remove', 'aria-label': 'Fjern ingrediens', html: ICON_TRASH });
      removeBtn.addEventListener('click', function () {
        if (draft.ingredients.length <= 1) {
          ing.name = '';
          ing.qty = 1;
          ing.amount = '';
          renderRows();
          return;
        }
        draft.ingredients.splice(idx, 1);
        renderRows();
      });

      return el('div', { class: 'ingredient-row' }, [
        el('div', { class: 'ingredient-fields' }, [amountField, nameField]),
        stepper,
        removeBtn
      ]);
    }

    function renderRows () {
      rowsContainer.innerHTML = '';
      draft.ingredients.forEach(function (ing, idx) {
        rowsContainer.appendChild(buildIngredientRow(ing, idx));
      });
    }
    renderRows();

    var addIngBtn = el('button', { type: 'button', class: 'add-ingredient-btn', text: '+ Legg til ingrediens' });
    addIngBtn.addEventListener('click', function () { draft.ingredients.push({ name: '', qty: 1, amount: '' }); renderRows(); });

    var stepsField = el('textarea', {
      class: 'steps-field',
      rows: '6',
      placeholder: 'Ett steg per linje:\nBland kjøttdeig med salt og pepper.\nTilsett egg og melk, og la stå i 10 minutter.'
    });
    stepsField.value = draft.steps;
    stepsField.addEventListener('input', function () { draft.steps = stepsField.value; });
    var stepsBlock = el('div', { class: 'steps-block' }, [
      el('span', { class: 'field-label', text: 'Fremgangsmåte' }),
      stepsField,
      el('span', { class: 'field-hint', text: 'Én linje blir ett steg. Nummerering legges til automatisk.' })
    ]);

    var cancelBtn = el('button', { class: 'secondary', type: 'button', text: 'Avbryt' });
    cancelBtn.addEventListener('click', closeOverlay);
    var saveBtn = el('button', { class: 'primary', type: 'submit', text: existing ? 'Lagre endringer' : 'Opprett oppskrift' });
    var actions = el('div', { class: 'modal-actions' }, [cancelBtn, saveBtn]);

    var form = el('form', {}, [
      nameInput, portionsRow,
      el('span', { class: 'field-label', text: 'Ingredienser' }),
      rowsContainer, addIngBtn,
      stepsBlock,
      actions
    ]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = draft.name.trim();
      if (!name) { nameInput.focus(); return; }
      var data = {
        name: name,
        portions: draft.portions,
        ingredients: draft.ingredients,
        steps: draft.steps.split('\n')
      };
      /* En oppskrift må ha enten ingredienser eller en fremgangsmåte – ellers
       * er det ingenting der. */
      if (!normalizeIngredients(data.ingredients).length && !normalizeSteps(data.steps).length) return;
      closeOverlay();
      if (existing) updateRecipe(existing.id, data);
      else addRecipe(data);
    });

    var modal = el('div', { class: 'modal wide' }, [
      el('h2', { text: existing ? 'Rediger oppskrift' : 'Ny oppskrift' }),
      form
    ]);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
    setTimeout(function () { nameInput.focus(); }, 30);
  }

  function showRecipeImport () {
    closeOverlay();

    var field = el('textarea', {
      class: 'import-field',
      rows: '10',
      placeholder: '# Kjøttkaker\nPorsjoner: 4\n\nIngredienser:\n- 500 g kjøttdeig\n- 2 egg\n- 1 dl melk\n\nFremgangsmåte:\n1. Bland kjøttdeig med salt og pepper.\n2. Tilsett egg og melk.'
    });

    var summary = el('div', { class: 'import-summary' });
    var confirmBtn = el('button', { class: 'primary', type: 'button', text: 'Legg inn', disabled: true });
    var parsed = [];

    function refresh () {
      parsed = parseRecipeText(field.value);
      summary.innerHTML = '';
      if (!field.value.trim()) {
        confirmBtn.disabled = true;
        return;
      }
      if (!parsed.length) {
        confirmBtn.disabled = true;
        summary.appendChild(el('p', { class: 'field-error', text: 'Fant ingen oppskrifter i teksten ennå.' }));
        return;
      }
      confirmBtn.disabled = false;
      /* Forhåndsvisning: du skal se nøyaktig hva som blir lagt inn før du
       * trykker – særlig mengdene, som er lettest å lese feil. */
      parsed.forEach(function (r) {
        var facts = [];
        if (r.portions) facts.push(r.portions + ' porsjoner');
        facts.push(r.ingredients.length + ' ingredienser');
        if (r.steps.length) facts.push(r.steps.length + ' steg');
        var exists = state.recipes.some(function (x) { return x.name.toLowerCase() === r.name.toLowerCase(); });
        summary.appendChild(el('div', { class: 'import-item' }, [
          el('strong', { text: r.name }),
          el('span', { class: 'import-facts', text: facts.join(' · ') + (exists ? ' · erstatter den som finnes' : '') }),
          el('span', { class: 'import-preview', text: r.ingredients.map(ingredientLabel).join(', ') })
        ]));
      });
    }

    field.addEventListener('input', refresh);

    confirmBtn.addEventListener('click', function () {
      var res = importRecipes(parsed);
      closeOverlay();
      var parts = [];
      if (res.added) parts.push(res.added + (res.added === 1 ? ' ny oppskrift' : ' nye oppskrifter'));
      if (res.updated) parts.push(res.updated + ' oppdatert');
      showConfirmModal({
        title: 'Importert',
        description: parts.join(' og ') + '.',
        confirmLabel: 'Greit',
        cancelLabel: 'Lukk',
        onConfirm: function () {}
      });
    });

    var cancelBtn = el('button', { class: 'secondary', type: 'button', text: 'Avbryt' });
    cancelBtn.addEventListener('click', closeOverlay);

    var modal = el('div', { class: 'modal wide' }, [
      el('h2', { text: 'Importer oppskrifter' }),
      el('p', { text: 'Lim inn én eller flere oppskrifter. Start hver oppskrift med «#» og navnet. Ingredienser og fremgangsmåte kan stå under hver sin overskrift.' }),
      field,
      summary,
      el('div', { class: 'modal-actions' }, [cancelBtn, confirmBtn])
    ]);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
    setTimeout(function () { field.focus(); }, 30);
  }

  function confirmDeleteRecipe (recipe) {
    showConfirmModal({
      title: 'Slette «' + recipe.name + '»?',
      description: 'Dette kan ikke angres.',
      confirmLabel: 'Slett oppskrift',
      cancelLabel: 'Avbryt',
      danger: true,
      onConfirm: function () { deleteRecipe(recipe.id); }
    });
  }

  /* ============================== list actions ============================== */

  function addList (name) {
    name = normalizeName(name);
    if (!name) return;
    var now = nextCreatedAt();
    var list = { id: uid(), name: name, createdAt: now, updatedAt: now, items: [] };
    state.lists.push(list);
    activeListId = list.id;
    setStoredActiveListId(list.id);
    draftName = '';
    draftQty = 1;
    render();
    scheduleSave();
  }

  function renameList (id, name) {
    name = normalizeName(name);
    if (!name) return;
    var list = null;
    state.lists.forEach(function (l) { if (l.id === id) list = l; });
    if (!list) return;
    list.name = name;
    list.updatedAt = Date.now();
    render();
    scheduleSave();
  }

  function deleteList (id) {
    if (state.lists.length <= 1) return;
    tombstone('lists', id);
    state.lists = state.lists.filter(function (l) { return l.id !== id; });
    if (activeListId === id) {
      activeListId = state.lists[0].id;
      setStoredActiveListId(activeListId);
    }
    render();
    scheduleSave();
  }

  /* ============================== item actions ============================== */

  function findList (listId) {
    var found = null;
    state.lists.forEach(function (l) { if (l.id === listId) found = l; });
    return found;
  }

  function mergeItemIntoList (list, name, qty, adder) {
    name = normalizeName(name);
    if (!name) return;
    qty = normalizeQty(qty);
    var match = null;
    for (var i = 0; i < list.items.length; i++) {
      var it = list.items[i];
      if (!it.checked && it.name.toLowerCase() === name.toLowerCase()) { match = it; break; }
    }
    var now = Date.now();
    if (match) {
      match.qty = Math.min(999, match.qty + qty);
      match.updatedAt = now;
    } else {
      list.items.push({
        id: uid(),
        name: name,
        qty: qty,
        checked: false,
        addedBy: adder || null,
        checkedBy: null,
        addedAt: now,
        updatedAt: now,
        checkedAt: now
      });
    }
  }

  function addItem (listId, name, qty) {
    var list = findList(listId);
    if (!list) return;
    mergeItemIntoList(list, name, qty, getName());
    renderListOnly();
    scheduleSave();
  }

  function toggleItem (listId, itemId) {
    var list = findList(listId);
    if (!list) return;
    var item = null;
    for (var i = 0; i < list.items.length; i++) { if (list.items[i].id === itemId) { item = list.items[i]; break; } }
    if (!item) return;
    item.checked = !item.checked;
    item.checkedBy = item.checked ? (getName() || null) : null;
    item.checkedAt = Date.now();
    renderListOnly();
    scheduleSave();
  }

  function changeQty (listId, itemId, delta) {
    var list = findList(listId);
    if (!list) return;
    var item = null;
    for (var i = 0; i < list.items.length; i++) { if (list.items[i].id === itemId) { item = list.items[i]; break; } }
    if (!item) return;
    var next = item.qty + delta;
    if (next < 1) next = 1;
    if (next > 999) next = 999;
    if (next === item.qty) return;
    item.qty = next;
    item.updatedAt = Date.now();
    renderListOnly();
    scheduleSave();
  }

  function deleteItem (listId, itemId) {
    var list = findList(listId);
    if (!list) return;
    tombstone('items', itemId);
    list.items = list.items.filter(function (i) { return i.id !== itemId; });
    renderListOnly();
    scheduleSave();
  }

  function clearChecked () {
    var list = getActiveList();
    list.items.forEach(function (i) { if (i.checked) tombstone('items', i.id); });
    list.items = list.items.filter(function (i) { return !i.checked; });
    renderListOnly();
    scheduleSave();
  }

  /* ============================== recipe actions ============================== */

  function findRecipe (id) {
    var found = null;
    state.recipes.forEach(function (r) { if (r.id === id) found = r; });
    return found;
  }

  function addRecipe (data, quiet) {
    var now = nextCreatedAt();
    state.recipes.push({
      id: uid(),
      name: data.name,
      portions: normalizePortions(data.portions),
      ingredients: normalizeIngredients(data.ingredients),
      steps: normalizeSteps(data.steps),
      rating: normalizeRating(data.rating),
      ratedAt: normalizeRating(data.rating) ? now : 0,
      createdAt: now,
      updatedAt: now
    });
    if (quiet) return;
    render();
    scheduleSave();
  }

  function updateRecipe (id, data, quiet) {
    var recipe = findRecipe(id);
    if (!recipe) return;
    recipe.name = data.name;
    recipe.portions = normalizePortions(data.portions);
    recipe.ingredients = normalizeIngredients(data.ingredients);
    recipe.steps = normalizeSteps(data.steps);
    /* Terningkastet røres ikke her – det settes for seg, og skal overleve at
     * oppskriften redigeres eller importeres på nytt. */
    recipe.updatedAt = Date.now();
    if (quiet) return;
    render();
    scheduleSave();
  }

  function setRecipeRating (id, value) {
    var recipe = findRecipe(id);
    if (!recipe) return;
    recipe.rating = normalizeRating(value);
    recipe.ratedAt = Date.now();
    render();
    scheduleSave();
  }

  function deleteRecipe (id) {
    tombstone('recipes', id);
    state.recipes = state.recipes.filter(function (r) { return r.id !== id; });
    render();
    scheduleSave();
  }

  /* ============================== import av oppskrifter ============================== */

  /* Tolker oppskrifter skrevet som vanlig tekst. Formatet er med vilje løst:
   * det skal tåle å bli skrevet for hånd, limt inn fra et nettsted, eller
   * generert. «#» starter en ny oppskrift; ellers gjetter vi oss fram. */

  var UNIT = '(?:g|gram|kg|hg|dl|cl|ml|l|liter|ss|ts|krm|stk|pk|pakke|pakker|boks|bokser|dåse|dåser|glass|fedd|neve|never|klype|klyper|kopp|kopper|pose|poser|skive|skiver|cup|cups|bunt|bunter|stilk|stilker|stang|stenger|hode|hoder|potte|potter|kvast|blad|bit|biter|ark|terning|terninger|cm|pors\\.?)';
  var AMOUNT_RE = new RegExp(
    '^((?:\\d+(?:[.,]\\d+)?(?:\\s*[-–]\\s*\\d+(?:[.,]\\d+)?)?|\\d+\\s*\\/\\s*\\d+|[½¼¾]))\\s*(' + UNIT + ')?\\.?\\s+(.+)$', 'i');

  var HEAD_ING = /^(?:ingredienser|ingrediensar|du trenger|dette trenger du|varer)\s*:?\s*$/i;
  var HEAD_STEP = /^(?:fremgangsm[åa]te|framgangsm[åa]te|slik gj[øo]r du(?: det)?|slik lager du det|metode|steg|oppskrift|tilberedning)\s*:?\s*$/i;
  var PORTIONS_RE = /^(?:porsjoner?|antall porsjoner|serverer)\s*:?\s*(\d+)/i;
  var PORTIONS_ALT_RE = /^(\d+)\s*porsjoner?\.?$/i;

  function stripBullet (line) {
    return line.replace(/^\s*(?:[-*•‣–—]|\d+[.)])\s*/, '').trim();
  }

  function parseIngredientLine (line) {
    var text = stripBullet(line);
    if (!text) return null;
    var m = text.match(AMOUNT_RE);
    if (!m) return { name: normalizeName(text), qty: 1, amount: '' };
    var number = m[1].trim();
    var unit = (m[2] || '').trim();
    var rest = normalizeName(m[3]);
    if (!rest) return { name: normalizeName(text), qty: 1, amount: '' };
    if (unit) return { name: rest, qty: 1, amount: (number + ' ' + unit).trim() };
    /* Tall uten enhet – «2 egg» – er et antall, ikke en mengde. */
    var n = parseInt(number, 10);
    if (/^\d+$/.test(number) && n >= 1 && n <= 99) return { name: rest, qty: n, amount: '' };
    return { name: rest, qty: 1, amount: number };
  }

  function parseRecipeText (text) {
    var lines = (text || '').replace(/\r\n?/g, '\n').split('\n');
    var recipes = [];
    var current = null;
    var section = 'ingredients';

    function start (name) {
      current = { name: normalizeName(name) || 'Oppskrift', portions: null, ingredients: [], steps: [] };
      section = 'ingredients';
      recipes.push(current);
    }

    var sawHeading = lines.some(function (l) { return /^\s*#/.test(l); });

    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;

      var headingMatch = line.match(/^#+\s*(.+)$/);
      if (headingMatch) { start(headingMatch[1]); return; }

      /* Uten «#»-overskrifter blir den første linjen navnet. */
      if (!current) {
        if (!sawHeading) { start(line); return; }
        start(line);
        return;
      }

      var p = line.match(PORTIONS_RE) || line.match(PORTIONS_ALT_RE);
      if (p) { current.portions = normalizePortions(p[1]); return; }

      if (HEAD_ING.test(line)) { section = 'ingredients'; return; }
      if (HEAD_STEP.test(line)) { section = 'steps'; return; }

      if (section === 'steps') {
        var step = stripBullet(line);
        if (step) current.steps.push(step);
        return;
      }
      var ing = parseIngredientLine(line);
      if (ing && ing.name) current.ingredients.push(ing);
    });

    return recipes.filter(function (r) { return r.ingredients.length || r.steps.length; });
  }

  /* Importerer, og oppdaterer en oppskrift som allerede finnes med samme navn
   * i stedet for å lage en kopi. */
  function importRecipes (parsed) {
    var added = 0, updated = 0;
    parsed.forEach(function (data) {
      var match = null;
      state.recipes.forEach(function (r) {
        if (r.name.toLowerCase() === data.name.toLowerCase()) match = r;
      });
      if (match) { updateRecipe(match.id, data, true); updated++; }
      else { addRecipe(data, true); added++; }
    });
    if (added || updated) { render(); scheduleSave(); }
    return { added: added, updated: updated };
  }

  function applyRecipeToActiveList (recipe) {
    var list = getActiveList();
    var adder = getName();
    recipe.ingredients.forEach(function (ing) {
      mergeItemIntoList(list, ingredientShoppingName(ing), ing.qty, adder);
    });
    currentView = 'lists';
    render();
    scheduleSave();
  }

  /* ============================== persistence (Firebase) ============================== */

  function setStatus (s) {
    statusState = s;
    var row = document.querySelector('.status-row');
    if (row) { row.setAttribute('data-state', s); row.lastChild.textContent = statusText(); }
  }

  function scheduleSave () {
    /* Uten forbindelse kan vi ikke lagre til Firebase, men vi tar vare på
     * endringen lokalt og sender den så snart vi er tilkoblet igjen. */
    if (!isWriter) {
      hasUnsyncedEdits = true;
      setCachedState(state);
      setStatus('pending');
      return;
    }
    pendingSave = true;
    setStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 650);
  }

  function doSave () {
    if (!isWriter || !fbDocRef) return;
    pendingSave = false;
    setDoc(fbDocRef, state).then(function () {
      hasUnsyncedEdits = false;
      setCachedState(state);
      setStatus('saved');
    }).catch(function () {
      setStatus('error');
      saveTimer = setTimeout(doSave, 3000);
    });
  }

  function startListening () {
    isWriter = true;
    fbUnsubscribe = onSnapshot(fbDocRef, function (snap) {
      /* Vi FLETTER skyens versjon med vår egen i stedet for å la den ene
       * overskrive den andre. Da overlever både det den andre telefonen har
       * gjort og det vi selv rakk å gjøre uten nett. */
      var remote = migrateState(snap.exists() ? snap.data() : null);
      // If only item contents changed (the common case — you or your partner adding/
      // checking/removing items), patch just the list section so a remote update never
      // steals focus out of whatever you're typing. A structural change (list added/
      // renamed/deleted/reordered, or a recipe change) still gets a full render().
      var prevListShape = state.lists.map(function (l) { return l.id + ':' + l.name; }).join('|');
      var prevRecipesJson = stableJson(state.recipes);
      state = mergeStates(state, remote);
      hasUnsyncedEdits = false;
      ensureActiveList();
      setCachedState(state);
      setStatus('saved');
      var newListShape = state.lists.map(function (l) { return l.id + ':' + l.name; }).join('|');
      var recipesChanged = stableJson(state.recipes) !== prevRecipesJson;
      if (currentView === 'lists' && newListShape === prevListShape && !recipesChanged) {
        renderListOnly();
      } else {
        render();
      }
      /* Ga sammenslåingen noe annet enn det som lå i skyen – typisk fordi vi
       * hadde endringer den ikke kjente til – sender vi resultatet tilbake, så
       * begge telefoner ender på nøyaktig samme liste. */
      if (!snap.exists() || !sameState(state, remote)) scheduleSave();
    }, function () {
      setStatus('error');
    });
  }

  function connectFirebase (cfg, onError) {
    try {
      /* Ved gjentatte forsøk med SAMME oppsett (f.eks. etter at nettet falt ut)
       * gjenbruker vi app-instansen. Endrer oppsettet seg – typisk at man limer
       * inn en ny konfigurasjon – må vi lage en ny, ellers ville vi fortsatt
       * snakket med det gamle prosjektet. Navngitte app-instanser gjør at
       * Firebase ikke klager på at den initialiseres flere ganger. */
      var cfgJson = JSON.stringify(cfg);
      if (fbApp && fbConfigJson !== cfgJson) {
        fbApp = null; fbAuth = null; fbDb = null; fbDocRef = null;
      }
      if (!fbApp) {
        fbApp = initializeApp(cfg, 'handleliste-' + (++fbAppSeq));
        fbAuth = getAuth(fbApp);
        fbDb = getFirestore(fbApp);
        fbDocRef = doc(fbDb, DOC_COLLECTION, DOC_ID);
        fbConfigJson = cfgJson;
      }
    } catch (e) {
      onError('Klarte ikke å tolke konfigurasjonen. Sjekk at du limte inn hele firebaseConfig-blokken.');
      return;
    }
    signInAnonymously(fbAuth).then(function () {
      return getDoc(fbDocRef);
    }).then(function () {
      storeFirebaseConfig(cfg);
      render();
      startListening();
    }).catch(function (err) {
      var code = err && err.code;
      var msg = 'Klarte ikke å koble til Firebase. Sjekk konfigurasjonen og internettforbindelsen.';
      /* Er det oppsettet som er galt, eller er vi bare uten nett akkurat nå?
       * Bare det første skal føre til at vi ber om konfigurasjonen på nytt. */
      var configProblem = true;
      if (code === 'auth/operation-not-allowed') {
        msg = 'Anonym innlogging er ikke slått på i Firebase-prosjektet. Gå til Authentication → Sign-in method og slå på «Anonymous».';
      } else if (code === 'permission-denied' || code === 'firestore/permission-denied') {
        msg = 'Firebase avviste tilgangen. Sjekk sikkerhetsreglene for Firestore.';
      } else if (code === 'auth/invalid-api-key' || code === 'auth/api-key-not-valid') {
        msg = 'API-nøkkelen ser ikke riktig ut. Sjekk at du kopierte hele konfigurasjonen.';
      } else if (code === 'auth/network-request-failed' || code === 'unavailable' ||
                 code === 'firestore/unavailable' || code === 'deadline-exceeded' ||
                 !navigator.onLine) {
        msg = 'Får ikke kontakt med Firebase. Sjekk internettforbindelsen.';
        configProblem = false;
      }
      onError(msg, configProblem);
    });
  }

  function reconnect () {
    if (fbUnsubscribe) { fbUnsubscribe(); fbUnsubscribe = null; }
    clearTimeout(retryTimer);
    clearStoredFirebaseConfig();
    clearCachedState();
    fbApp = null; fbAuth = null; fbDb = null; fbDocRef = null; fbConfigJson = null;
    isWriter = false;
    hasUnsyncedEdits = false;
    renderSetupGate();
  }

  /* ============================== setup gate ============================== */

  function renderSetupGate (errorMsg) {
    root.innerHTML = '';
    var card = el('div', { class: 'setup-card' });
    card.appendChild(el('div', { class: 'brand' }, [
      el('div', { class: 'brand-mark', html: ICON_CART }),
      el('h1', { text: 'Vår Handleliste' })
    ]));
    card.appendChild(el('h2', { text: 'Koble til deling' }));
    card.appendChild(el('p', { text: 'Lim inn firebaseConfig-koden fra Firebase-prosjektet ditt (Prosjektinnstillinger → Dine apper → Web-app). Gjør nøyaktig det samme på begge telefonene, så synkroniseres listene mellom dem automatisk.' }));

    var textarea = el('textarea', { class: 'config-textarea', placeholder: 'const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  ...\n};' });
    card.appendChild(textarea);

    if (errorMsg) card.appendChild(el('p', { class: 'field-error', text: errorMsg }));

    var connectBtn = el('button', { class: 'primary', type: 'button', text: 'Koble til' });
    connectBtn.addEventListener('click', function () {
      var cfg = parseConfigInput(textarea.value);
      if (!cfg) { renderSetupGate('Fant ikke en gyldig firebaseConfig i det du limte inn. Sjekk at du kopierte hele blokken, inkludert apiKey og projectId.'); return; }
      connectBtn.disabled = true;
      connectBtn.textContent = 'Kobler til …';
      connectFirebase(cfg, function (msg) { renderSetupGate(msg); });
    });
    card.appendChild(connectBtn);

    card.appendChild(el('p', { class: 'version', text: 'Versjon ' + APP_VERSION }));
    root.appendChild(el('div', { class: 'setup-screen' }, [card]));
  }

  /* ============================== boot ============================== */

  injectStyles();
  var storedCfg = getStoredFirebaseConfig();

  if (storedCfg) {
    /* Er appen brukt før på denne telefonen, viser vi den lagrede listen med én
     * gang – appen åpner uten venting, og fungerer også helt uten nett. */
    var cached = getCachedState();
    if (cached) {
      state = ensureAtLeastOneList(migrateState(cached));
      ensureActiveList();
      statusState = navigator.onLine ? 'connecting' : 'offline';
      render();
    } else {
      root.appendChild(el('div', { class: 'setup-screen' }, [
        el('div', { class: 'empty-state' }, [ el('h3', { text: 'Kobler til …' }), el('p', { text: 'Henter den delte listen din.' }) ])
      ]));
    }

    var tryConnect = function () {
      connectFirebase(storedCfg, function (msg, configProblem) {
        if (configProblem) {
          /* Oppsettet er faktisk feil – da må vi spørre om konfigurasjonen igjen. */
          clearStoredFirebaseConfig();
          clearCachedState();
          renderSetupGate(msg);
          return;
        }
        /* Bare uten nett: behold oppsettet, vis den lagrede listen, prøv igjen. */
        if (!cached) {
          state = ensureAtLeastOneList(migrateState(getCachedState() || state));
          ensureActiveList();
        }
        setStatus(hasUnsyncedEdits ? 'pending' : 'offline');
        if (!document.querySelector('.status-row')) render();
        clearTimeout(retryTimer);
        retryTimer = setTimeout(tryConnect, 15000);
      });
    };

    tryConnect();
    /* Kommer nettet tilbake, kobler vi til igjen med én gang. */
    window.addEventListener('online', function () {
      if (!isWriter) { clearTimeout(retryTimer); tryConnect(); }
    });
  } else {
    renderSetupGate();
  }
})();
</script>
</body>
</html>
