  /* ============================== list actions ============================== */

  function addList (name) {
    name = normalizeName(name);
    if (!name) return;
    var now = nextCreatedAt();
    var list = { id: uid(), name: name, createdAt: now, updatedAt: now, items: [] };
    state.lists.push(list);
    activeListId = list.id;
    setStoredActiveListId(list.id);
    draftName = '';
    draftQty = 1;
    render();
    scheduleSave();
  }

  function renameList (id, name) {
    name = normalizeName(name);
    if (!name) return;
    var list = null;
    state.lists.forEach(function (l) { if (l.id === id) list = l; });
    if (!list) return;
    list.name = name;
    list.updatedAt = Date.now();
    render();
    scheduleSave();
  }

  function deleteList (id) {
    if (state.lists.length <= 1) return;
    tombstone('lists', id);
    state.lists = state.lists.filter(function (l) { return l.id !== id; });
    if (activeListId === id) {
      activeListId = state.lists[0].id;
      setStoredActiveListId(activeListId);
    }
    render();
    scheduleSave();
  }

  /* ============================== item actions ============================== */

  function findList (listId) {
    var found = null;
    state.lists.forEach(function (l) { if (l.id === listId) found = l; });
    return found;
  }

  /* Legger en vare i listen, og slår den sammen med en som står der fra før:
   *  – samme navn uten mengde: antallet økes, som før
   *  – samme vare med mengde av samme slag: mengdene legges sammen
   *    («kyllinglårfilet (800 g)» + «(400 g)» → «(1200 g)»)
   *  – samme vare, men mengder som ikke kan legges sammen («1 pk» og «400 g»):
   *    en ny rad, plassert rett under den forrige, så de står samlet. */
  function mergeItemIntoList (list, name, qty, adder) {
    name = normalizeName(name);
    if (!name) return;
    qty = normalizeQty(qty);
    var lower = name.toLowerCase();
    var incoming = splitItemName(name);
    var baseLower = incoming.base.toLowerCase();

    var exact = null, combine = null, combineParts = null, lastSameBase = null;
    list.items.forEach(function (it) {
      if (it.checked) return;
      var parts = splitItemName(it.name);
      if (!incoming.amount && !exact && it.name.toLowerCase() === lower) exact = it;
      if (parts.base.toLowerCase() !== baseLower) return;
      if (incoming.amount && !combine && parts.amount && parts.amount.family === incoming.amount.family) {
        combine = it; combineParts = parts;
      }
      if (!lastSameBase || it.addedAt >= lastSameBase.addedAt) lastSameBase = it;
    });

    var now = Date.now();
    if (exact) {
      exact.qty = Math.min(999, exact.qty + qty);
      exact.updatedAt = now;
      return;
    }
    if (combine) {
      combine.name = combineParts.base + ' (' + combineAmounts(combineParts.amount, combine.qty, incoming.amount, qty) + ')';
      combine.qty = 1;
      combine.updatedAt = now;
      return;
    }

    var item = {
      id: uid(),
      name: name,
      qty: qty,
      checked: false,
      addedBy: adder || null,
      checkedBy: null,
      /* Stigende tidsstempler, også når mange varer legges inn i samme
       * millisekund: da står varene i den rekkefølgen de ble lagt til. */
      addedAt: nextCreatedAt(),
      updatedAt: now,
      checkedAt: now
    };
    if (lastSameBase) {
      /* Listen sorteres på når varen ble lagt til. Et tidspunkt midt mellom
       * forrige rad av samme vare og raden etter den gjør at de to blir
       * stående sammen – på begge telefonene. */
      var after = null;
      list.items.forEach(function (it) {
        if (it.addedAt > lastSameBase.addedAt && (after === null || it.addedAt < after)) after = it.addedAt;
      });
      item.addedAt = after === null ? lastSameBase.addedAt + 1 : (lastSameBase.addedAt + after) / 2;
      list.items.splice(list.items.indexOf(lastSameBase) + 1, 0, item);
      return;
    }
    list.items.push(item);
  }

  function addItem (listId, name, qty) {
    var list = findList(listId);
    if (!list) return;
    mergeItemIntoList(list, name, qty, getName());
    renderListOnly();
    scheduleSave();
  }

  function toggleItem (listId, itemId) {
    var list = findList(listId);
    if (!list) return;
    var item = null;
    for (var i = 0; i < list.items.length; i++) { if (list.items[i].id === itemId) { item = list.items[i]; break; } }
    if (!item) return;
    item.checked = !item.checked;
    item.checkedBy = item.checked ? (getName() || null) : null;
    item.checkedAt = Date.now();
    renderListOnly();
    scheduleSave();
  }

  function changeQty (listId, itemId, delta) {
    var list = findList(listId);
    if (!list) return;
    var item = null;
    for (var i = 0; i < list.items.length; i++) { if (list.items[i].id === itemId) { item = list.items[i]; break; } }
    if (!item) return;
    var next = item.qty + delta;
    if (next < 1) next = 1;
    if (next > 999) next = 999;
    if (next === item.qty) return;
    item.qty = next;
    item.updatedAt = Date.now();
    renderListOnly();
    scheduleSave();
  }

  function deleteItem (listId, itemId) {
    var list = findList(listId);
    if (!list) return;
    tombstone('items', itemId);
    list.items = list.items.filter(function (i) { return i.id !== itemId; });
    renderListOnly();
    scheduleSave();
  }

  function clearChecked () {
    var list = getActiveList();
    list.items.forEach(function (i) { if (i.checked) tombstone('items', i.id); });
    list.items = list.items.filter(function (i) { return !i.checked; });
    renderListOnly();
    scheduleSave();
    /* Å tømme de avkryssede varene er slutten på en handletur – det naturlige
     * øyeblikket å spørre hva den kostet. Kan slås av per telefon. */
    if (getAskTrip()) showTripModal(null, { afterClear: true });
  }

  /* ============================== handleturer: handlinger ============================== */

  function findTrip (id) {
    for (var i = 0; i < state.trips.length; i++) if (state.trips[i].id === id) return state.trips[i];
    return null;
  }
  /* Turene holdes sortert på dato, også rett etter at du har lagt inn en tur
   * med en eldre dato – ellers havner den feil i listen til neste synkronisering. */
  function sortTrips () { state.trips = canonicalTrips(state.trips, state.tombstones); }
  function addTrip (ymd, ore) {
    var now = nextCreatedAt();
    state.trips.push({ id: uid(), date: ymd, amount: ore, addedBy: getName() || null, createdAt: now, updatedAt: now });
    sortTrips();
    scheduleSave();
  }
  function updateTrip (id, ymd, ore) {
    var t = findTrip(id);
    if (!t) return;
    t.date = ymd;
    t.amount = ore;
    t.updatedAt = Date.now();
    sortTrips();
    scheduleSave();
  }
  function deleteTrip (id) {
    tombstone('trips', id);
    state.trips = state.trips.filter(function (t) { return t.id !== id; });
    scheduleSave();
  }

  /* ============================== recipe actions ============================== */

  function findRecipe (id) {
    var found = null;
    state.recipes.forEach(function (r) { if (r.id === id) found = r; });
    return found;
  }

  function addRecipe (data, quiet) {
    var now = nextCreatedAt();
    state.recipes.push({
      id: uid(),
      name: data.name,
      portions: normalizePortions(data.portions),
      minutes: normalizeMinutes(data.minutes),
      ingredients: normalizeIngredients(data.ingredients),
      steps: normalizeSteps(data.steps),
      rating: normalizeRating(data.rating),
      ratedAt: normalizeRating(data.rating) ? now : 0,
      hasImage: false,
      imageAt: 0,
      createdAt: now,
      updatedAt: now
    });
    if (quiet) return;
    render();
    scheduleSave();
  }

  function updateRecipe (id, data, quiet) {
    var recipe = findRecipe(id);
    if (!recipe) return;
    recipe.name = data.name;
    recipe.portions = normalizePortions(data.portions);
    recipe.minutes = normalizeMinutes(data.minutes);
    recipe.ingredients = normalizeIngredients(data.ingredients);
    recipe.steps = normalizeSteps(data.steps);
    /* Terningkastet røres ikke her – det settes for seg, og skal overleve at
     * oppskriften redigeres eller importeres på nytt. */
    recipe.updatedAt = Date.now();
    if (quiet) return;
    render();
    scheduleSave();
  }

  /* ============================== bilder ============================== */

  /* Bildet krympes i nettleseren på telefonen før noe sendes. Et mobilbilde på
   * fire megabyte blir til rundt hundre kilobyte – rikelig for en telefonskjerm,
   * og raskt å laste på dårlig dekning. */
  var IMAGE_MAX_SIDE = 900;
  var IMAGE_QUALITY = 0.7;
  /* Miniatyren ligger i sitt eget dokument, slik at oppskriftslisten kan hente
   * bare den – 23 miniatyrer er noen hundre kilobyte, mot flere megabyte om vi
   * hadde måttet laste ned alle de store bildene for å bla gjennom listen. */
  var THUMB_MAX_SIDE = 320;
  var THUMB_QUALITY = 0.6;
  var THUMB_SUFFIX = '__mini';
  var THUMB_CACHE_PREFIX = 'handleliste_mini_';

  function compressImage (file, maxSide, quality) {
    maxSide = maxSide || IMAGE_MAX_SIDE;
    quality = quality || IMAGE_QUALITY;
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type || '')) {
        reject(new Error('Filen er ikke et bilde.'));
        return;
      }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Klarte ikke å lese filen.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Klarte ikke å åpne bildet.')); };
        img.onload = function () {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) { reject(new Error('Bildet har ingen størrelse.')); return; }
          var scale = Math.min(1, maxSide / Math.max(w, h));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(h * scale);
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          try {
            resolve(canvas.toDataURL('image/jpeg', quality));
          } catch (e) {
            reject(new Error('Klarte ikke å komprimere bildet.'));
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* Hentede bilder holdes i minnet så lenge appen er åpen, slik at det ikke
   * lastes ned på nytt hver gang du åpner den samme oppskriften. */
  var imageCache = {};

  function imageRef (recipeId) {
    if (!fbDb) return null;
    return doc(fbDb, IMAGE_COLLECTION, recipeId);
  }
  function thumbRef (recipeId) {
    if (!fbDb) return null;
    /* Samme samling som det store bildet, så sikkerhetsreglene dekker begge. */
    return doc(fbDb, IMAGE_COLLECTION, recipeId + THUMB_SUFFIX);
  }

  /* Miniatyrene lagres på telefonen, slik at listen bare henter hvert bilde
   * én gang – deretter blar du gjennom uten å bruke mobildata i det hele tatt. */
  function readCachedThumb (recipeId, imageAt) {
    try {
      var raw = localStorage.getItem(THUMB_CACHE_PREFIX + recipeId);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || obj.at !== imageAt) return null;
      return obj.data || null;
    } catch (e) { return null; }
  }
  function writeCachedThumb (recipeId, imageAt, dataUrl) {
    try {
      localStorage.setItem(THUMB_CACHE_PREFIX + recipeId, JSON.stringify({ at: imageAt, data: dataUrl }));
    } catch (e) {
      /* Fullt lager: kast alle miniatyrer og prøv én gang til. De hentes
       * uansett ned igjen ved behov. */
      try {
        Object.keys(localStorage).forEach(function (k) {
          if (k.indexOf(THUMB_CACHE_PREFIX) === 0) localStorage.removeItem(k);
        });
        localStorage.setItem(THUMB_CACHE_PREFIX + recipeId, JSON.stringify({ at: imageAt, data: dataUrl }));
      } catch (e2) {}
    }
  }
  function clearCachedThumb (recipeId) {
    try { localStorage.removeItem(THUMB_CACHE_PREFIX + recipeId); } catch (e) {}
  }

  function loadRecipeThumb (recipeId, imageAt) {
    var cached = readCachedThumb(recipeId, imageAt);
    if (cached) return Promise.resolve(cached);
    var ref = thumbRef(recipeId);
    if (!ref) return Promise.resolve(null);
    return getDoc(ref).then(function (snap) {
      var data = snap.exists() ? snap.data() : null;
      var url = (data && typeof data.data === 'string' && data.data) ? data.data : null;
      if (url) writeCachedThumb(recipeId, imageAt, url);
      return url;
    }).catch(function () { return null; });
  }

  function loadRecipeImage (recipeId) {
    if (Object.prototype.hasOwnProperty.call(imageCache, recipeId)) {
      return Promise.resolve(imageCache[recipeId]);
    }
    var ref = imageRef(recipeId);
    if (!ref) return Promise.resolve(null);
    return getDoc(ref).then(function (snap) {
      var data = snap.exists() ? snap.data() : null;
      var url = (data && typeof data.data === 'string' && data.data) ? data.data : null;
      imageCache[recipeId] = url;
      return url;
    }).catch(function () { return null; });
  }

  function saveRecipeImage (recipeId, dataUrl, thumbUrl) {
    var ref = imageRef(recipeId);
    var tRef = thumbRef(recipeId);
    if (!ref || !tRef) return Promise.reject(new Error('Ikke tilkoblet.'));
    var now = Date.now();
    return Promise.all([
      setDoc(ref, { data: dataUrl, updatedAt: now }),
      setDoc(tRef, { data: thumbUrl || '', updatedAt: now })
    ]).then(function () {
      imageCache[recipeId] = dataUrl || null;
      if (thumbUrl) writeCachedThumb(recipeId, now, thumbUrl);
      else clearCachedThumb(recipeId);
      var recipe = findRecipe(recipeId);
      if (recipe) {
        recipe.hasImage = !!dataUrl;
        recipe.imageAt = now;
        scheduleSave();
      }
    });
  }

  /* Tomme dokumenter i stedet for sletting: da slipper vi å importere enda en
   * funksjon fra Firebase, og tomme dokumenter tar ingen plass av betydning. */
  function clearRecipeImage (recipeId) {
    return saveRecipeImage(recipeId, '', '');
  }

  /* ============================== menyarkivet ==============================
   * Ett dokument per år («2026»), med samme dag-rader som i ukesmenyen. Uker
   * som har rullet ut av vinduet flyttes hit, og hentes bare når noen ber om
   * å se en gammel uke fra Kostnad. */

  var archiveCache = {};       // år -> rader, så samme år ikke hentes to ganger
  var archiveBusy = false;
  var archiveTimer = null;
  /* null = alt i orden, 'rules' = Firebase sier nei (reglene er ikke limt inn),
   * 'network' = midlertidig feil. Vises i Kostnad, så det ikke feiler i stillhet. */
  var archiveProblem = null;

  function archiveRef (year) {
    if (!fbDb) return null;
    return doc(fbDb, ARCHIVE_COLLECTION, String(year));
  }
  function archiveYearOf (weekKey) { return weekKey.slice(0, 4); }
  function isPermissionError (err) {
    var code = err && err.code;
    return code === 'permission-denied' || code === 'firestore/permission-denied';
  }
  function canonicalArchive (rows) {
    var cutoff = oldestHistoryWeekKey();
    return rows
      .filter(function (d) { return d.week >= cutoff; })
      .sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
  }
  function readArchiveYear (year) {
    if (archiveCache[year]) return Promise.resolve(archiveCache[year]);
    var ref = archiveRef(year);
    if (!ref) return Promise.reject(new Error('offline'));
    return getDoc(ref).then(function (snap) {
      var rows = normalizeMenu(snap.exists() ? (snap.data() || {}).menu : null);
      archiveCache[year] = rows;
      return rows;
    });
  }

  /* Flytter uker eldre enn vinduet over i arkivet, og fjerner dem fra
   * hoveddokumentet først når arkivet har bekreftet at de er lagret. Går noe
   * galt, blir ukene liggende der de var – ingenting går tapt. To telefoner
   * kan gjøre dette samtidig: arkivet leses og flettes før det skrives, og
   * flettingen er den samme som i selve ukesmenyen. */
  function archiveOldWeeks () {
    if (!isWriter || !fbDb || archiveBusy) return;
    var cutoff = oldestKeptWeekKey();
    var old = state.menu.filter(function (d) { return d.week < cutoff; });
    if (!old.length) return;

    archiveBusy = true;
    var byYear = {};
    old.forEach(function (d) {
      var y = archiveYearOf(d.week);
      (byYear[y] = byYear[y] || []).push(d);
    });

    Promise.all(Object.keys(byYear).map(function (year) {
      /* Les alltid på nytt her – den andre telefonen kan ha arkivert noe siden sist. */
      delete archiveCache[year];
      return readArchiveYear(year).then(function (existing) {
        var merged = canonicalArchive(mergeById(existing, byYear[year], mergeMenuDays));
        if (stableJson(merged) === stableJson(existing)) return;   // alt lå der allerede
        return setDoc(archiveRef(year), { menu: merged, updatedAt: Date.now() })
          .then(function () { archiveCache[year] = merged; });
      });
    })).then(function () {
      var moved = {};
      old.forEach(function (d) { moved[d.id] = d; });
      /* Bare rader som ikke er endret mens vi holdt på, fjernes. */
      state.menu = state.menu.filter(function (d) {
        return !(moved[d.id] && stableJson(moved[d.id]) === stableJson(d));
      });
      archiveProblem = null;
      scheduleSave();
    }).catch(function (err) {
      archiveProblem = isPermissionError(err) ? 'rules' : 'network';
      if (currentView === 'costs') render();
    }).then(function () {
      archiveBusy = false;
    });
  }
  function scheduleArchive () {
    clearTimeout(archiveTimer);
    archiveTimer = setTimeout(archiveOldWeeks, 1500);
  }

  /* Alle sju dagene i en uke, uansett hvor de ligger: i hoveddokumentet, i
   * arkivet, eller – rett etter at uken rullet ut – litt i begge. */
  function loadWeekMenu (weekKey) {
    var live = state.menu.filter(function (d) { return d.week === weekKey; });
    if (weekKey >= oldestKeptWeekKey()) return Promise.resolve(live);
    if (!isWriter || !fbDb) {
      return live.length ? Promise.resolve(live) : Promise.reject(new Error('offline'));
    }
    return readArchiveYear(archiveYearOf(weekKey)).then(function (rows) {
      var archived = rows.filter(function (d) { return d.week === weekKey; });
      return mergeById(archived, live, mergeMenuDays);
    });
  }

  function setRecipeRating (id, value) {
    var recipe = findRecipe(id);
    if (!recipe) return;
    recipe.rating = normalizeRating(value);
    recipe.ratedAt = Date.now();
    render();
    scheduleSave();
  }

  function deleteRecipe (id) {
    var recipe = findRecipe(id);
    /* Slettes oppskriften, skal bildet bort også – ellers blir det liggende og
     * ta plass uten at noe peker på det. */
    if (recipe && recipe.hasImage) clearRecipeImage(id).catch(function () {});
    delete imageCache[id];
    clearCachedThumb(id);
    tombstone('recipes', id);
    state.recipes = state.recipes.filter(function (r) { return r.id !== id; });
    render();
    scheduleSave();
  }

  /* ============================== import av oppskrifter ============================== */

  /* Tolker oppskrifter skrevet som vanlig tekst. Formatet er med vilje løst:
   * det skal tåle å bli skrevet for hånd, limt inn fra et nettsted, eller
   * generert. «#» starter en ny oppskrift; ellers gjetter vi oss fram. */

  var UNIT = '(?:g|gram|kg|hg|dl|cl|ml|l|liter|ss|ts|krm|stk|pk|pakke|pakker|boks|bokser|dåse|dåser|glass|fedd|neve|never|klype|klyper|kopp|kopper|pose|poser|skive|skiver|cup|cups|bunt|bunter|stilk|stilker|stang|stenger|hode|hoder|potte|potter|kvast|blad|bit|biter|ark|terning|terninger|cm|pors\\.?)';
  var AMOUNT_RE = new RegExp(
    '^((?:\\d+(?:[.,]\\d+)?(?:\\s*[-–]\\s*\\d+(?:[.,]\\d+)?)?|\\d+\\s*\\/\\s*\\d+|[½¼¾]))\\s*(' + UNIT + ')?\\.?\\s+(.+)$', 'i');

  var HEAD_ING = /^(?:ingredienser|ingrediensar|du trenger|dette trenger du|varer)\s*:?\s*$/i;
  var HEAD_STEP = /^(?:fremgangsm[åa]te|framgangsm[åa]te|slik gj[øo]r du(?: det)?|slik lager du det|metode|steg|oppskrift|tilberedning)\s*:?\s*$/i;
  var PORTIONS_RE = /^(?:porsjoner?|antall porsjoner|serverer)\s*:?\s*(\d+)/i;
  var TIME_RE = /^(?:tid|tilberedningstid|koketid|steketid|total ?tid)\s*:?\s*(.+)$/i;
  var PORTIONS_ALT_RE = /^(\d+)\s*porsjoner?\.?$/i;

  function stripBullet (line) {
    return line.replace(/^\s*(?:[-*•‣–—]|\d+[.)])\s*/, '').trim();
  }

  function parseIngredientLine (line) {
    var text = stripBullet(line);
    if (!text) return null;
    var m = text.match(AMOUNT_RE);
    /* Ingen tall i linjen – «salt og pepper». counted:false gjør at den ikke
     * ganges opp når man drar i mengdeglideren. */
    if (!m) return { name: normalizeName(text), qty: 1, amount: '', counted: false };
    var number = m[1].trim();
    var unit = (m[2] || '').trim();
    var rest = normalizeName(m[3]);
    if (!rest) return { name: normalizeName(text), qty: 1, amount: '', counted: false };
    if (unit) return { name: rest, qty: 1, amount: (number + ' ' + unit).trim(), counted: false };
    /* Tall uten enhet – «2 egg» – er et antall, ikke en mengde. */
    var n = parseInt(number, 10);
    if (/^\d+$/.test(number) && n >= 1 && n <= 99) return { name: rest, qty: n, amount: '', counted: true };
    return { name: rest, qty: 1, amount: number, counted: false };
  }

  function parseRecipeText (text) {
    var lines = (text || '').replace(/\r\n?/g, '\n').split('\n');
    var recipes = [];
    var current = null;
    var section = 'ingredients';

    function start (name) {
      current = { name: normalizeName(name) || 'Oppskrift', portions: null, minutes: null, ingredients: [], steps: [] };
      section = 'ingredients';
      recipes.push(current);
    }

    var sawHeading = lines.some(function (l) { return /^\s*#/.test(l); });

    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;

      var headingMatch = line.match(/^#+\s*(.+)$/);
      if (headingMatch) { start(headingMatch[1]); return; }

      /* Uten «#»-overskrifter blir den første linjen navnet. */
      if (!current) {
        if (!sawHeading) { start(line); return; }
        start(line);
        return;
      }

      var p = line.match(PORTIONS_RE) || line.match(PORTIONS_ALT_RE);
      if (p) { current.portions = normalizePortions(p[1]); return; }

      var t = line.match(TIME_RE);
      if (t) { current.minutes = normalizeMinutes(t[1]); return; }

      if (HEAD_ING.test(line)) { section = 'ingredients'; return; }
      if (HEAD_STEP.test(line)) { section = 'steps'; return; }

      if (section === 'steps') {
        var step = stripBullet(line);
        if (step) current.steps.push(step);
        return;
      }
      var ing = parseIngredientLine(line);
      if (ing && ing.name) current.ingredients.push(ing);
    });

    return recipes.filter(function (r) { return r.ingredients.length || r.steps.length; });
  }

  /* Importerer, og oppdaterer en oppskrift som allerede finnes med samme navn
   * i stedet for å lage en kopi. */
  function importRecipes (parsed) {
    var added = 0, updated = 0;
    parsed.forEach(function (data) {
      var match = null;
      state.recipes.forEach(function (r) {
        if (r.name.toLowerCase() === data.name.toLowerCase()) match = r;
      });
      if (match) { updateRecipe(match.id, data, true); updated++; }
      else { addRecipe(data, true); added++; }
    });
    if (added || updated) { render(); scheduleSave(); }
    return { added: added, updated: updated };
  }

  /* Legger ingrediensene i en liste uten å bytte visning. Ukesmenyen bruker
   * denne direkte, slik at du kan legge til flere dager på rad uten å bli
   * kastet over i handlelisten mellom hver. */
  function addRecipeToList (list, recipe, factor) {
    var adder = getName();
    var f = (typeof factor === 'number' && isFinite(factor) && factor > 0) ? factor : 1;
    recipe.ingredients.forEach(function (raw) {
      /* Har du dratt i glideren, er det de skalerte mengdene som skal handles. */
      var ing = scaleIngredient(raw, f);
      mergeItemIntoList(list, ingredientShoppingName(ing), ing.qty, adder);
    });
    if (summaryEl) summaryEl.textContent = itemsSummary(list);
  }

  function applyRecipeToActiveList (recipe, factor) {
    addRecipeToList(getActiveList(), recipe, factor);
    currentView = 'lists';
    render();
    scheduleSave();
  }

  /* ============================== persistence (Firebase) ============================== */

  function setStatus (s) {
    statusState = s;
    var row = document.querySelector('.status-row');
    if (row) { row.setAttribute('data-state', s); row.lastChild.textContent = statusText(); }
  }

  function scheduleSave () {
    /* Uten forbindelse kan vi ikke lagre til Firebase, men vi tar vare på
     * endringen lokalt og sender den så snart vi er tilkoblet igjen. */
    if (!isWriter) {
      hasUnsyncedEdits = true;
      setCachedState(state);
      setStatus('pending');
      return;
    }
    pendingSave = true;
    setStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 650);
  }

  function doSave () {
    if (!isWriter || !fbDocRef) return;
    pendingSave = false;
    setDoc(fbDocRef, state).then(function () {
      hasUnsyncedEdits = false;
      setCachedState(state);
      setStatus('saved');
    }).catch(function () {
      setStatus('error');
      saveTimer = setTimeout(doSave, 3000);
    });
  }

  function rawItemCount (s) {
    var n = 0;
    if (s && Array.isArray(s.lists)) s.lists.forEach(function (l) { if (l && Array.isArray(l.items)) n += l.items.length; });
    return n;
  }

  function startListening () {
    isWriter = true;
    fbUnsubscribe = onSnapshot(fbDocRef, function (snap) {
      /* Vi FLETTER skyens versjon med vår egen i stedet for å la den ene
       * overskrive den andre. Da overlever både det den andre telefonen har
       * gjort og det vi selv rakk å gjøre uten nett. */
      var raw = snap.exists() ? snap.data() : null;
      var remote = migrateState(raw);
      // If only item contents changed (the common case — you or your partner adding/
      // checking/removing items), patch just the list section so a remote update never
      // steals focus out of whatever you're typing. A structural change (list added/
      // renamed/deleted/reordered, or a recipe change) still gets a full render().
      var prevListShape = state.lists.map(function (l) { return l.id + ':' + l.name; }).join('|');
      var prevRecipesJson = stableJson(state.recipes);
      state = mergeStates(state, remote);
      hasUnsyncedEdits = false;
      ensureActiveList();
      setCachedState(state);
      setStatus('saved');
      var newListShape = state.lists.map(function (l) { return l.id + ':' + l.name; }).join('|');
      var recipesChanged = stableJson(state.recipes) !== prevRecipesJson;
      if (currentView === 'lists' && newListShape === prevListShape && !recipesChanged) {
        renderListOnly();
      } else {
        render();
      }
      /* Ga sammenslåingen noe annet enn det som lå i skyen – typisk fordi vi
       * hadde endringer den ikke kjente til – sender vi resultatet tilbake, så
       * begge telefoner ender på nøyaktig samme liste. */
      /* Ble skyens versjon ryddet da den ble lest inn – dobbeltrader slått
       * sammen, slettede varer fjernet – sender vi den ryddede versjonen
       * tilbake. Ellers ville rotet blitt liggende i skyen, og hver telefon
       * måtte rydde det på nytt hver gang. */
      if (!snap.exists() || !sameState(state, remote) || rawItemCount(raw) !== rawItemCount(remote)) scheduleSave();
      /* Har noen uker rullet ut av vinduet, flyttes de til arkivet. */
      var weekCutoff = oldestKeptWeekKey();
      if (state.menu.some(function (d) { return d.week < weekCutoff; })) scheduleArchive();
    }, function () {
      setStatus('error');
    });
  }

  function connectFirebase (cfg, onError) {
    try {
      /* Ved gjentatte forsøk med SAMME oppsett (f.eks. etter at nettet falt ut)
       * gjenbruker vi app-instansen. Endrer oppsettet seg – typisk at man limer
       * inn en ny konfigurasjon – må vi lage en ny, ellers ville vi fortsatt
       * snakket med det gamle prosjektet. Navngitte app-instanser gjør at
       * Firebase ikke klager på at den initialiseres flere ganger. */
      var cfgJson = JSON.stringify(cfg);
      if (fbApp && fbConfigJson !== cfgJson) {
        fbApp = null; fbAuth = null; fbDb = null; fbDocRef = null;
      }
      if (!fbApp) {
        fbApp = initializeApp(cfg, 'handleliste-' + (++fbAppSeq));
        fbAuth = getAuth(fbApp);
        fbDb = getFirestore(fbApp);
        fbDocRef = doc(fbDb, DOC_COLLECTION, DOC_ID);
        fbConfigJson = cfgJson;
      }
    } catch (e) {
      onError('Klarte ikke å tolke konfigurasjonen. Sjekk at du limte inn hele firebaseConfig-blokken.');
      return;
    }
    signInAnonymously(fbAuth).then(function () {
      return getDoc(fbDocRef);
    }).then(function () {
      storeFirebaseConfig(cfg);
      render();
      startListening();
    }).catch(function (err) {
      var code = err && err.code;
      var msg = 'Klarte ikke å koble til Firebase. Sjekk konfigurasjonen og internettforbindelsen.';
      /* Er det oppsettet som er galt, eller er vi bare uten nett akkurat nå?
       * Bare det første skal føre til at vi ber om konfigurasjonen på nytt. */
      var configProblem = true;
      if (code === 'auth/operation-not-allowed') {
        msg = 'Anonym innlogging er ikke slått på i Firebase-prosjektet. Gå til Authentication → Sign-in method og slå på «Anonymous».';
      } else if (code === 'permission-denied' || code === 'firestore/permission-denied') {
        msg = 'Firebase avviste tilgangen. Sjekk sikkerhetsreglene for Firestore.';
      } else if (code === 'auth/invalid-api-key' || code === 'auth/api-key-not-valid') {
        msg = 'API-nøkkelen ser ikke riktig ut. Sjekk at du kopierte hele konfigurasjonen.';
      } else if (code === 'auth/network-request-failed' || code === 'unavailable' ||
                 code === 'firestore/unavailable' || code === 'deadline-exceeded' ||
                 !navigator.onLine) {
        msg = 'Får ikke kontakt med Firebase. Sjekk internettforbindelsen.';
        configProblem = false;
      }
      onError(msg, configProblem);
    });
  }

  function reconnect () {
    if (fbUnsubscribe) { fbUnsubscribe(); fbUnsubscribe = null; }
    clearTimeout(retryTimer);
    clearStoredFirebaseConfig();
    clearCachedState();
    fbApp = null; fbAuth = null; fbDb = null; fbDocRef = null; fbConfigJson = null;
    isWriter = false;
    hasUnsyncedEdits = false;
    renderSetupGate();
  }

  /* ============================== setup gate ============================== */

  function renderSetupGate (errorMsg) {
    root.innerHTML = '';
    var card = el('div', { class: 'setup-card' });
    card.appendChild(el('div', { class: 'brand' }, [
      el('div', { class: 'brand-mark', html: ICON_CART }),
      el('h1', { text: 'Vår Handleliste' })
    ]));
    card.appendChild(el('h2', { text: 'Koble til deling' }));
    card.appendChild(el('p', { text: 'Lim inn firebaseConfig-koden fra Firebase-prosjektet ditt (Prosjektinnstillinger → Dine apper → Web-app). Gjør nøyaktig det samme på begge telefonene, så synkroniseres listene mellom dem automatisk.' }));

    var textarea = el('textarea', { class: 'config-textarea', placeholder: 'const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  ...\n};' });
    card.appendChild(textarea);

    if (errorMsg) card.appendChild(el('p', { class: 'field-error', text: errorMsg }));

    var connectBtn = el('button', { class: 'primary', type: 'button', text: 'Koble til' });
    connectBtn.addEventListener('click', function () {
      var cfg = parseConfigInput(textarea.value);
      if (!cfg) { renderSetupGate('Fant ikke en gyldig firebaseConfig i det du limte inn. Sjekk at du kopierte hele blokken, inkludert apiKey og projectId.'); return; }
      connectBtn.disabled = true;
      connectBtn.textContent = 'Kobler til …';
      connectFirebase(cfg, function (msg) { renderSetupGate(msg); });
    });
    card.appendChild(connectBtn);

    card.appendChild(el('p', { class: 'version', text: 'Versjon ' + APP_VERSION }));
    root.appendChild(el('div', { class: 'setup-screen' }, [card]));
  }

  /* ============================== boot ============================== */

  injectStyles();
  var storedCfg = getStoredFirebaseConfig();

  if (storedCfg) {
    /* Er appen brukt før på denne telefonen, viser vi den lagrede listen med én
     * gang – appen åpner uten venting, og fungerer også helt uten nett. */
    var cached = getCachedState();
    if (cached) {
      state = ensureAtLeastOneList(migrateState(cached));
      ensureActiveList();
      statusState = navigator.onLine ? 'connecting' : 'offline';
      render();
    } else {
      root.appendChild(el('div', { class: 'setup-screen' }, [
        el('div', { class: 'empty-state' }, [ el('h3', { text: 'Kobler til …' }), el('p', { text: 'Henter den delte listen din.' }) ])
      ]));
    }

    var tryConnect = function () {
      connectFirebase(storedCfg, function (msg, configProblem) {
        if (configProblem) {
          /* Oppsettet er faktisk feil – da må vi spørre om konfigurasjonen igjen. */
          clearStoredFirebaseConfig();
          clearCachedState();
          renderSetupGate(msg);
          return;
        }
        /* Bare uten nett: behold oppsettet, vis den lagrede listen, prøv igjen. */
        if (!cached) {
          state = ensureAtLeastOneList(migrateState(getCachedState() || state));
          ensureActiveList();
        }
        setStatus(hasUnsyncedEdits ? 'pending' : 'offline');
        if (!document.querySelector('.status-row')) render();
        clearTimeout(retryTimer);
        retryTimer = setTimeout(tryConnect, 15000);
      });
    };

    tryConnect();
    /* Kommer nettet tilbake, kobler vi til igjen med én gang. */
    window.addEventListener('online', function () {
      if (!isWriter) { clearTimeout(retryTimer); tryConnect(); }
    });
  } else {
    renderSetupGate();
  }
})();
</script>
</body>
</html>
