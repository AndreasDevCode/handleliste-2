<!-- ============ PWA: installasjon, offline-varsel, service worker ============ -->
<script>
(function () {
  'use strict';

  /* ---- Offline-varsel ---- */
  var bar = document.createElement('div');
  bar.id = 'offline-bar';
  bar.setAttribute('role', 'status');
  bar.innerHTML = '<span class="dot"></span><span>Ingen nett – endringer sendes når du er tilkoblet igjen</span>';
  document.body.appendChild(bar);

  function syncOnlineState () {
    if (navigator.onLine) bar.classList.remove('is-visible');
    else bar.classList.add('is-visible');
  }
  window.addEventListener('online', syncOnlineState);
  window.addEventListener('offline', syncOnlineState);
  syncOnlineState();

  /* ---- «Installer app»-knapp ----
   * Chrome/Android sender beforeinstallprompt når appen kan installeres og
   * ikke allerede er installert. Da viser vi en knapp; ellers ingenting. */
  var deferredPrompt = null;
  var installBtn = document.createElement('button');
  installBtn.id = 'install-btn';
  installBtn.type = 'button';
  installBtn.innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>' +
    '<span>Installer app</span>';
  document.body.appendChild(installBtn);

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('is-visible');
  });

  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) { installBtn.classList.remove('is-visible'); return; }
    var p = deferredPrompt;
    deferredPrompt = null;
    installBtn.classList.remove('is-visible');
    p.prompt();
  });

  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    installBtn.classList.remove('is-visible');
  });

  /* ---- Service worker ----
   * Krever https (GitHub Pages) eller localhost. Åpnes filen rett fra disk
   * hopper vi bare over det – appen fungerer likevel, bare uten offline. */
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var incoming = reg.installing;
          if (!incoming) return;
          incoming.addEventListener('statechange', function () {
            /* Ny versjon er klar: la den ta over med én gang, så er den i bruk
             * neste gang appen åpnes. Vi laster bevisst IKKE siden på nytt –
             * det ville kunne avbryte noen midt i å skrive inn en vare. */
            if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
              incoming.postMessage('SKIP_WAITING');
            }
          });
        });
      }).catch(function () { /* uten service worker fungerer alt bortsett fra offline */ });
    });
  }
})();
</script>

    if (!/^\d{4}-W\d{2}$/.test(week) || day < 0 || day > 6) return null;
    return {
      id: menuDayId(week, day),
      week: week,
      day: day,
      recipeId: normalizeName(raw && raw.recipeId).slice(0, 40),
      /* Navnet lagres ved siden av id-en, slik at menyen fortsatt kan vise hva
       * som var planlagt selv om oppskriften er slettet i mellomtiden. */
      recipeName: normalizeName(raw && raw.recipeName).slice(0, 80),
      note: normalizeName(raw && raw.note).slice(0, 80),
      updatedAt: num(raw && raw.updatedAt, 0),
      noteAt: num(raw && raw.noteAt, 0)
    };
  }
  function normalizeMenu (raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    raw.forEach(function (d) {
      var day = normalizeMenuDay(d);
      if (day) out.push(day);
    });
    return out;
  }

  /* Retten og notatet har hver sin klokke. Velger han middagen samtidig som hun
   * skriver «rester» på samme dag, overlever begge deler. */
  function mergeMenuDays (a, b) {
    var dish = pickNewer(a, b, 'updatedAt');
    var note = pickNewer(a, b, 'noteAt');
    return {
      id: a.id,
      week: a.week,
      day: a.day,
      recipeId: dish.recipeId,
      recipeName: dish.recipeName,
      note: note.note,
      updatedAt: Math.max(a.updatedAt, b.updatedAt),
      noteAt: Math.max(a.noteAt, b.noteAt)
    };
  }

  /* En tømt dag blir liggende som en tom rad med tidsstempel. Den ER
   * gravsteinen: kastet vi den, ville den andre telefonens kopi av middagen
   * komme tilbake ved neste sammenslåing. */
  function canonicalMenu (menu) {
    /* Gamle uker kastes ikke lenger her – de flyttes til arkivet av
     * archiveOldWeeks(), som trenger nett. Bare det som er eldre enn hele
     * historikken faller bort, så hoveddokumentet aldri kan vokse uten grense. */
    var cutoff = oldestHistoryWeekKey();
    return (menu || [])
      .filter(function (d) { return d.week >= cutoff; })
      .filter(function (d) { return d.recipeId || d.note || d.updatedAt || d.noteAt; })
      .sort(function (a, b) { return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0); });
  }

  /* ============================== handleturer: penger og datoer ==============================
   * Beløp lagres i øre som heltall. Med desimaltall ville et år med summer
   * drevet noen øre feil; med heltall er hver sum eksakt. */

  var NBSP = ' ';
  var MAX_TRIP_ORE = 10000000;   // 100 000 kr – alt over er nesten sikkert en tastefeil

  /* Godtar «1247,80», «1247.80», «1 247,80», «1.247,80», «1248» og «1248 kr».
   * Returnerer øre, eller null hvis teksten ikke er et fornuftig beløp. */
  function parseAmount (text) {
    var t = String(text == null ? '' : text).replace(/[\s  ]/g, '').replace(/kr\.?$/i, '').replace(/,-$/, '');
    if (!t) return null;
    if (t.indexOf(',') !== -1) {
      /* Komma er desimaltegnet; punktum foran er tusenskille. */
      t = t.replace(/\./g, '').replace(',', '.');
    } else if ((t.match(/\./g) || []).length > 1) {
      t = t.replace(/\./g, '');
    }
    if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
    var parts = t.split('.');
    var ore = parseInt(parts[0], 10) * 100 + (parts[1] ? parseInt((parts[1] + '0').slice(0, 2), 10) : 0);
    if (!(ore > 0) || ore > MAX_TRIP_ORE) return null;
    return ore;
  }
  function groupThousands (n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  }
  /* Nøyaktig beløp: «1 247,80 kr», men «2 015 kr» uten et tomt «,00». */
  function formatKr (ore) {
    var neg = ore < 0;
    ore = Math.abs(Math.round(ore));
    var kr = Math.floor(ore / 100), rest = ore % 100;
    return (neg ? '−' : '') + groupThousands(kr) + (rest ? ',' + pad2(rest) : '') + NBSP + 'kr';
  }
  /* Avrundet til hele kroner – for summer og diagram, der ørene bare er støy. */
  function formatKrRounded (ore) {
    var kr = Math.round(ore / 100);
    return (kr < 0 ? '−' : '') + groupThousands(Math.abs(kr)) + NBSP + 'kr';
  }
  /* Til feltet når du retter en tur: ingen tusenskille, komma for øre. */
  function amountInputValue (ore) {
    var kr = Math.floor(ore / 100), rest = ore % 100;
    return String(kr) + (rest ? ',' + pad2(rest) : '');
  }
  function formatPct (fraction) {
    var p = Math.round(fraction * 1000) / 10;
    var sign = p > 0 ? '+' : (p < 0 ? '−' : '±');
    return sign + String(Math.abs(p)).replace('.', ',') + NBSP + '%';
  }

  /* Datoer lagres som «2026-10-03» i telefonens lokale tid. Som tekst
   * sorterer de riktig, og de er de samme uansett tidssone på lagringstidspunktet. */
  function ymdOf (d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseYmd (s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return (d.getMonth() === +m[2] - 1) ? d : null;
  }
  function daysInMonth (year, month) { return new Date(year, month + 1, 0).getDate(); }

  /* Handleturer tas vare på i 25 måneder: to år, og en måned ekstra slik at
   * «samme måned i fjor» fortsatt har en hel måned å sammenligne med. */
  var TRIP_KEEP_MONTHS = 25;
  function oldestTripYmd () {
    var t = dateOnly(new Date());
    return ymdOf(new Date(t.getFullYear(), t.getMonth() - TRIP_KEEP_MONTHS, t.getDate()));
  }

  function normalizeTrip (raw) {
    var date = parseYmd(raw && raw.date);
    var amount = Math.round(num(raw && raw.amount, 0));
    if (!date || !(amount > 0) || amount > MAX_TRIP_ORE) return null;
    var created = num(raw && raw.createdAt, 0);
    return {
      id: (raw && raw.id) || uid(),
      date: ymdOf(date),
      amount: amount,
      addedBy: normalizeName(raw && raw.addedBy).slice(0, 30) || null,
      createdAt: created,
      updatedAt: num(raw && raw.updatedAt, created)
    };
  }
  function normalizeTrips (raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    raw.forEach(function (t) {
      var trip = normalizeTrip(t);
      if (trip) out.push(trip);
    });
    return out;
  }
  /* Rettes beløp eller dato på begge telefonene samtidig, vinner den siste. */
  function mergeTrips (a, b) {
    var base = pickNewer(a, b, 'updatedAt');
    return {
      id: a.id,
      date: base.date,
      amount: base.amount,
      addedBy: a.addedBy || b.addedBy || null,
      createdAt: Math.min(a.createdAt, b.createdAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt)
    };
  }
  function canonicalTrips (trips, tomb) {
    var cutoff = oldestTripYmd();
    return (trips || [])
      .filter(function (t) { return !((tomb && tomb.trips) || {})[t.id] && t.date >= cutoff; })
      .sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? -1 : 1;
        if (a.createdAt !== b.createdAt) return a.createdAt - b.createdAt;
        return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
      });
  }

  /* ---------- lagrede ukesmenyer ----------
   * En lagret uke er et oppsett du kan hente fram igjen: sju dager med rett og
   * notat. Den peker på oppskriftene, så retter som er slettet siden du lagret
   * hoppes over når uken settes inn igjen. */

  function normalizeSavedDays (raw) {
    var out = [];
    for (var d = 0; d < 7; d++) {
      var src = (Array.isArray(raw) && raw[d]) || {};
      out.push({
        recipeId: normalizeName(src.recipeId).slice(0, 40),
        recipeName: normalizeName(src.recipeName).slice(0, 80),
        note: normalizeName(src.note).slice(0, 80)
      });
    }
    return out;
  }
  function normalizeSavedMenu (raw, idx) {
    var name = normalizeName(raw && raw.name).slice(0, 40);
    if (!name) return null;
    var created = num(raw && raw.createdAt, idx + 1);
    return {
      id: (raw && raw.id) || uid(),
      name: name,
      days: normalizeSavedDays(raw && raw.days),
      createdAt: created,
      updatedAt: num(raw && raw.updatedAt, created)
    };
  }
  function normalizeSavedMenus (raw) {
    var out = [];
    if (!Array.isArray(raw)) return out;
    raw.forEach(function (m, idx) {
      var menu = normalizeSavedMenu(m, idx);
      if (menu) out.push(menu);
    });
    return out;
  }
  /* En lagret uke redigeres sjelden, så det holder med én klokke for hele. */
  function mergeSavedMenus (a, b) {
    var base = pickNewer(a, b, 'updatedAt');
    return {
      id: a.id,
      name: base.name,
      days: base.days,
      createdAt: Math.min(a.createdAt, b.createdAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt)
    };
  }

  function emptyTombstones () { return { lists: {}, items: {}, recipes: {}, savedMenus: {}, trips: {} }; }

  function normalizeTombstones (raw) {
    var out = emptyTombstones();
    ['lists', 'items', 'recipes', 'savedMenus', 'trips'].forEach(function (kind) {
      var src = raw && raw[kind];
      if (!src || typeof src !== 'object') return;
      Object.keys(src).forEach(function (id) {
        var ts = num(src[id], 0);
        if (ts > 0) out[kind][id] = ts;
      });
    });
    return out;
  }
  function mergeTombstones (a, b) {
    var out = emptyTombstones();
    ['lists', 'items', 'recipes', 'savedMenus', 'trips'].forEach(function (kind) {
      [a && a[kind], b && b[kind]].forEach(function (src) {
        if (!src) return;
        Object.keys(src).forEach(function (id) {
          out[kind][id] = Math.max(out[kind][id] || 0, src[id]);
        });
      });
    });
    return out;
  }
  function pruneTombstones (tomb) {
    var cutoff = Date.now() - TOMBSTONE_TTL;
    var out = emptyTombstones();
    ['lists', 'items', 'recipes', 'savedMenus', 'trips'].forEach(function (kind) {
      /* En eldre tilstand kan mangle en av typene – da er det bare ingenting å rydde. */
      var src = (tomb && tomb[kind]) || {};
      Object.keys(src).forEach(function (id) {
        if (src[id] >= cutoff) out[kind][id] = src[id];
      });
    });
    return out;
  }
  function tombstone (kind, id) {
    if (!state.tombstones) state.tombstones = emptyTombstones();
    if (!state.tombstones[kind]) state.tombstones[kind] = {};
    state.tombstones[kind][id] = Date.now();
  }

  function byField (field) {
    return function (a, b) {
      if (a[field] !== b[field]) return a[field] - b[field];
      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
    };
  }

  /* ---------- mengder i varenavn ----------
   * En vare fra en oppskrift heter «kyllinglårfilet (800 g)» – mengden står i
   * navnet. Uten å se inn i parentesen er «(800 g)» og «(400 g)» to ulike
   * varer, og de havnet på hver sin rad. Her leses mengden ut, slik at like
   * varer kan legges sammen: 800 g + 400 g blir 1200 g. */

  /* Vekt og volum kan regnes om innbyrdes. Faktoren er mot g eller ml. */
  var AMOUNT_UNITS = {
    g: ['w', 1], gram: ['w', 1], hg: ['w', 100], kg: ['w', 1000],
    ml: ['v', 1], cl: ['v', 10], dl: ['v', 100], l: ['v', 1000], liter: ['v', 1000]
  };
  /* Enhetene vi skriver ut når to ulike enheter slås sammen – største først. */
  var AMOUNT_LADDER = { w: [['kg', 1000], ['g', 1]], v: [['l', 1000], ['dl', 100], ['ml', 1]] };
  /* Andre enheter legges bare sammen med seg selv, men entall og flertall
   * er samme enhet: 1 stilk + 2 stilker = 3 stilker. */
  var UNIT_PLURALS = {
    boks: 'bokser', 'dåse': 'dåser', pose: 'poser', skive: 'skiver', potte: 'potter',
    terning: 'terninger', bunt: 'bunter', klype: 'klyper', neve: 'never', kopp: 'kopper',
    cup: 'cups', stilk: 'stilker', stang: 'stenger', hode: 'hoder', bit: 'biter'
  };
  var UNIT_SINGULARS = { pakke: 'pk', pakker: 'pk' };
  Object.keys(UNIT_PLURALS).forEach(function (k) { UNIT_SINGULARS[UNIT_PLURALS[k]] = k; });

  var ITEM_AMOUNT_RE = /^(.*\S)\s*\(([^()]+)\)\s*$/;
  var AMOUNT_TEXT_RE = /^(\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+|[½¼¾])\s*([a-zæøå]+\.?)?$/i;

  function normalizeUnit (u) {
    u = (u || '').toLowerCase().replace(/\.$/, '');
    return UNIT_SINGULARS[u] || u;
  }

  /* Deler «kyllinglårfilet (800 g)» i navn og mengde. Er parentesen ikke en
   * mengde vi kan regne med – «(usaltet)», «(1-2 ss)» – er hele teksten navnet. */
  function splitItemName (name) {
    var m = ITEM_AMOUNT_RE.exec(name || '');
    if (!m) return { base: name || '', amount: null };
    var a = AMOUNT_TEXT_RE.exec(m[2].trim());
    var value = a ? parseNum(a[1]) : null;
    if (value === null || !(value > 0)) return { base: name, amount: null };
    var unit = normalizeUnit(a[2]);
    var conv = AMOUNT_UNITS[unit];
    return {
      base: m[1],
      amount: { value: value, unit: unit, family: conv ? conv[0] : 'u:' + unit, factor: conv ? conv[1] : 1 }
    };
  }

  function formatAmountValue (n) {
    var r = Math.round(n * 100) / 100;
    if (r >= 100) r = Math.round(r);
    return String(r).replace('.', ',');
  }

  /* Legger sammen to mengder av samme slag. Antallet på raden telles med:
   * «kjøttdeig (400 g)» × 2 er 800 g. Samme enhet beholdes; ulike enheter
   * skrives i den største av dem – 800 g + 1 kg blir 1,8 kg – men aldri som
   * et tall under 1, så 300 g + 0,5 kg blir 800 g og ikke 0,8 kg. */
  function combineAmounts (a, aQty, b, bQty) {
    var total = a.value * a.factor * aQty + b.value * b.factor * bQty;
    var unit, factor;
    if (a.unit === b.unit) {
      unit = a.unit; factor = a.factor;
    } else {
      var ladder = AMOUNT_LADDER[a.family];
      var top = Math.max(a.factor, b.factor);
      var i = 0;
      while (i < ladder.length - 1 && ladder[i][1] > top) i++;
      while (i < ladder.length - 1 && total / ladder[i][1] < 1) i++;
      unit = ladder[i][0]; factor = ladder[i][1];
    }
    var value = total / factor;
    if (Math.abs(value - 1) > 1e-9 && UNIT_PLURALS[unit]) unit = UNIT_PLURALS[unit];
    return formatAmountValue(value) + (unit ? ' ' + unit : '');
  }

  /* To varer med samme navn (og samme avkrysset-status) i samme liste slås
   * sammen til én rad. Uten mengde legges antallet sammen – akkurat som når du
   * skriver inn den samme varen to ganger selv. Med mengde legges mengdene
   * sammen: «(800 g)» og «(400 g)» blir én rad med «(1200 g)». Den som ble lagt
   * inn først beholdes, slik at begge telefoner ender på nøyaktig samme rad.
   *
   * Raden som blir stående får et tidsstempel som er høyere enn begge de to
   * den ble laget av. Ellers kunne en eldre kopi av den samme raden på den
   * andre telefonen vunnet ved neste synkronisering – og tatt med seg den
   * gamle mengden. */
  function itemMergeKey (it) {
    var parts = splitItemName(it.name);
    return (parts.amount
      ? 'a|' + parts.base.toLowerCase() + '|' + parts.amount.family
      : 'n|' + it.name.toLowerCase()) + '|' + (it.checked ? '1' : '0');
  }
  function dedupeItems (items, tomb) {
    var seen = {};
    var out = [];
    items.forEach(function (it) {
      var key = itemMergeKey(it);
      var keep = seen[key];
      if (!keep) {
        seen[key] = it;
        out.push(it);
        return;
      }
      var mine = splitItemName(keep.name);
      var theirs = splitItemName(it.name);
      if (mine.amount && theirs.amount) {
        keep.name = mine.base + ' (' + combineAmounts(mine.amount, keep.qty, theirs.amount, it.qty) + ')';
        keep.qty = 1;
      } else {
        keep.qty = Math.min(999, keep.qty + it.qty);
      }
      keep.updatedAt = Math.max(keep.updatedAt, it.updatedAt) + 1;
      tomb.items[it.id] = Math.max(tomb.items[it.id] || 0, Date.now());
    });
    return out;
  }

  /* Bringer en tilstand på normalform: slettede rader fjernet, fast
   * rekkefølge, ingen duplikater. Kjøres etter hver sammenslåing, slik at
   * begge telefonene får bitidentiske dokumenter når de er enige. */
  function canonicalState (s) {
    var tomb = pruneTombstones(s.tombstones || emptyTombstones());
    var lists = s.lists
      .filter(function (l) { return !tomb.lists[l.id]; })
      .sort(byField('createdAt'))
      .map(function (l) {
        var items = l.items
          .filter(function (i) { return !tomb.items[i.id]; })
          .sort(byField('addedAt'));
        return {
          id: l.id,
          name: l.name,
          createdAt: l.createdAt,
          updatedAt: l.updatedAt,
          items: dedupeItems(items, tomb)
        };
      });
    var recipes = s.recipes
      .filter(function (r) { return !tomb.recipes[r.id]; })
      .sort(byField('createdAt'));
    var savedMenus = (s.savedMenus || [])
      .filter(function (m) { return !tomb.savedMenus[m.id]; })
      .sort(byField('createdAt'));
    return {
      lists: lists, recipes: recipes, menu: canonicalMenu(s.menu), savedMenus: savedMenus,
      trips: canonicalTrips(s.trips, tomb), tombstones: tomb
    };
  }

  /* Den aller første listen får en FAST id. Ellers ville de to telefonene laget
   * hver sin «Handleliste» første gang de kobler seg til, og endt opp med å se
   * på hver sin tomme fane i stedet for den samme listen. */
  var DEFAULT_LIST_ID = 'liste-1';

  function ensureAtLeastOneList (s) {
    if (!Array.isArray(s.menu)) s.menu = [];
    if (!Array.isArray(s.savedMenus)) s.savedMenus = [];
    if (!Array.isArray(s.trips)) s.trips = [];
    if (!s.lists.length) {
      s.lists.push({ id: DEFAULT_LIST_ID, name: 'Handleliste', createdAt: 0, updatedAt: 0, items: [] });
    }
    return s;
  }

  /* Velger den siden som ble endret sist. Er tidsstemplene helt like, velger
   * vi på en måte som gir samme resultat på begge telefoner. */
  function pickNewer (a, b, field) {
    if (a[field] > b[field]) return a;
    if (b[field] > a[field]) return b;
    return stableJson(a) >= stableJson(b) ? a : b;
  }

  function mergeById (mine, theirs, mergeOne) {
    var byId = {};
    var order = [];
    mine.forEach(function (x) { byId[x.id] = x; order.push(x.id); });
    theirs.forEach(function (y) {
      if (byId[y.id]) byId[y.id] = mergeOne(byId[y.id], y);
      else { byId[y.id] = y; order.push(y.id); }
    });
    return order.map(function (id) { return byId[id]; });
  }

  function mergeItems (a, b) {
    /* Navn og antall følger siste endring; avkrysset følger sin egen klokke,
     * slik at «han krysset av mens hun justerte antallet» beholder begge. */
    var base = pickNewer(a, b, 'updatedAt');
    var chk = pickNewer(a, b, 'checkedAt');
    return {
      id: a.id,
      name: base.name,
      qty: base.qty,
      checked: chk.checked,
      checkedBy: chk.checkedBy,
      addedBy: a.addedBy || b.addedBy || null,
      addedAt: Math.min(a.addedAt, b.addedAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt),
      checkedAt: Math.max(a.checkedAt, b.checkedAt)
    };
  }

  function mergeLists (a, b) {
    var base = pickNewer(a, b, 'updatedAt');
    return {
      id: a.id,
      name: base.name,
      createdAt: Math.min(a.createdAt, b.createdAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt),
      items: mergeById(a.items, b.items, mergeItems)
    };
  }

  function mergeRecipes (a, b) {
    var base = pickNewer(a, b, 'updatedAt');
    /* Terningkastet har sin egen klokke, slik at «hun ga den en femmer» ikke
     * blir borte fordi han rettet et steg i mellomtiden. */
    var rated = pickNewer(a, b, 'ratedAt');
    return {
      id: a.id,
      name: base.name,
      portions: base.portions,
      minutes: base.minutes,
      ingredients: base.ingredients,
      steps: base.steps,
      rating: rated.rating,
      ratedAt: Math.max(a.ratedAt, b.ratedAt),
      hasImage: pickNewer(a, b, 'imageAt').hasImage,
      imageAt: Math.max(a.imageAt, b.imageAt),
      createdAt: Math.min(a.createdAt, b.createdAt),
      updatedAt: Math.max(a.updatedAt, b.updatedAt)
    };
  }

  function mergeStates (mine, theirs) {
    return ensureAtLeastOneList(canonicalState({
      lists: mergeById(mine.lists, theirs.lists, mergeLists),
      recipes: mergeById(mine.recipes, theirs.recipes, mergeRecipes),
      menu: mergeById(mine.menu || [], theirs.menu || [], mergeMenuDays),
      savedMenus: mergeById(mine.savedMenus || [], theirs.savedMenus || [], mergeSavedMenus),
      trips: mergeById(mine.trips || [], theirs.trips || [], mergeTrips),
      tombstones: mergeTombstones(mine.tombstones, theirs.tombstones)
    }));
  }
  /* En ingrediens har både et antall (2 egg) og en fritekst-mengde (500 g).
   * Mengden er fritekst med vilje – håndskrevne oppskrifter bruker alt fra
   * «1 ss» til «en neve», og det skal ikke måtte presses inn i et tall. */
  function normalizeIngredients (raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map(function (ing) {
      var qty = normalizeQty(ing && ing.qty);
      return {
        name: normalizeName(ing && ing.name),
        qty: qty,
        amount: normalizeName(ing && ing.amount).slice(0, 40),
        /* «counted» sier om tallet er et antall som skal skaleres. Eldre data
         * uten feltet tolkes ut fra antallet: står det mer enn én, var det et
         * antall noen har skrevet inn. */
        counted: (ing && typeof ing.counted === 'boolean') ? ing.counted : qty > 1
      };

  /* ---- Skalering av mengder ----

   * «1/2», og resten blir stående igjen som tekst. */

     * ganger, både i mengden og i antallet. */
    if (ing.amount) {
      return { name: ing.name, qty: ing.qty, amount: scaleAmount(ing.amount, factor), counted: ing.counted };
    }

   * i lasagnen betyr mer enn baconet. Finner vi verken kjøtt eller fisk,

  var PROTEIN_RULES = [
    [/kj(ø|o)ttdeig|karbonadedeig/, 'Kjøttdeig'],
    [/kylling/, 'Kylling'],
    [/kalkun/, 'Kalkun'],
    [/pekingand|andebryst|andel(å|a)r/, 'And'],
    [/svinek|ribbe|nakkekotelett|koteletter|skinke/, 'Svin'],
    [/lammel(å|a)r|lammestek|lammekj(ø|o)tt|lammeskav|lammestrimler|\blam\b/, 'Lam'],
    [/reinsdyr|reinskav/, 'Reinsdyr'],
    [/\belg\b|elgkj(ø|o)tt|\bhjort|r(å|a)dyr|\bvilt/, 'Vilt'],
    [/storfe|h(ø|o)yrygg|oksekj(ø|o)tt|\bokse|biff|entrec(ô|o)te|indrefilet|ytrefilet/, 'Storfe'],
    [/bacon|guanciale|pancetta/, 'Bacon'],
    [/p(ø|o)lse|chorizo/, 'Pølse'],
    [/torsk/, 'Torsk'],
    [/laks/, 'Laks'],
    [/reker|scampi|kamskjell|blåskjell/, 'Skalldyr'],

  function mainProtein (recipe) {
    var names = recipe.ingredients
      .map(function (i) { return i.name.toLowerCase(); })
      .filter(function (n) { return !NOT_PROTEIN.test(n); });
    for (var r = 0; r < PROTEIN_RULES.length; r++) {
      var rule = PROTEIN_RULES[r];

  }

    if (raw && Array.isArray(raw.lists)) {

    }

    var today = dateOnly(new Date());

      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k === 'disabled') { if (attrs[k]) node.disabled = true; }
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  var ICON_CAMERA ='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5h3l1.6-2.4h8.8L18 8.5h3v11H3Z"></path><circle cx="12" cy="13.6" r="3.4"></circle></svg>';

  /* Terning med riktig antall øyne, tegnet som SVG. */
  var DIE_PIPS = {
    1: [[12, 12]],
    2: [[8, 8], [16, 16]],
    3: [[8, 8], [12, 12], [16, 16]],
    4: [[8, 8], [16, 8], [8, 16], [16, 16]],
    5: [[8, 8], [16, 8], [12, 12], [8, 16], [16, 16]],

  function dieSvg (n, size) {
    var pips = (DIE_PIPS[n] || []).map(function (p) {
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="1.85" fill="currentColor"></circle>';

      '<rect x="2.5" y="2.5" width="19" height="19" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>' +
      pips + '</svg>';
  }

  var ICON_PLUS_BIG ='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>';

  var root = el('div', { id: 'root' });
  document.body.appendChild(root);

  /* ============================== rendering ============================== */

  var summaryEl = null;
  var listSectionEl = null;
  var footerRowEl = null;

  function render () {
    root.innerHTML = '';
    var list = getActiveList();

    summaryEl = el('p', { text: itemsSummary(list) });
    var brand = el('div', { class: 'brand' }, [
      el('div', { class: 'brand-mark', html: ICON_CART }),
      el('div', {}, [
        el('h1', { text: 'Handleliste' }),
        summaryEl
      ])
    ]);

    var who = getName()
      ? el('div', { class: 'who' }, [
          el('span', { class: 'avatar', text: initials(getName()) }),
          el('span', { text: getName() }),
          el('button', { text: 'bytt', onclick: function () { showNameModal(true); } })
        ])
      : el('div', { class: 'who' }, [ el('button', { text: 'skriv inn navn', onclick: function () { showNameModal(true); } }) ]);

    root.appendChild(el('header', { class: 'app-header' }, [brand, who]));

    var status = el('div', { class: 'status-row', 'data-state': statusState }, [
      el('span', { class: 'status-dot' }),
      el('span', { text: statusText() })
    ]);
    root.appendChild(status);
    root.appendChild(buildViewSwitch());

    listSectionEl = null;
    footerRowEl = null;

    if (currentView === 'recipes') {
      root.appendChild(buildRecipesView(list));
    } else if (currentView === 'menu') {
      root.appendChild(buildMenuView(list));
    } else if (currentView === 'costs') {
      root.appendChild(buildCostsView());
    } else {
      root.appendChild(buildTabsRow(list));
      root.appendChild(buildAddForm(list));

      listSectionEl = buildList(list);
      root.appendChild(listSectionEl);

      var checkedCount = list.items.filter(function (i) { return i.checked; }).length;
      if (checkedCount > 0) {
        footerRowEl = el('div', { class: 'footer-row' }, [
          el('button', { class: 'clear-btn', text: 'Tøm avkryssede (' + checkedCount + ')', onclick: function () { clearChecked(); } })
        ]);
        root.appendChild(footerRowEl);
      }

      /* Alltid her, også når ingenting er krysset av – for den som handlet
       * uten å bruke listen, eller som har slått av spørsmålet. */
      var tripBtn = el('button', { type: 'button', class: 'link-btn trip-link', text: 'Registrer handletur' });
      tripBtn.addEventListener('click', function () { showTripModal(null); });
      root.appendChild(el('div', { class: 'trip-row' }, [tripBtn]));
    }

    var hint = el('p', { class: 'hint' });
    hint.appendChild(document.createTextNode('Listene oppdateres automatisk på begge telefoner. Installer appen på hjemskjermen for å åpne den direkte – den virker også uten nett. '));
    var reconnectBtn = el('button', { class: 'link-btn', type: 'button', text: 'Endre tilkobling' });
    reconnectBtn.addEventListener('click', function () {
      showConfirmModal({
        title: 'Endre tilkobling?',
        description: 'Denne telefonen kobles fra den delte listen. Du kan koble til igjen med samme eller en annen Firebase-konfigurasjon.',
        confirmLabel: 'Koble fra',
        cancelLabel: 'Avbryt',
        danger: true,
        onConfirm: function () { reconnect(); }
      });
    });
    hint.appendChild(reconnectBtn);
    root.appendChild(hint);
    /* Versjonsnummeret bakes inn i filen når den lages, og endres hver gang
     * filene må lastes opp på nytt. Da kan du se på telefonen om den kjører
     * den siste versjonen du la ut. */
    root.appendChild(el('p', { class: 'version', text: 'Versjon ' + APP_VERSION }));

    if (!getName()) showNameModal(false);
  }

  // Patches just the item list (and the header count + "tøm avkryssede" footer) without
  // touching the header, tabs or add-form. This is what keeps the add-form's text input
  // (and, critically, the on-screen keyboard on a phone) alive across add/check/delete —
  // a full render() replaces that input with a brand-new DOM node, and re-focusing a new
  // node programmatically does not reliably reopen the keyboard on real phones.
  function renderListOnly () {
    if (currentView !== 'lists' || !listSectionEl || !listSectionEl.parentNode) { render(); return; }
    var list = getActiveList();
    if (summaryEl) summaryEl.textContent = itemsSummary(list);

    var parent = listSectionEl.parentNode;
    var newListSection = buildList(list);
    parent.replaceChild(newListSection, listSectionEl);
    listSectionEl = newListSection;

    if (footerRowEl && footerRowEl.parentNode) {
      footerRowEl.parentNode.removeChild(footerRowEl);
      footerRowEl = null;
    }
    var checkedCount = list.items.filter(function (i) { return i.checked; }).length;
    if (checkedCount > 0) {
      footerRowEl = el('div', { class: 'footer-row' }, [
        el('button', { class: 'clear-btn', text: 'Tøm avkryssede (' + checkedCount + ')', onclick: function () { clearChecked(); } })
      ]);
      if (listSectionEl.nextSibling) parent.insertBefore(footerRowEl, listSectionEl.nextSibling);
      else parent.appendChild(footerRowEl);
    }
  }

  function buildViewSwitch () {
    /* Fire faner på én rad. Korte navn er det som får dem til å passe på en
     * telefon – «Oppskrifter» alene tok nesten en fjerdedel av bredden. */
    var row = el('div', { class: 'view-switch' });
    [
      { key: 'lists', label: 'Lister' },
      { key: 'menu', label: 'Uka' },
      { key: 'recipes', label: 'Retter' },
      { key: 'costs', label: 'Kostnad' }
    ].forEach(function (tab) {
      var btn = el('button', { type: 'button', class: currentView === tab.key ? 'active' : '', text: tab.label });
      btn.addEventListener('click', function () { setView(tab.key); });
      row.appendChild(btn);
    });
    return row;
  }

  function itemsSummary (list) {
    var total = list.items.length;
    var left = list.items.filter(function (i) { return !i.checked; }).length;
    if (total === 0) return list.name;
    return list.name + ' – ' + left + ' av ' + total + ' igjen';
  }

  function statusText () {
    switch (statusState) {
      case 'connecting': return 'Kobler til …';
      case 'saving': return 'Lagrer …';
      case 'saved': return 'Lagret – synkronisert';
      case 'offline': return 'Frakoblet – viser sist lagrede liste';
      case 'pending': return 'Frakoblet – endringene sendes når nettet er tilbake';
      case 'error': return 'Mistet kontakt – prøver igjen …';
      default: return 'Klar';
    }
  }

  function buildTabsRow (activeList) {
    var row = el('div', { class: 'list-tabs' });
    state.lists.forEach(function (l) {
      row.appendChild(buildTab(l));
    });
    var addTab = el('button', { class: 'tab tab-add', type: 'button' }, [ el('span', { class: 'tab-name', text: '+ Ny liste' }) ]);
    addTab.addEventListener('click', showCreateListModal);
    row.appendChild(addTab);
    return row;
  }

  function buildTab (list) {
    var isActive = list.id === activeListId;
    if (!isActive) {
      var btn = el('button', { class: 'tab', type: 'button' }, [ el('span', { class: 'tab-name', text: list.name }) ]);
      btn.addEventListener('click', function () { setActiveList(list.id); });
      return btn;
    }
    var kids = [ el('span', { class: 'tab-name', text: list.name }) ];
    var editBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Endre navn på listen', html: ICON_PENCIL });
    editBtn.addEventListener('click', function () { showRenameListModal(list); });
    kids.push(editBtn);
    if (state.lists.length > 1) {
      var delBtn = el('button', { class: 'tab-icon-btn', type: 'button', 'aria-label': 'Slett listen', html: ICON_TRASH });
      delBtn.addEventListener('click', function () { confirmDeleteList(list); });
      kids.push(delBtn);
    }
    return el('div', { class: 'tab active' }, kids);
  }

  function buildAddForm (list) {
    if (draftQty < 1) draftQty = 1;
    var nameInput = el('input', { type: 'text', name: 'itemName', placeholder: 'Legg til vare …', autocomplete: 'off', maxlength: '80', value: draftName });
    nameInput.addEventListener('input', function () { draftName = nameInput.value; });

    var qtyValue = el('span', { class: 'qty-value', text: String(draftQty) });
    var minusBtn = el('button', { type: 'button', 'aria-label': 'Reduser antall' , html: ICON_MINUS });
    var plusBtn = el('button', { type: 'button', 'aria-label': 'Øk antall', html: ICON_PLUS });
    function syncMinus () { minusBtn.disabled = draftQty <= 1; }
    minusBtn.addEventListener('click', function () { if (draftQty > 1) { draftQty--; qtyValue.textContent = String(draftQty); syncMinus(); } });
    plusBtn.addEventListener('click', function () { if (draftQty < 999) { draftQty++; qtyValue.textContent = String(draftQty); syncMinus(); } });
    syncMinus();
    var stepper = el('div', { class: 'qty-stepper' }, [minusBtn, qtyValue, plusBtn]);

    var addBtn = el('button', { class: 'add-btn', type: 'submit', 'aria-label': 'Legg til vare', html: ICON_PLUS_BIG });
    var form = el('form', { class: 'add-form' }, [
      el('div', { class: 'fields' }, [nameInput, stepper]),
      addBtn
    ]);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var nameToAdd = nameInput.value;
      var qtyToAdd = draftQty;
      draftName = '';
      draftQty = 1;
      // Clear the SAME input node in place instead of letting a re-render replace it —
      // addItem() below only patches the list section now, so this node (and the phone's
      // on-screen keyboard) never loses focus.
      nameInput.value = '';
      qtyValue.textContent = '1';
      syncMinus();
      addItem(list.id, nameToAdd, qtyToAdd);
      nameInput.focus();
    });
    return form;
  }

  function buildList (list) {
    var section = el('section', { class: 'list-section' });
    if (list.items.length === 0) {
      section.appendChild(el('div', { class: 'empty-state' }, [
        el('h3', { text: 'Listen er tom' }),
        el('p', { text: 'Legg til den første varen i «' + list.name + '».' })
      ]));
      return section;
    }
    var unchecked = list.items.filter(function (i) { return !i.checked; });
    var checked = list.items.filter(function (i) { return i.checked; });

    if (unchecked.length) section.appendChild(buildGroup(list, unchecked));
    if (checked.length) {
      section.appendChild(el('p', { class: 'group-label', text: 'Kjøpt' }));
      section.appendChild(buildGroup(list, checked));
    }
    return section;
  }

  function buildGroup (list, items) {
    var ul = el('ul', { class: 'item-list' });
    items.forEach(function (item) { ul.appendChild(buildItem(list, item)); });
    return ul;
  }

  function buildItem (list, item) {
    var meta = '';
    if (item.checked && item.checkedBy) meta = 'Krysset av ' + item.checkedBy;
    else if (item.addedBy) meta = 'Lagt til av ' + item.addedBy;

    var body = el('div', { class: 'item-body' }, [
      el('span', { class: 'item-name', text: item.name }),
      meta ? el('div', { class: 'item-meta', text: meta }) : null
    ]);

    var checkBtn = el('button', { class: 'check-btn', 'aria-label': 'Kryss av ' + item.name, html: ICON_CHECK });

    var qtyControl;
    if (!item.checked) {
      var qtyValue = el('span', { class: 'qty-value', text: String(item.qty) });
      var minusBtn = el('button', { type: 'button', 'aria-label': 'Reduser antall for ' + item.name, html: ICON_MINUS, disabled: item.qty <= 1 });
      var plusBtn = el('button', { type: 'button', 'aria-label': 'Øk antall for ' + item.name, html: ICON_PLUS });
      minusBtn.addEventListener('click', function () { changeQty(list.id, item.id, -1); });
      plusBtn.addEventListener('click', function () { changeQty(list.id, item.id, 1); });
      qtyControl = el('div', { class: 'qty-stepper sm' }, [minusBtn, qtyValue, plusBtn]);
    } else {
      qtyControl = el('span', { class: 'item-qty static', text: '× ' + item.qty });
    }

    var li = el('li', { class: 'item' + (item.checked ? ' is-checked' : '') });
    [checkBtn, body, qtyControl].forEach(function (c) { li.appendChild(c); });

    checkBtn.addEventListener('click', function () { toggleItem(list.id, item.id); });
    var delBtn = el('button', { class: 'del-btn', 'aria-label': 'Slett ' + item.name, html: ICON_TRASH });
    delBtn.addEventListener('click', function () { deleteItem(list.id, item.id); });
    li.appendChild(delBtn);
    return li;
  }

  /* Sorterer og filtrerer oppskriftene slik listen skal vises. */
  function visibleRecipes () {
    var q = recipeQuery.trim().toLowerCase();
    var list = state.recipes.filter(function (r) {
      if (!q) return true;
      /* Søket ser på navnet OG ingrediensene, så «kylling» finner retter som
       * har kylling i seg selv om ordet ikke står i tittelen. */
      if (r.name.toLowerCase().indexOf(q) !== -1) return true;
      return r.ingredients.some(function (i) { return i.name.toLowerCase().indexOf(q) !== -1; });
    });

    if (recipeSort === 'name') {
      list.sort(function (a, b) { return a.name.localeCompare(b.name, 'nb'); });
    } else if (recipeSort === 'new') {
      list.sort(function (a, b) {
        if (a.createdAt !== b.createdAt) return b.createdAt - a.createdAt;
        return a.name.localeCompare(b.name, 'nb');
      });
    } else {
      /* Terningkast: best først, og de uten terning nederst. */
      list.sort(function (a, b) {
        var ra = a.rating || 0, rb = b.rating || 0;
        if (ra !== rb) return rb - ra;
        return a.name.localeCompare(b.name, 'nb');
      });
    }
    return list;
  }

  /* ============================== ukesmeny: visning ============================== */

  function weekRangeLabel (start) {
    var end = addDays(start, 6);
    if (start.getMonth() === end.getMonth()) {
      return start.getDate() + '.–' + end.getDate() + '. ' + MONTH_NAMES[end.getMonth()];
    }
    return start.getDate() + '. ' + MONTH_SHORT[start.getMonth()] +
           ' – ' + end.getDate() + '. ' + MONTH_SHORT[end.getMonth()];
  }

  function buildMenuView (activeList) {
    var section = el('section', { class: 'list-section' });
    var week = currentMenuWeek();

    var prevBtn = el('button', {
      type: 'button', class: 'week-nav', html: ICON_CHEVRON_LEFT,
      'aria-label': 'Denne uken', disabled: menuWeekOffset === 0
    });
    var nextBtn = el('button', {
      type: 'button', class: 'week-nav', html: ICON_CHEVRON_RIGHT,
      'aria-label': 'Neste uke', disabled: menuWeekOffset === 1
    });
    prevBtn.addEventListener('click', function () { menuWeekOffset = 0; render(); });
    nextBtn.addEventListener('click', function () { menuWeekOffset = 1; render(); });

    section.appendChild(el('div', { class: 'week-head' }, [
      prevBtn,
      el('div', { class: 'week-title' }, [
        el('strong', { text: week.label }),
        el('span', { text: 'Uke ' + isoWeek(week.start).week + ' · ' + weekRangeLabel(week.start) })
      ]),
      nextBtn
    ]));

    if (state.recipes.length === 0) {
      section.appendChild(el('div', { class: 'empty-state' }, [
        el('h3', { text: 'Ingen oppskrifter å velge mellom' }),
        el('p', { text: 'Legg inn oppskrifter under «Retter» først – så kan du sette dem opp på ukedagene her.' })
      ]));
      return section;
    }

    var planned = plannedDays(week.key);
    var weekBtn = el('button', {
      type: 'button', class: 'menu-week-btn',
      text: planned.length
        ? 'Legg hele uken i «' + activeList.name + '» (' + planned.length + ' middager)'
        : 'Ingen middager valgt ennå',
      disabled: planned.length === 0
    });
    weekBtn.addEventListener('click', function () { confirmAddWeekToList(activeList, week); });
    section.appendChild(weekBtn);

    /* Lagre uken du har satt opp, og hent fram igjen en du har lagret før. */
    var saveBtn = el('button', {
      type: 'button', class: 'menu-mini-btn', text: 'Lagre uken',
      disabled: !weekHasPlan(week.key)
    });
    saveBtn.addEventListener('click', function () { showSaveWeekModal(week); });
    var loadBtn = el('button', {
      type: 'button', class: 'menu-mini-btn',
      text: state.savedMenus.length ? 'Lagrede uker (' + state.savedMenus.length + ')' : 'Lagrede uker',
      disabled: state.savedMenus.length === 0
    });
    loadBtn.addEventListener('click', function () { showSavedMenusModal(week); });
    section.appendChild(el('div', { class: 'menu-mini-row' }, [saveBtn, loadBtn]));

    if (planned.length >= 2) {
      section.appendChild(el('p', { class: 'menu-hint', text: 'Hold inne en dag for å dra middagen til en annen dag.' }));
    }

    var today = dateOnly(new Date());
    var daysEl = el('div', { class: 'menu-days' });
    for (var day = 0; day < 7; day++) {
      daysEl.appendChild(buildMenuDayCard(activeList, week, day, today));
    }
    section.appendChild(daysEl);
    return section;
  }

  function buildMenuDayCard (activeList, week, day, today) {
    var date = addDays(week.start, day);
    var entry = getMenuDay(week.key, day);
    var recipe = entry.recipeId ? findRecipe(entry.recipeId) : null;

    var head = el('div', { class: 'menu-day-head' }, [
      el('span', { class: 'menu-day-name', text: DAY_NAMES[day] }),
      el('span', { class: 'menu-day-date', text: date.getDate() + '. ' + MONTH_SHORT[date.getMonth()] })
    ]);

    var dishKids = [];
    if (recipe) {
      var dishEl = el('span', { class: 'menu-dish-name', text: recipe.name });
      if (recipe.rating) {
        dishEl.appendChild(el('span', { class: 'die-mark', html: dieSvg(recipe.rating, 15) }));
      }
      dishKids.push(dishEl);
    } else if (entry.recipeId) {
      /* Oppskriften er slettet, men dagen husker fortsatt hva som var planlagt. */
      dishKids.push(el('span', { class: 'menu-dish-name is-gone', text: (entry.recipeName || 'Oppskrift') + ' (slettet)' }));
    } else {
      dishKids.push(el('span', { class: 'menu-dish-name is-empty', text: 'Velg middag' }));
    }
    var dish = el('div', { class: 'menu-day-dish' }, dishKids);

    var kids = [head, dish];
    if (recipe && recipe.minutes) {
      kids.push(el('div', { class: 'menu-day-meta' }, [
        el('span', { class: 'time-icon', html: ICON_CLOCK }),
        el('span', { text: 'ca. ' + formatDuration(recipe.minutes) })
      ]));
    }
    if (entry.note) kids.push(el('div', { class: 'menu-day-note', text: entry.note }));

    var main = el('button', { type: 'button', class: 'menu-day-main' }, kids);
    main.addEventListener('click', function () {
      /* Et trykk som egentlig var en flytting skal ikke åpne dagen etterpå. */
      if (dragJustEnded) return;
      /* Har dagen en middag, er det oppskriften du vil se. Bytte, flytte og
       * notat ligger øverst i oppskriften. Tomme dager åpner dagvinduet. */
      var current = findRecipe(getMenuDay(week.key, day).recipeId);
      if (current) { openRecipeFromDay(current, week.key, day); return; }
      showMenuDayModal(week, day, date);
    });

    var card = el('div', { class: 'menu-day' + (sameDay(date, today) ? ' is-today' : '') }, [main]);
    card.setAttribute('data-day', String(day));
    if (recipe || entry.recipeId) attachMenuDrag(card, main, week, day);

    if (recipe) {
      var addBtn = el('button', {
        type: 'button', class: 'menu-day-add', html: ICON_CART,
        'aria-label': 'Legg ' + recipe.name + ' i handlelisten'
      });
      addBtn.addEventListener('click', function () {
        /* Listen og retten hentes på nytt i det du trykker. En synkronisering
         * fra den andre telefonen bytter ut tilstanden, og da ville varene
         * ellers havnet i en gammel kopi av listen som ingen ser. */
        var list = getActiveList();
        addRecipeToList(list, findRecipe(recipe.id) || recipe, 1);
        scheduleSave();
        flashOnCard(card, 'Lagt i «' + list.name + '»');
      });
      card.appendChild(addBtn);
    }
    return card;
  }

  /* ---------- dra en middag til en annen dag ----------
   * På telefon må vi skille mellom «jeg blar i listen» og «jeg vil flytte
   * denne dagen». Derfor starter flyttingen først når fingeren har ligget
   * stille på dagen en liten stund; beveger du den før det, er det bla.
   * Med mus finnes ikke den tvetydigheten, og dragingen starter med én gang. */

  var LONG_PRESS_MS = 220;
  var DRAG_SLOP = 9;
  var dragJustEnded = false;

  function attachMenuDrag (card, handle, week, day) {
    var holdTimer = null, startY = 0, dragging = false;
    var offset = 0, boxes = [], target = null, pointerId = null;

    /* Mens vi drar må siden slutte å bla med fingeren. */
    function blockScroll (e) { e.preventDefault(); }

    function cleanup () {
      clearTimeout(holdTimer);
      document.removeEventListener('touchmove', blockScroll);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      card.classList.remove('is-dragging');
      card.style.transform = '';
      var parent = card.parentNode;
      if (parent) {
        parent.classList.remove('is-reordering');
        Array.prototype.forEach.call(parent.children, function (c) { c.classList.remove('is-drop-target'); });
      }
      dragging = false;
      target = null;
      pointerId = null;
    }

    function beginDrag () {
      dragging = true;
      var parent = card.parentNode;
      boxes = Array.prototype.map.call(parent.children, function (c) {
        var r = c.getBoundingClientRect();
        return { node: c, day: Number(c.getAttribute('data-day')), top: r.top, bottom: r.bottom };
      });
      card.classList.add('is-dragging');
      parent.classList.add('is-reordering');
      document.addEventListener('touchmove', blockScroll, { passive: false });
    }

    function paintTarget (y) {
      target = null;
      boxes.forEach(function (b) {
        b.node.classList.remove('is-drop-target');
        if (b.node !== card && y >= b.top && y <= b.bottom) target = b;
      });
      if (target) target.node.classList.add('is-drop-target');
    }

    function onMove (e) {
      if (pointerId !== null && e.pointerId !== pointerId) return;
      var dy = e.clientY - startY;
      if (!dragging) {
        /* Fingeren beveget seg før flyttingen rakk å starte – da blar du. */
        if (Math.abs(dy) > DRAG_SLOP) {
          if (e.pointerType === 'mouse') { clearTimeout(holdTimer); beginDrag(); }
          else { cleanup(); return; }
        } else return;
      }
      offset = dy;
      card.style.transform = 'translateY(' + offset + 'px)';
      paintTarget(e.clientY);
      if (e.cancelable) e.preventDefault();
    }

    function onUp () {
      if (!dragging) { cleanup(); return; }
      var to = target ? target.day : null;
      cleanup();
      if (to === null || to === day) return;
      if (!swapMenuDishes(week.key, day, to)) return;
      /* Uten dette ville slippet også talt som et trykk og åpnet dagen. */
      dragJustEnded = true;
      setTimeout(function () { dragJustEnded = false; }, 350);
      scheduleSave();
      render();
    }

    function onCancel () { cleanup(); }

    handle.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      pointerId = e.pointerId;
      startY = e.clientY;
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancel);
      if (e.pointerType !== 'mouse') {
        holdTimer = setTimeout(function () {
          beginDrag();
          card.style.transform = 'translateY(0px)';
        }, LONG_PRESS_MS);
      }
    });
  }

  /* Liten kvittering på selve dagen. Da slipper du å bli kastet over i
   * handlelisten hver gang du legger til én dag. */
  function flashOnCard (card, message) {
    var old = card.querySelector('.menu-flash');
    if (old) old.remove();
    var flash = el('span', { class: 'menu-flash', text: message });
    card.appendChild(flash);
    setTimeout(function () { if (flash.parentNode) flash.remove(); }, 2200);
  }

  function confirmAddWeekToList (activeList, week) {
    var planned = plannedDays(week.key);
    if (!planned.length) return;
    showConfirmModal({
      title: 'Legg hele uken i handlelisten?',
      description: 'Ingrediensene fra ' + planned.length + ' middager legges i «' + activeList.name +
        '». Varer som går igjen i flere retter slås sammen til én rad.',
      confirmLabel: 'Legg til',
      cancelLabel: 'Avbryt',
      onConfirm: function () {
        /* Hentes på nytt i det du bekrefter, ikke da vinduet ble åpnet:
         * kommer det en synkronisering mens vinduet står oppe, er både listen
         * og ukesmenyen byttet ut med nye kopier. Uten dette havnet hele
         * ukas varer i en gammel liste som ikke lenger vises. */
        var list = getActiveList();
        plannedDays(week.key).forEach(function (p) { addRecipeToList(list, p.recipe, 1); });
        currentView = 'lists';
        render();
        scheduleSave();
      }
    });
  }

  /* Dagvinduet: notatet øverst, så oppskriftene. Et trykk på en oppskrift
   * velger den og lukker vinduet – å planlegge en uke skal gå fort. */
  function showMenuDayModal (week, day, date) {
    closeOverlay();
    var entry = getMenuDay(week.key, day);

    var noteInput = el('input', {
      type: 'text', class: 'menu-note-input', maxlength: '80', autocomplete: 'off',
      placeholder: 'F.eks. «rester» eller «ute og spiser»',
      value: entry.note
    });
    /* Notatet lagres mens du skriver. Lukker du vinduet med Escape eller ved å
     * trykke utenfor, er det allerede tatt vare på. */
    noteInput.addEventListener('input', function () {
      if (setMenuNote(week.key, day, noteInput.value)) scheduleSave();
    });

    var search = el('input', {
      type: 'search', class: 'menu-pick-search', autocomplete: 'off',
      placeholder: 'Søk i oppskrifter …'
    });
    var listEl = el('div', { class: 'menu-pick-list' });

    function choose (recipe) {
      setMenuDish(week.key, day, recipe);
      scheduleSave();
      closeOverlay();
      render();
    }

    function paintPicks () {
      listEl.innerHTML = '';
      var q = search.value.trim().toLowerCase();
      var found = state.recipes.filter(function (r) {
        if (!q) return true;
        if (r.name.toLowerCase().indexOf(q) !== -1) return true;
        return r.ingredients.some(function (i) { return i.name.toLowerCase().indexOf(q) !== -1; });
      });
      /* Best terningkast først – det er favorittene du setter opp på en ukedag. */
      found.sort(function (a, b) {
        var ra = a.rating || 0, rb = b.rating || 0;
        if (ra !== rb) return rb - ra;
        return a.name.localeCompare(b.name, 'nb');
      });
      if (!found.length) {
        listEl.appendChild(el('p', { class: 'menu-pick-empty', text: 'Fant ingen oppskrifter som passer.' }));
        return;
      }
      found.forEach(function (r) {
        var nameEl = el('span', { class: 'menu-pick-name', text: r.name });
        if (r.rating) nameEl.appendChild(el('span', { class: 'die-mark', html: dieSvg(r.rating, 15) }));
        var row = el('button', {
          type: 'button',
          class: 'menu-pick-row' + (r.id === entry.recipeId ? ' is-chosen' : '')
        }, [nameEl, el('span', { class: 'menu-pick-meta', text: mainProtein(r) })]);
        row.addEventListener('click', function () { choose(r); });
        listEl.appendChild(row);
      });
    }
    search.addEventListener('input', paintPicks);
    paintPicks();

    var browseBtn = el('button', { type: 'button', class: 'plan-btn browse-recipes-btn' }, [
      el('span', { class: 'plan-btn-icon', html: ICON_SEARCH }),
      el('span', { text: 'Bla gjennom Retter' })
    ]);
    browseBtn.addEventListener('click', function () { startPickForDay(week.key, day); });

    var modalKids = [
      el('h2', { text: DAY_NAMES[day] }),
      el('p', { text: date.getDate() + '. ' + MONTH_NAMES[date.getMonth()] }),
      el('span', { class: 'menu-field-label', text: 'Notat' }),
      noteInput,
      el('span', { class: 'menu-field-label', text: 'Middag' }),
      search,
      listEl,
      browseBtn
    ];

    /* Flytting uten å dra – både for den som heller vil trykke, og fordi en
     * dra-og-slipp aldri skal være eneste vei til noe. */
    if (entry.recipeId) {
      var moveBtn = el('button', { type: 'button', class: 'plan-btn' }, [
        el('span', { class: 'plan-btn-icon', html: ICON_MOVE }),
        el('span', { text: 'Flytt til en annen dag' })
      ]);
      moveBtn.addEventListener('click', function () { showMenuMoveModal(week, day); });
      modalKids.splice(2, 0, el('div', { class: 'plan-block' }, [moveBtn]));
    }

    var actions = [];
    if (entry.recipeId) {
      var clearBtn = el('button', { class: 'secondary', type: 'button', text: 'Fjern middagen' });
      clearBtn.addEventListener('click', function () { choose(null); });
      actions.push(clearBtn);
    }
    var closeBtn = el('button', { class: 'secondary', type: 'button', text: 'Lukk' });
    closeBtn.addEventListener('click', function () { closeOverlay(); render(); });
    actions.push(closeBtn);
    modalKids.push(el('div', { class: 'modal-actions' }, actions));

    var modal = el('div', { class: 'modal wide menu-day-modal' }, modalKids);
    var overlay = el('div', { class: 'overlay', id: 'modal-overlay' }, [modal]);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) { closeOverlay(); render(); } });
    document.body.appendChild(overlay);
  }

  /* ============================== kostnad: utregning ============================== */

  var MONTH_AXIS = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
  var costMode = 'weeks';          // 'weeks' | 'months'
  var costSelected = null;         // indeks i diagrammet; null = inneværende periode
  var costShowAllTrips = false;

  function capitalize (t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function daysBetween (a, b) { return Math.round((dateOnly(b) - dateOnly(a)) / 86400000); }
  function todayDate () { return dateOnly(new Date()); }

  /* Sum og antall turer mellom to datoer, begge dager tatt med. */
  function sumTrips (from, to) {
    var f = ymdOf(from), t = ymdOf(to);
    var sum = 0, count = 0;
    state.trips.forEach(function (trip) {
      if (trip.date >= f && trip.date <= t) { sum += trip.amount; count++; }
    });
    return { sum: sum, count: count };
  }

  function weekPeriods (count) {
    var mon = mondayOf(new Date());
    var out = [];
    for (var i = count - 1; i >= 0; i--) {
      var start = addDays(mon, -7 * i);
      var wk = isoWeek(start).week;
      out.push({
        kind: 'week', start: start, end: addDays(start, 6), current: i === 0,
        short: String(wk), title: 'Uke ' + wk, range: weekRangeLabel(start)
      });
    }
    return out;
  }
  function monthPeriods (count) {
    var t = todayDate();
    var out = [];
    for (var i = count - 1; i >= 0; i--) {
      var start = new Date(t.getFullYear(), t.getMonth() - i, 1);
      var m = start.getMonth(), y = start.getFullYear();
      out.push({
        kind: 'month', start: start, end: new Date(y, m + 1, 0), current: i === 0,
        short: MONTH_AXIS[m], title: capitalize(MONTH_NAMES[m]) + ' ' + y, range: ''
      });
    }
    return out;
  }

  /* Den pågående perioden teller bare til og med i dag. */
  function periodEnd (p) {
    var t = todayDate();
    return p.end > t ? t : p.end;
  }
  function periodTotals (p) { return sumTrips(p.start, periodEnd(p)); }

  /* Sammenligning med forrige periode. For en pågående periode sammenligner vi
   * like mange dager inn – ellers ser den 3. oktober ut som et stup mot hele
   * september, bare fordi oktober ikke er ferdig. */
  function previousComparable (p) {
    var t = todayDate();
    if (p.kind === 'week') {
      var ps = addDays(p.start, -7);
      var pe = p.current ? addDays(ps, daysBetween(p.start, t)) : addDays(p.end, -7);
      var wk = isoWeek(ps).week;
      var span = daysBetween(ps, pe);
      return {
        from: ps, to: pe,
        label: span >= 6 ? 'uke ' + wk
          : 'samme dager i uke ' + wk + ' (' + DAY_SHORT[0] + (span ? '–' + DAY_SHORT[span] : '') + ')'
      };
    }
    var y = p.start.getFullYear(), m = p.start.getMonth();
    var start = new Date(y, m - 1, 1);
    var dim = daysInMonth(start.getFullYear(), start.getMonth());
    var lastDay = p.current ? Math.min(t.getDate(), dim) : dim;
    var end = new Date(start.getFullYear(), start.getMonth(), lastDay);
    return {
      from: start, to: end,
      label: lastDay === dim ? MONTH_NAMES[start.getMonth()]
        : (lastDay === 1 ? '1. ' : '1.–' + lastDay + '. ') + MONTH_NAMES[start.getMonth()]
    };
  }
  function lastYearComparable (p) {
    var t = todayDate();
    var y = p.start.getFullYear() - 1, m = p.start.getMonth();
    var dim = daysInMonth(y, m);
    var lastDay = p.current ? Math.min(t.getDate(), dim) : dim;
    return {
      from: new Date(y, m, 1), to: new Date(y, m, lastDay),
      label: (lastDay === dim ? '' : (lastDay === 1 ? '1. ' : '1.–' + lastDay + '. ')) + MONTH_NAMES[m] + ' ' + y
    };
  }
  /* Er det i det hele tatt registrert noe så langt tilbake? Uten det er «0 kr i
   * fjor» et tall som later som det vet noe. */
  function hasTripsSince (d) {
    var first = state.trips.length ? state.trips[0].date : null;
    return !!first && first <= ymdOf(d);
  }
  function compareLine (curSum, cmp) {
    if (!hasTripsSince(cmp.to)) return null;
    var prev = sumTrips(cmp.from, cmp.to).sum;
    if (!prev) return 'Ingen turer ' + cmp.label + ' å sammenligne med.';
    return formatPct((curSum - prev) / prev) + ' mot ' + cmp.label + ' (' + formatKrRounded(prev) + ')';
  }

  /* Pene tall på y-aksen: 0, 1 000, 2 000 … */
  function niceStep (maxKr) {
    if (maxKr <= 0) return 500;
    var raw = maxKr / 3;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= raw) return steps[i] * mag;
    return 10 * mag;
  }

  /* ============================== kostnad: visning ============================== */

  function buildCostsView () {
    var section = el('section', { class: 'list-section' });

    var regBtn = el('button', { type: 'button', class: 'cost-register', text: '+ Registrer handletur' });
    regBtn.addEventListener('click', function () { showTripModal(null); });
    section.appendChild(regBtn);

    if (archiveProblem === 'rules') {
      section.appendChild(el('p', {
        class: 'cost-notice',
        text: 'Gamle ukesmenyer kan ikke arkiveres før de nye reglene er limt inn i Firebase. Ingenting er tapt – ukene blir liggende til reglene er på plass.'
      }));
    }

    if (!state.trips.length) {
      section.appendChild(el('div', { class: 'empty-state' }, [
        el('h3', { text: 'Ingen handleturer ennå' }),
        el('p', { text: 'Registrer hva handleturen kostet, så bygger oversikten seg opp uke for uke.' })
      ]));
      section.appendChild(buildAskTripSetting());
      return section;
    }

    section.appendChild(buildCostTiles());
    section.appendChild(buildYearLine());
    section.appendChild(buildCostChartCard());
    section.appendChild(buildTripList());
    section.appendChild(buildAskTripSetting());
    return section;
  }

  function costTile (label, value, sub) {
    return el('div', { class: 'cost-tile' }, [
      el('span', { class: 'cost-tile-label', text: label }),
      el('span', { class: 'cost-tile-value', text: value }),
      sub ? el('span', { class: 'cost-tile-sub', text: sub }) : null
    ]);
  }

  function buildCostTiles () {
    var cur = monthPeriods(1)[0];
    var curT = periodTotals(cur);
    var prevStart = new Date(cur.start.getFullYear(), cur.start.getMonth() - 1, 1);
    var prevFull = sumTrips(prevStart, new Date(cur.start.getFullYear(), cur.start.getMonth(), 0));
    var cmp = previousComparable(cur);

    var changeValue = '–', changeSub;
    if (!hasTripsSince(cmp.to)) {
      changeSub = 'ingen tall fra ' + MONTH_NAMES[prevStart.getMonth()] + ' ennå';
    } else {
      var prevLike = sumTrips(cmp.from, cmp.to).sum;
      if (prevLike) {
        changeValue = formatPct((curT.sum - prevLike) / prevLike);
        changeSub = 'mot ' + cmp.label;
      } else {
        changeSub = 'ingen turer ' + cmp.label;
      }
    }

    return el('div', { class: 'cost-tiles' }, [
      costTile(capitalize(MONTH_NAMES[cur.start.getMonth()]) + ' så langt', formatKrRounded(curT.sum),
        curT.count + (curT.count === 1 ? ' tur' : ' turer')),
      costTile(capitalize(MONTH_NAMES[prevStart.getMonth()]), formatKrRounded(prevFull.sum),
        prevFull.count + (prevFull.count === 1 ? ' tur' : ' turer')),
      costTile('Endring', changeValue, changeSub)
    ]);
  }

  /* Siste 365 dager mot de 365 før – like lange perioder, så tallene kan
   * sammenlignes direkte. */
  function buildYearLine () {
    var t = todayDate();
    var thisYear = sumTrips(addDays(t, -364), t);
    var yearBefore = { from: addDays(t, -729), to: addDays(t, -365) };
    var txt = 'Siste 12 måneder: ' + formatKrRounded(thisYear.sum);
    if (hasTripsSince(yearBefore.to)) {
      var prev = sumTrips(yearBefore.from, yearBefore.to).sum;
      txt += ' · året før: ' + formatKrRounded(prev);
      if (prev) txt += ' (' + formatPct((thisYear.sum - prev) / prev) + ')';
    } else {
      txt += ' · ingen tall fra året før ennå';
    }
    return el('p', { class: 'cost-year', text: txt });
  }

  function buildCostChartCard () {
    var periods = costMode === 'weeks' ? weekPeriods(12) : monthPeriods(12);
    var totals = periods.map(periodTotals);
    var sel = (costSelected === null || costSelected >= periods.length) ? periods.length - 1 : costSelected;

    var seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Vis per' });
    [{ key: 'weeks', label: 'Uker' }, { key: 'months', label: 'Måneder' }].forEach(function (o) {
      var b = el('button', { type: 'button', class: costMode === o.key ? 'active' : '', text: o.label, 'aria-pressed': String(costMode === o.key) });
      b.addEventListener('click', function () {
        if (costMode === o.key) return;
        costMode = o.key;
        costSelected = null;
        render();
      });
      seg.appendChild(b);
    });

    var card = el('div', { class: 'cost-card' });
    card.appendChild(el('div', { class: 'cost-card-head' }, [
      el('span', { class: 'cost-card-title', text: costMode === 'weeks' ? 'Siste 12 uker' : 'Siste 12 måneder' }),
      seg
    ]));

    var detail = el('div', { class: 'cost-detail' });
    var chart = buildBarChart(periods, totals, function (i) {
      costSelected = i;
      paintDetail(i);
    });
    function paintDetail (i) {
      chart.select(i);
      detail.innerHTML = '';
      fillCostDetail(detail, periods[i], totals[i]);
    }
    card.appendChild(chart.node);
    card.appendChild(el('p', { class: 'chart-key' }, [
      el('span', { class: 'chart-key-swatch' }),
      el('span', { text: 'Lysere søyle: ' + (costMode === 'weeks' ? 'uka' : 'måneden') + ' er ikke ferdig ennå' })
    ]));
    card.appendChild(detail);
    paintDetail(sel);
    card.appendChild(buildCostTable(periods, totals));
    return card;
  }

  function fillCostDetail (detail, p, tot) {
    detail.appendChild(el('div', {}, [
      el('span', { class: 'cost-detail-eyebrow', text: p.title + (p.current ? ' · så langt' : '') }),
      p.range ? el('span', { class: 'cost-detail-range', text: p.range }) : null
    ]));
    detail.appendChild(el('div', { class: 'cost-detail-value', text: formatKr(tot.sum) }));
    var meta = tot.count + (tot.count === 1 ? ' tur' : ' turer');
    if (tot.count > 1) meta += ' · snitt ' + formatKrRounded(tot.sum / tot.count) + ' per tur';
    detail.appendChild(el('p', { class: 'cost-detail-line', text: meta }));

    var prevLine = compareLine(tot.sum, previousComparable(p));
    if (prevLine) detail.appendChild(el('p', { class: 'cost-detail-line cmp-prev', text: prevLine }));
    if (p.kind === 'month') {
      var yearLine = compareLine(tot.sum, lastYearComparable(p));
      if (yearLine) detail.appendChild(el('p', { class: 'cost-detail-line cmp-year', text: yearLine }));
    }

    if (p.kind === 'week') {
      var menuBtn = el('button', { type: 'button', class: 'plan-btn week-menu-btn' }, [

      ]);
